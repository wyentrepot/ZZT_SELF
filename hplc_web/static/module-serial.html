<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块日志 / 烧录串口</title>
  <link rel="stylesheet" href="/static/styles.css?v=module-serial-v1">
  <style>
    /* 模块串口独立页面专属样式（与侦听台共用基础变量/按钮/面板） */
    .ms-shell { width: 100%; max-width: 1200px; margin: 0 auto; padding: 18px 20px 20px; box-sizing: border-box;
      height: 100vh; }  /* 铺满视口高度（.app-shell 已是 flex column） */
    .ms-toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin: 10px 0 14px; }
    .ms-toolbar .field { display: flex; flex-direction: column; gap: 4px; }
    .ms-toolbar label { font-size: 11px; color: var(--muted, #8ba3b8); }
    .ms-toolbar input, .ms-toolbar select {
      background: var(--panel, #0e1a26); color: var(--text, #e6eef5);
      border: 1px solid var(--line, #22384b); border-radius: 6px;
      padding: 6px 8px; font-size: 12px; font-family: Consolas, monospace;
    }
    .ms-status-line { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted, #8ba3b8); margin-bottom: 10px; }
    .ms-status-line strong { color: var(--text, #e6eef5); }
    /* 日志面板：flex 吃掉剩余空间，撑满视口不留白 */
    .ms-log-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    .ms-log-box {
      flex: 1 1 auto; min-height: 0; height: auto;
      background: #0a1118; border: 1px solid var(--line, #22384b); border-radius: 8px;
      overflow-y: auto; padding: 10px 12px;
      font: 11px/1.55 Consolas, Menlo, monospace; white-space: pre-wrap;
    }
    .ms-log-box .t { color: #5f7d94; }
    .ms-log-box .rx { color: #6fd3a8; }
    .ms-log-box .tx { color: #e8c66b; }
    .ms-log-box .ev { color: #8fb8e8; }
    .ms-log-box .err { color: #ff7b72; font-weight: bold; }
    .ms-progress { margin: 8px 0 12px; }
    .ms-hint { font-size: 11px; color: var(--faint, #5c7388); margin-top: 4px; }
    .ms-file { width: 100%; min-width: 220px; max-width: 420px; }
    .ms-log-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--faint, #5c7388); margin-bottom: 6px; }
    /* 窄屏自适应：工具行单列堆叠 */
    @media (max-width: 720px) {
      .ms-shell { padding: 12px 12px 20px; }
      .ms-toolbar { flex-direction: column; align-items: stretch; }
      .ms-toolbar .field { width: 100%; }
      .ms-file { max-width: none; }
      .ms-toolbar input, .ms-toolbar select, .ms-toolbar button { width: 100% !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell ms-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <p>模块日志 / 烧录串口</p>
          <span class="brand-sub">ModuleSerialService · 与侦听台独立 · 常驻独占</span>
        </div>
      </div>
      <div class="dll-status"><span id="ms-server-state">未连接</span></div>
    </header>

    <div class="ms-status-line">
      <span>状态：<strong id="ms-state">idle</strong></span>
      <span>串口：<strong id="ms-port">-</strong></span>
      <span>波特率：<strong id="ms-baud">-</strong></span>
      <span>日志文件：<strong id="ms-logfile">-</strong></span>
      <span>行数：<strong id="ms-lines">0</strong></span>
      <span>烧录：<strong id="ms-flash-state">-</strong></span>
    </div>

    <section class="operation-panel">
      <div class="panel-title-row">
        <h2>串口连接</h2>
        <div class="section-kicker">常驻独占，start 打开、stop 关闭</div>
      </div>
      <div class="ms-toolbar">
        <div class="field">
          <label for="ms-port-select">串口</label>
          <select id="ms-port-select" style="width:150px"></select>
        </div>
        <div class="field">
          <label for="ms-baud-select">波特率</label>
          <select id="ms-baud-select" style="width:130px">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200" selected>115200</option>
            <option value="230400">230400</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
          </select>
        </div>
        <button id="ms-refresh" class="text-button" type="button">刷新端口</button>
        <button id="ms-toggle" class="primary-button" type="button">启动</button>
      </div>
    </section>

    <section class="operation-panel">
      <div class="panel-title-row">
        <h2>烧录（XMODEM）</h2>
        <div class="section-kicker">同一串口句柄传输文件，实时监控不停</div>
      </div>
      <div class="ms-toolbar">
        <div class="field">
          <label for="ms-bin">固件 .bin 路径</label>
          <input id="ms-bin" class="ms-file" type="text" placeholder="选择或输入 .bin 文件路径">
        </div>
        <button id="ms-pick" class="text-button" type="button">选择文件…</button>
        <div class="field">
          <label for="ms-slot">image</label>
          <select id="ms-slot" style="width:90px">
            <option value="0">image 0</option>
            <option value="1">image 1</option>
          </select>
        </div>
        <label class="field" style="flex-direction:row; align-items:center; gap:6px; cursor:pointer;">
          <input id="ms-no-reboot" type="checkbox" style="width:auto">
          <span style="font-size:11px">烧录后不重启</span>
        </label>
        <button id="ms-flash" class="primary-button" type="button">开始烧录</button>
      </div>
      <div class="ms-hint">烧录波特率 = 当前串口波特率（与烧录技能一致，单一速率 115200）；image 可选 image 0 / image 1。</div>
      <div class="ms-progress">
        <div class="progress-track"><span id="ms-progress-bar" style="width:0%"></span></div>
        <div class="progress-copy"><strong id="ms-progress-text">未开始</strong></div>
      </div>
    </section>

    <section class="operation-panel ms-log-panel">
      <div class="panel-title-row">
        <h2>实时日志（800ms 增量轮询）</h2>
        <div class="section-kicker">RX / TX / 事件 同一条时间线</div>
      </div>
      <div class="ms-log-meta">
        <span id="ms-log-path">-</span>
        <span>自动滚动：<input id="ms-autoscroll" type="checkbox" checked style="width:auto; vertical-align:middle;"></span>
        <button id="ms-clear" class="text-button" type="button">清屏</button>
      </div>
      <div id="ms-log-box" class="ms-log-box"></div>
    </section>
  </div>

  <!-- 文件选择对话框：通过后端 /api/fs/* 浏览服务器本地 Windows 目录（C:\、D:\） -->
  <div id="ms-file-picker" class="file-picker-overlay" hidden>
    <div class="file-picker" role="dialog" aria-modal="true" aria-label="选择固件文件">
      <div class="file-picker-header">
        <h3>选择固件文件</h3>
        <button id="ms-picker-close" class="icon-button" type="button" title="关闭">×</button>
      </div>
      <div class="file-picker-toolbar">
        <button id="ms-picker-up" class="secondary-button" type="button" disabled>上一级</button>
        <span id="ms-picker-path" class="file-picker-path" title=""></span>
      </div>
      <div class="file-picker-roots" id="ms-picker-roots"></div>
      <div class="file-picker-list" id="ms-picker-list" tabindex="0">
        <div class="file-picker-empty">加载中…</div>
      </div>
      <div class="file-picker-footer">
        <span id="ms-picker-selected" class="file-picker-selected"></span>
        <div>
          <button id="ms-picker-cancel" class="secondary-button" type="button">取消</button>
          <button id="ms-picker-confirm" class="primary-button" type="button" disabled>选择此文件</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/module-serial.js?v=module-serial-v1"></script>
</body>
</html>
