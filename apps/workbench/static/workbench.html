<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证工作台</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
     必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。

     REQS-0012：className → data-theme；主题白名单改从 --theme-registry 读取。 -->
<script>
(function () {
  try {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    var _saved = localStorage.getItem("wb-theme");
    var _t;
    if (_saved && _keys.indexOf(_saved) > -1) {
      _t = _saved;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
               && _keys.indexOf("daylight") > -1) {
      _t = "daylight";
    } else {
      _t = _keys[0] || "midnight";
    }
    document.documentElement.dataset.theme = _t;
  } catch (e) {}
})();
</script>
<script>
/* 主题实时跟随：外壳切主题时向保活 iframe 广播 wb-theme-change（REQS-0012），
   这里按 --theme-registry 白名单校验后再应用。 */
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "wb-theme-change") {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    if (_keys.indexOf(e.data.theme) > -1) document.documentElement.dataset.theme = e.data.theme;
  }
});
</script>
<style>
/* workbench 验证工作台页面专属样式 —— 引用 tokens-v2.css 中的 Token 变量 */
body {
  background: var(--color-bg-canvas);
  color: var(--color-fg-default);
  font-family: var(--font-sans);
  padding: var(--sp-5);
  line-height: var(--lh-relax);
  min-height: 100vh;
}
h1 {
  font-size: var(--fs-2xl);
  margin-bottom: var(--sp-1-5);
}
.sub {
  color: var(--color-fg-dim);
  font-size: var(--fs-sm);
  margin-bottom: var(--sp-5);
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  margin-bottom: var(--sp-4);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--card-shadow);
}
.card h2 {
  font-size: var(--section-title-fs);
  margin-bottom: var(--section-title-mb);
  color: var(--section-title-color);
}
.row {
  display: flex;
  gap: var(--sp-2-5);
  flex-wrap: wrap;
  align-items: center;
}
select, input, button {
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  color: var(--input-fg);
  padding: var(--input-padding);
  border-radius: var(--input-radius);
  font-size: var(--input-fs);
  font-family: inherit;
  backdrop-filter: blur(calc(var(--glass-blur) * 0.4));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 0.4));
}
select:focus, input:focus {
  outline: none;
  border-color: var(--input-focus);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--input-focus) 25%, transparent);
}
button {
  cursor: pointer;
  transition: background var(--dur-150) var(--ease-out),
              border-color var(--dur-150) var(--ease-out);
}
button:hover {
  border-color: var(--btn-hover-border);
}
button.primary {
  background: var(--btn-primary-bg);
  color: var(--btn-primary-fg);
  font-weight: var(--btn-primary-fw);
  border-color: var(--btn-primary-bg);
}
button.primary:hover {
  background: var(--btn-primary-hover);
}
pre {
  background: var(--pre-bg);
  border: 1px solid var(--pre-border);
  border-radius: var(--pre-radius);
  padding: var(--pre-padding);
  font-size: var(--pre-fs);
  overflow: auto;
  font-family: var(--pre-font);
  white-space: pre-wrap;
  word-break: break-all;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--table-cell-fs);
}
th, td {
  border: 1px solid var(--table-border);
  padding: var(--table-cell-padding);
  text-align: left;
}
th {
  background: var(--table-header-bg);
  color: var(--table-header-fg);
  font-size: var(--table-header-fs);
}
tr:hover td {
  background: var(--table-row-hover);
}
.hint {
  color: var(--color-fg-dim);
  font-size: var(--fs-xs);
  margin-top: var(--sp-2);
}
</style>
</head>
<body>
<h1>验证工作台 <span class="badge run" id="wb-badge">待命</span></h1>
<div class="sub">AI 闭环验证：选场景 → 填固件信息 → 一键执行（烧录 → 监控 → 激励 → 比对 → 反馈 → 报告）</div>

<div class="card">
  <h2>① 场景选择与 Run 参数</h2>
  <div class="row">
    <select id="scenario"></select>
    <input id="fw-version" placeholder="固件版本，如 v2.3.2">
    <input id="fw-commit" placeholder="commit，如 9f2e1a" style="width:120px">
    <input id="log-dir" placeholder="日志目录（默认 LOG/模块/cco）" style="width:260px">
  </div>
  <div class="row" style="margin-top:var(--sp-2-5)">
    <label><input type="checkbox" id="skip-flash"> 跳过烧录</label>
    <label><input type="checkbox" id="skip-stimulus"> 跳过激励</label>
    <label><input type="checkbox" id="skip-feedback"> 跳过反馈</label>
    <button class="primary" id="btn-run">▶ 执行 Run</button>
    <button id="btn-refresh-scenarios">↻ 刷新场景</button>
  </div>
  <div class="hint" id="scenario-desc"></div>
</div>

<div class="card">
  <h2>② Run 结果</h2>
  <div id="run-result"><div class="hint">尚未执行 Run。选择场景并点击「执行 Run」开始全链路闭环验证。</div></div>
</div>

<div class="card">
  <h2>③ 历史 Runs</h2>
  <div id="run-history"><div class="hint">暂无历史记录。</div></div>
</div>

<script>
(function () {
  "use strict";
  const $ = function (id) { return document.getElementById(id); };
  let currentRunId = null;

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.detail || r.statusText); });
      return r.json();
    });
  }

  function loadScenarios() {
    api("/api/scenarios").then(function (list) {
      const sel = $("scenario");
      sel.innerHTML = "";
      list.forEach(function (s) {
        const o = document.createElement("option");
        o.value = s.id; o.textContent = s.name + "（" + s.id + "）";
        sel.appendChild(o);
      });
      showScenarioDesc();
      $("scenario").addEventListener("change", showScenarioDesc);
    }).catch(function (e) {
      $("scenario").innerHTML = '<option>加载失败：' + e.message + '</option>';
    });
  }

  function showScenarioDesc() {
    const id = $("scenario").value;
    api("/api/scenarios/" + id).then(function (s) {
      const flow = (s.expected_flow || []).map(function (f) {
        return f.negate ? "🚫 " + f.event_type : "→ " + f.event_type;
      }).join("  ");
      $("scenario-desc").textContent = "期望流程：" + flow;
    }).catch(function () { });
  }

  function run() {
    const body = {
      scenario_id: $("scenario").value,
      firmware: { version: $("fw-version").value || "dev", commit: $("fw-commit").value || "" },
      skip_flash: $("skip-flash").checked,
      skip_stimulus: $("skip-stimulus").checked,
      skip_feedback: $("skip-feedback").checked,
      log_dir: $("log-dir").value || undefined
    };
    $("wb-badge").textContent = "运行中";
    $("wb-badge").className = "badge run";
    api("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (run) {
        currentRunId = run.run_id;
        // 异步执行：轮询状态直到终态，运行中显示「取消 Run」按钮
        pollRun(run.run_id);
      })
      .catch(function (e) {
        $("wb-badge").textContent = "错误";
        $("wb-badge").className = "badge fail";
        $("run-result").innerHTML = '<pre>' + e.message + '</pre>';
      });
  }

  /* 轮询 Run 状态：运行中显示取消按钮，终态渲染结果（任务4 取消 Run） */
  function pollRun(runId) {
    let timer = null;
    let cancelled = false;

    function tick() {
      if (cancelled) return;
      api("/api/run/" + runId)
        .then(function (run) {
          const terminal = run.status === "passed" || run.status === "failed" ||
                           run.status === "cancelled" || run.status === "error" ||
                           run.status === "inconclusive";
          if (!terminal) {
            // 运行中：显示「取消 Run」按钮 + 当前状态
            $("run-result").innerHTML =
              '<div style="margin-bottom:var(--sp-2)">run_id: <b>' + runId + '</b> &nbsp; 状态: <span class="badge run">' +
              run.status + '</span></div>' +
              '<div class="hint">正在执行全链路（烧录→监控→激励→比对→反馈→报告）…</div>' +
              '<div style="margin-top:var(--sp-2)"><button id="btn-cancel-run">✕ 取消 Run</button></div>';
            const btn = $("btn-cancel-run");
            if (btn) btn.addEventListener("click", function () {
              cancelled = true;
              cancelRun(runId);
            });
            timer = setTimeout(tick, 800);
            return;
          }
          // 终态：渲染结果 + 证据
          $("wb-badge").textContent = run.status === "passed" ? "PASS" :
            (run.status === "cancelled" ? "取消" :
             (run.status === "inconclusive" ? "不确定" : "FAIL"));
          $("wb-badge").className = "badge " + (run.status === "passed" ? "pass" :
            (run.status === "cancelled" ? "run" :
             (run.status === "inconclusive" ? "inconclusive" : "fail")));
          renderRun(run);
          loadHistory();
        })
        .catch(function () { timer = setTimeout(tick, 800); });
    }
    tick();
  }

  /* 请求取消 Run（后端置 CANCELLING → 线程检查后落 CANCELLED） */
  function cancelRun(runId) {
    $("wb-badge").textContent = "取消中";
    $("wb-badge").className = "badge run";
    $("run-result").innerHTML = '<div class="hint">正在取消 Run…</div>';
    api("/api/run/" + runId + "/cancel", { method: "POST" })
      .then(function () {
        // 取消已发起，继续轮询直到终态（cancelled）
        pollRun(runId);
      })
      .catch(function (e) {
        $("wb-badge").textContent = "取消失败";
        $("wb-badge").className = "badge fail";
        $("run-result").innerHTML = '<pre>' + e.message + '</pre>';
      });
  }

  function renderRun(run) {
    const steps = (run.steps || []).map(function (s) {
      return s.kind + " → " + s.result + (s.detail ? "（" + s.detail + "）" : "");
    }).join("<br>");
    $("run-result").innerHTML =
      '<div style="margin-bottom:var(--sp-2)">run_id: <b>' + run.run_id + '</b> &nbsp; 状态: <span class="badge ' +
      (run.status === "passed" ? "pass" : (run.status === "inconclusive" ? "inconclusive" : "fail")) + '">' + run.status + '</span></div>' +
      '<div style="margin-bottom:var(--sp-2)">' + steps + '</div>' +
      '<div class="row"><a href="/api/run/' + run.run_id + '/report" target="_blank">查看报告 JSON</a></div>' +
      '<div id="ev-panel"></div>';
    // 证据明细在 report 里（/api/run/{id}/report），异步加载后渲染下钻面板
    api("/api/run/" + run.run_id + "/report")
      .then(function (report) { $("ev-panel").innerHTML = renderEvidence(report); })
      .catch(function () { $("ev-panel").innerHTML = renderEvidence({}); });
  }

  /* 证据下钻：按 source 分组展示完整证据，可展开 payload/metadata（任务4） */
  function renderEvidence(run) {
    const ed = run.evidence_detail || {};
    const sources = ed.sources || {};
    const total = ed.total || 0;
    if (!total) {
      return '<div class="card" style="margin-top:var(--sp-4)"><h2>④ 证据下钻</h2>' +
        '<div class="hint">本 Run 未产生证据。</div></div>';
    }
    const SRC_LABEL = {
      loghooks: "loghooks 事件",
      sim_concentrator: "模拟集中器步骤",
      listener: "侦听台帧",
    };
    let html = '<div class="card" style="margin-top:var(--sp-4)"><h2>④ 证据下钻 <span class="hint">共 ' +
      total + ' 条</span></h2>';
    Object.keys(sources).forEach(function (source) {
      const items = sources[source] || [];
      html += '<h3 style="margin:var(--sp-3) 0 var(--sp-2)">' +
        (SRC_LABEL[source] || source) + '（' + items.length + '）</h3>';
      html += '<div class="ev-group">';
      items.forEach(function (ev, i) {
        const title = ev.kind + " · " + (ev.raw_ref || ("ev:" + ev.sequence)) +
          (ev.correlation_key ? " · " + ev.correlation_key : "");
        html += '<details class="ev-item" style="margin-bottom:var(--sp-2)">' +
          '<summary><b>' + title + '</b></summary>' +
          '<div class="ev-body" style="margin-top:var(--sp-2)">' +
          renderKeyValue("payload", ev.payload) +
          renderKeyValue("metadata", ev.metadata) +
          (ev.observed_at ? '<div class="hint">observed_at: ' + ev.observed_at + '</div>' : "") +
          '</div></details>';
      });
      html += '</div>';
    });
    return html + '</div>';
  }

  /* 递归渲染键值（payload/metadata 可能嵌套） */
  function renderKeyValue(label, obj) {
    if (!obj || typeof obj !== "object") {
      return obj === undefined || obj === null ? "" :
        '<div class="hint">' + label + ': <code>' + String(obj) + '</code></div>';
    }
    const entries = Object.keys(obj).map(function (k) {
      const v = obj[k];
      let vs;
      if (v === null || v === undefined) vs = "";
      else if (typeof v === "object") vs = JSON.stringify(v);
      else vs = String(v);
      return '<div class="ev-row"><code class="ev-key">' + k + '</code>: <code>' + vs + '</code></div>';
    }).join("");
    return entries ? '<div class="ev-block"><div class="hint">' + label + '</div>' + entries + '</div>' : "";
  }

  function loadHistory() {
    api("/api/runs?limit=10").then(function (list) {
      if (!list.length) { $("run-history").innerHTML = '<div class="hint">暂无历史记录。</div>'; return; }
      let html = "<table><tr><th>run_id</th><th>场景</th><th>状态</th><th>固件</th><th>时间</th></tr>";
      list.forEach(function (r) {
        html += "<tr><td>" + r.run_id + "</td><td>" + r.scenario_id + "</td><td>" +
          '<span class="badge ' + (r.status === "passed" ? "pass" : (r.status === "inconclusive" ? "inconclusive" : "fail")) + '">' + r.status + "</span></td><td>" +
          (r.firmware_ver || "") + "</td><td>" + (r.created_at || "").slice(0, 19) + "</td></tr>";
      });
      $("run-history").innerHTML = html + "</table>";
    }).catch(function () { });
  }

  /* 任务4 运行恢复：刷新页面后恢复上次 Run 的状态/结果。
     取最近一个 Run：终态 → 渲染结果+证据并更新徽标；运行中 → 继续轮询恢复实时状态。 */
  function restoreLastRun() {
    api("/api/runs?limit=1").then(function (list) {
      if (!list.length) return; // 无历史，保持"尚未执行 Run"提示
      const last = list[0];
      currentRunId = last.run_id;
      const terminal = last.status === "passed" || last.status === "failed" ||
                       last.status === "cancelled" || last.status === "error" ||
                       last.status === "inconclusive";
      if (terminal) {
        $("wb-badge").textContent = last.status === "passed" ? "PASS" :
          (last.status === "cancelled" ? "取消" :
           (last.status === "inconclusive" ? "不确定" : "FAIL"));
        $("wb-badge").className = "badge " + (last.status === "passed" ? "pass" :
          (last.status === "cancelled" ? "run" :
           (last.status === "inconclusive" ? "inconclusive" : "fail")));
        api("/api/run/" + last.run_id).then(function (run) { renderRun(run); })
          .catch(function () { });
      } else {
        // 运行中：恢复轮询（沿用 pollRun 逻辑，显示取消按钮/实时状态）
        $("wb-badge").textContent = "运行中";
        $("wb-badge").className = "badge run";
        pollRun(last.run_id);
      }
    }).catch(function () { }); // 恢复失败静默，不影响其他功能
  }

  $("btn-run").addEventListener("click", run);
  $("btn-refresh-scenarios").addEventListener("click", loadScenarios);
  loadScenarios();
  loadHistory();
  restoreLastRun();
})();
</script>

<!-- 主题同步：监听父页面主题切换 -->
<script>
(function () {
  "use strict";
  // 主题名白名单来自 tokens-v2.css 的 --theme-registry（单一数据源），
  // 防止父页传入脏值或旧主题名把 html 的 data-theme 写坏。
  function validThemes() {
    try {
      var raw = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
      return raw.replace(/["']/g, "").split(",").map(function (s) {
        return s.split("|")[0].trim();
      }).filter(Boolean);
    } catch (e) { return []; }
  }
  function applyTheme(theme) {
    if (theme && validThemes().indexOf(theme) > -1) {
      document.documentElement.dataset.theme = theme;
    }
  }
  // 初始化时从父页面读取主题
  try {
    // REQS-0012：父页由 className 改为 data-theme 属性
    applyTheme(window.top.document.documentElement.dataset.theme);
  } catch (e) {}
  // 监听父页面广播
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "wb-theme-change") {
      applyTheme(e.data.theme);
    }
  });
})();
</script>
</body>
</html>
