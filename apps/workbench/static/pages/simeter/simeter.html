<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟电表 · 645 从站</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- 防主题闪跳（与 simcon 页同口径）：iframe 内独立渲染，先应用已保存主题 -->
<script>
(function () {
  try {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    var _saved = localStorage.getItem("wb-theme");
    var _t;
    if (_saved && _keys.indexOf(_saved) > -1) {
      _t = _saved;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
               && _keys.indexOf("daylight") > -1) {
      _t = "daylight";
    } else {
      _t = _keys[0] || "midnight";
    }
    document.documentElement.dataset.theme = _t;
  } catch (e) {}
})();
</script>
<script>
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "wb-theme-change") {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    if (_keys.indexOf(e.data.theme) > -1) document.documentElement.dataset.theme = e.data.theme;
  }
});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;line-height:1.6;color:var(--color-fg-default);background:var(--color-bg-canvas);overflow:auto}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-default);position:sticky;top:0;z-index:5}
.topbar h1{font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--color-border-strong)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--color-fg-muted)}
.pill.on{color:var(--color-status-success-fg, #3fb950)}
.pill.on .dot{background:var(--color-status-success-fg, #3fb950)}
.spacer{flex:1}
button.btn{padding:5px 14px;border-radius:6px;border:1px solid var(--color-border-strong);background:var(--color-bg-inset);color:var(--color-fg-default)}
button.btn:hover{border-color:var(--color-accent)}
button.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
button.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{padding:4px 8px;border-radius:6px;border:1px solid var(--color-border-strong);background:var(--color-bg-inset);color:var(--color-fg-default)}
.layout{display:grid;grid-template-columns:340px 1fr;gap:12px;padding:12px 16px;align-items:start}
.card{border:1px solid var(--color-border-default);border-radius:10px;background:var(--color-bg-default);overflow:hidden}
.card>h2{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--color-fg-muted);padding:8px 12px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-inset)}
.card .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:2px 10px;font-size:12.5px}
.kv .k{color:var(--color-fg-muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frames{height:52vh;overflow:auto;font-size:12px;padding:8px 10px}
.fr{display:flex;gap:8px;padding:1px 0;white-space:pre-wrap;word-break:break-all}
.fr .seq{color:var(--color-fg-muted);min-width:44px;text-align:right}
.fr .dir{min-width:34px;font-weight:600}
.fr.rx .dir{color:var(--color-accent)}
.fr.tx .dir{color:var(--color-status-success-fg,#3fb950)}
.fr.ev .dir{color:var(--color-status-warn-fg,#d29922)}
.note{color:var(--color-fg-muted);font-size:11.5px}
.banner{display:none;padding:8px 16px;background:var(--color-status-fail-bg);color:var(--color-status-fail-fg);font-size:12.5px}
.toast{position:fixed;right:16px;bottom:16px;padding:8px 14px;border-radius:8px;background:var(--color-bg-inset);border:1px solid var(--color-border-strong);font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <h1>模拟电表</h1>
  <span class="pill" id="pill"><span class="dot"></span><span id="pillText">未打开</span></span>
  <div class="spacer"></div>
  <label class="note">映射
    <select id="mapping">
      <option value="listener">listener（底座口）</option>
      <option value="">-- 手动端口 --</option>
    </select>
  </label>
  <input type="text" id="port" placeholder="/dev/ttyUSB1 或 loop://" style="width:170px;display:none">
  <button class="btn primary" id="btnOpen">打开</button>
  <button class="btn" id="btnClose" disabled>关闭</button>
</div>
<div class="banner" id="banner"></div>

<div class="layout">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <h2>状态</h2>
      <div class="body">
        <div class="kv" id="statusKv"><span class="k">—</span><span>尚未打开</span></div>
        <div class="row">
          <button class="btn" id="btnRefresh" style="flex:1">刷新状态</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>电表配置</h2>
      <div class="body">
        <div class="row">
          <label class="note">地址</label>
          <input type="text" id="cfgAddr" class="mono" maxlength="12" style="width:140px" placeholder="999999999999">
          <label class="note">645版本</label>
          <select id="cfgVersion">
            <option value="07">2007</option>
            <option value="97">1997</option>
          </select>
        </div>
        <div class="row">
          <button class="btn" id="btnSaveCfg">保存配置</button>
          <span class="note">写地址/版本，即时生效</span>
        </div>
        <hr style="border:none;border-top:1px solid var(--color-border-default)">
        <div class="row">
          <label class="note">DI</label>
          <input type="text" id="dataDi" class="mono" value="00010000" style="width:96px">
          <label class="note">值</label>
          <input type="text" id="dataVal" class="mono" value="12345.67" style="width:96px">
          <label class="note">小数位</label>
          <input type="number" id="dataScale" value="2" min="0" max="4" style="width:56px">
        </div>
        <div class="row">
          <button class="btn" id="btnSetData">设置数据</button>
          <button class="btn" id="btnGetData">读数据集</button>
        </div>
        <div class="note mono" id="dataOut"></div>
      </div>
    </div>

    <div class="card">
      <h2>645 调测台（handle_hex，无串口也可用）</h2>
      <div class="body">
        <textarea id="hexIn" class="mono" rows="3"
          placeholder="主站请求帧 hex，如 FE FE FE FE 68 99 99 99 99 99 99 68 13 00 79 16"></textarea>
        <div class="row">
          <button class="btn primary" id="btnHandle">发送给电表脑</button>
          <button class="btn" id="btnSendHex" disabled>经串口注入</button>
        </div>
        <div class="note">应答：</div>
        <div class="mono" id="hexOut" style="word-break:break-all">—</div>
        <div class="note mono" id="hexNote"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>会话帧流
      <span class="row" style="float:right;gap:6px">
        <select id="dirFilter">
          <option value="">全部</option>
          <option value="rx">rx（主站→表）</option>
          <option value="tx">tx（表→主站）</option>
          <option value="event">事件</option>
        </select>
        <label class="note">自动刷新 <input type="checkbox" id="autoRefresh" checked></label>
        <button class="btn" id="btnClearView">清屏</button>
      </span>
    </h2>
    <div class="frames mono" id="frames"></div>
    <div class="body" style="border-top:1px solid var(--color-border-default)">
      <span class="note" id="framesInfo">—</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/pages/simeter/simeter.js"></script>
</body>
</html>
