<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动测试 · 用例回归</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- 防主题闪跳（与 simeter 页同口径）：iframe 内独立渲染，先应用已保存主题 -->
<script>
(function () {
  try {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    var _saved = localStorage.getItem("wb-theme");
    var _t;
    if (_saved && _keys.indexOf(_saved) > -1) {
      _t = _saved;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
               && _keys.indexOf("daylight") > -1) {
      _t = "daylight";
    } else {
      _t = _keys[0] || "midnight";
    }
    document.documentElement.dataset.theme = _t;
  } catch (e) {}
})();
</script>
<script>
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "wb-theme-change") {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    if (_keys.indexOf(e.data.theme) > -1) document.documentElement.dataset.theme = e.data.theme;
  }
});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;line-height:1.6;color:var(--color-fg-default);background:var(--color-bg-canvas);overflow:auto}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:600;margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--color-border-strong)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--color-fg-muted)}
.pill.on .dot{background:var(--color-status-success-fg,#3fb950)}
.pill.busy .dot{background:var(--color-status-warning-fg,#d29922)}
button{font:inherit;cursor:pointer;border:1px solid var(--color-border-strong);background:var(--color-bg-raised);color:var(--color-fg-default);border-radius:6px;padding:5px 12px}
button:hover{border-color:var(--color-accent-fg,#4493f8);color:var(--color-accent-fg,#4493f8)}
button.primary{background:var(--color-accent-emphasis,#1f6feb);border-color:var(--color-accent-emphasis,#1f6feb);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.1);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.mini{padding:2px 9px;font-size:12px;border-radius:5px}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--color-border-default);flex-wrap:wrap;background:var(--color-bg-surface)}
.toolbar input[type=search]{font:inherit;padding:4px 10px;border:1px solid var(--color-border-strong);border-radius:6px;background:var(--color-bg-canvas);color:var(--color-fg-default);width:200px}
.chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;border:1px solid var(--color-border-strong);font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--color-accent-emphasis,#1f6feb);border-color:var(--color-accent-emphasis,#1f6feb);color:#fff}
select{font:inherit;padding:4px 8px;border:1px solid var(--color-border-strong);border-radius:6px;background:var(--color-bg-canvas);color:var(--color-fg-default)}
.wrap{padding:12px 16px 24px}
table{width:100%;border-collapse:collapse;background:var(--color-bg-surface)}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--color-border-muted,rgba(128,128,128,.2));vertical-align:middle}
th{font-size:12px;color:var(--color-fg-muted);font-weight:600;position:sticky;top:0;background:var(--color-bg-surface);z-index:2}
tbody tr:hover{background:var(--color-bg-hover)}
tbody tr{cursor:pointer}
.badge{display:inline-block;padding:0 8px;border-radius:999px;font-size:11px;border:1px solid var(--color-border-strong)}
.badge.pass{color:var(--color-status-success-fg,#3fb950);border-color:var(--color-status-success-fg,#3fb950)}
.badge.fail{color:var(--color-status-danger-fg,#f85149);border-color:var(--color-status-danger-fg,#f85149)}
.badge.yes{color:var(--color-status-success-fg,#3fb950)}
.badge.partial{color:var(--color-status-warning-fg,#d29922)}
.badge.no{color:var(--color-fg-muted)}
.badge.err{color:var(--color-status-danger-fg,#f85149)}
.tag{display:inline-block;font-size:11px;color:var(--color-fg-muted);border:1px dashed var(--color-border-strong);border-radius:4px;padding:0 6px;margin-right:4px}
#job-panel{position:sticky;bottom:0;border-top:2px solid var(--color-border-strong);background:var(--color-bg-raised);padding:10px 16px;display:none;max-height:42vh;overflow:auto;z-index:6}
#job-panel.show{display:block}
#job-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#job-log{font-family:var(--font-mono);font-size:12px;background:var(--color-bg-canvas);border:1px solid var(--color-border-default);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap}
#drawer{position:fixed;top:0;right:-560px;width:560px;max-width:92vw;height:100%;background:var(--color-bg-overlay);border-left:1px solid var(--color-border-strong);box-shadow:-8px 0 24px rgba(0,0,0,.25);transition:right .18s ease;z-index:20;display:flex;flex-direction:column}
#drawer.open{right:0}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--color-border-default)}
#drawer .body{padding:12px 16px;overflow:auto;flex:1}
#drawer .kv{margin-bottom:8px}
#drawer .kv b{color:var(--color-fg-muted);font-weight:600;margin-right:6px}
#drawer pre{font-family:var(--font-mono);font-size:12px;background:var(--color-bg-canvas);border:1px solid var(--color-border-default);border-radius:6px;padding:8px 10px;overflow:auto;max-height:320px;white-space:pre-wrap}
#drawer .actions{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--color-border-default)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--color-accent-emphasis,#1f6feb);color:#fff;padding:7px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{color:var(--color-fg-muted);font-size:12px}
.empty{padding:32px;text-align:center;color:var(--color-fg-muted)}
</style>
</head>
<body>
<div class="topbar">
  <h1>自动测试 · 用例回归</h1>
  <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">加载中…</span></span>
  <span style="flex:1"></span>
  <button id="btn-refresh">刷新</button>
  <button class="primary" id="btn-run-all">▶ 全部运行</button>
</div>
<div class="topbar" id="chain-bar" style="border-bottom:1px solid var(--color-border-default)"></div>
<div class="toolbar">
  <input type="search" id="q" placeholder="搜 ID / 标题…">
  <select id="f-supported">
    <option value="">支持：全部</option>
    <option value="yes">yes</option>
    <option value="partial">partial</option>
    <option value="no">no</option>
    <option value="error">error</option>
  </select>
  <span id="tag-bar" style="display:inline-flex;gap:6px;flex-wrap:wrap"></span>
  <span style="flex:1"></span>
  <span class="hint" id="sel-count"></span>
  <button class="mini" id="btn-clear-sel" disabled>清除选择</button>
  <button class="primary mini" id="btn-run-sel" disabled>▶ 运行选中</button>
</div>
<div class="wrap" id="list-wrap"><div class="empty">加载中…</div></div>
<div id="job-panel">
  <div style="display:flex;align-items:center;gap:10px">
    <b id="job-line">任务</b>
    <span style="flex:1"></span>
    <span class="hint" id="job-summary"></span>
  </div>
  <div id="job-chips"></div>
  <pre id="job-log"></pre>
</div>
<div id="drawer">
  <header><b id="d-title">详情</b><button class="mini" id="d-close">关闭</button></header>
  <div class="body" id="d-body"></div>
  <div class="actions">
    <button class="primary mini" id="d-run">▶ 运行此用例</button>
    <button class="mini" id="d-result">最近完整结果</button>
    <button class="mini" id="d-doc">用例文档</button>
  </div>
</div>
<div id="toast"></div>
<script src="autotest.js"></script>
</body>
</html>
