<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口配置</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
     必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。 -->
<script>
  (function () {
    try {
      var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
      var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
        return s.split("|")[0].trim();
      }).filter(Boolean);
      var _saved = localStorage.getItem("wb-theme");
      var _t;
      if (_saved && _keys.indexOf(_saved) > -1) {
        _t = _saved;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                 && _keys.indexOf("daylight") > -1) {
        _t = "daylight";
      } else {
        _t = _keys[0] || "midnight";
      }
      document.documentElement.dataset.theme = _t;
    } catch (e) {}
  })();
</script>
<script>
  function readThemeKeys() {
    var raw = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    return raw.replace(/["']/g, "").split(",").map(function (entry) {
      return entry.split("|")[0].trim();
    }).filter(Boolean);
  }
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "wb-theme-change") {
      var keys = readThemeKeys();
      if (keys.indexOf(e.data.theme) > -1) {
        document.documentElement.dataset.theme = e.data.theme;
      }
    }
  });
</script>
<style>
body {
  background: var(--color-bg-canvas);
  color: var(--color-fg-default);
  font-family: var(--font-sans);
  padding: var(--sp-5);
  line-height: var(--lh-relax);
  min-height: 100vh;
}
h1 { font-size: var(--fs-2xl); margin-bottom: var(--sp-1-5); }
.sub { color: var(--color-fg-dim); font-size: var(--fs-sm); margin-bottom: var(--sp-5); }
.toolbar { display: flex; gap: 10px; margin-bottom: var(--sp-5); flex-wrap: wrap; }
.toolbar button {
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-fg);
  border-radius: var(--btn-radius);
  padding: var(--btn-padding);
  cursor: pointer;
  font-size: var(--btn-fs);
  font-family: inherit;
}
.toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
.error-summary {
  border: 1px solid var(--color-status-fail-border);
  background: var(--color-status-fail-bg);
  color: var(--color-status-fail);
  border-radius: var(--btn-radius);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4);
  font-size: var(--fs-sm);
}
.error-summary[hidden] { display: none; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); }
.slot-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--card-shadow);
}
.slot-card h2 { font-size: var(--section-title-fs); margin: 0 0 var(--sp-2); color: var(--section-title-color); display: flex; align-items: center; gap: 8px; }
.slot-card .slot-id { color: var(--color-fg-dim); font-size: var(--fs-xs); font-family: var(--font-mono); }
.slot-card .enabled-row { display: flex; align-items: center; gap: 8px; margin-bottom: var(--sp-3); }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: var(--fs-sm); color: var(--color-fg-dim); margin-bottom: 4px; }
.field select, .field input {
  width: 100%; box-sizing: border-box;
  border: 1px solid var(--input-border); border-radius: var(--input-radius);
  background: var(--input-bg); color: var(--input-fg);
  padding: var(--input-padding); font-size: var(--input-fs); font-family: inherit;
}
.field .error { color: var(--color-status-fail); font-size: var(--fs-xs); margin-top: 4px; min-height: 14px; }
.slot-status { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--card-border); font-size: var(--fs-sm); }
.slot-status dl { margin: 0; display: grid; grid-template-columns: 72px 1fr; gap: 4px 8px; }
.slot-status dt { color: var(--color-fg-dim); }
.slot-status dd { margin: 0; }
.result { margin-top: 8px; font-size: var(--fs-sm); }
.result.ok { color: var(--color-status-pass); }
.result.fail { color: var(--color-status-fail); }
</style>
</head>
<body data-api-base="/api">
<h1>串口配置</h1>
<div class="sub">设备组：四槽运行 Profile 保存与一键应用（P6）</div>

<div class="error-summary" id="errorSummary" tabindex="0" hidden></div>

<div class="toolbar">
  <button type="button" id="btnSave">保存</button>
  <button type="button" id="btnApply">一键应用</button>
  <button type="button" id="btnRefresh">刷新状态</button>
  <span id="saveHint" style="color:var(--color-fg-dim);font-size:var(--fs-sm);align-self:center;"></span>
</div>

<div class="slot-grid" id="slotGrid">
  <!-- 四槽卡片由 serial-profile.js 渲染 -->
</div>

<script src="/static/pages/serial-profile/serial-profile.js"></script>
</body>
</html>
