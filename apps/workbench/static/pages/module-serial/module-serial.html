<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块日志 / 烧录串口</title>
  <link rel="stylesheet" href="../../tokens-v2.css">
  <link rel="stylesheet" href="/static/pages/module-serial/styles.css?v=module-serial-v4">
  <!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
       必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。
       color-scheme: dark 已在 styles.css 的 :root 中声明，此处不重复。 -->
  <script>
    (function () {
      try {
        var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
        var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
          return s.split("|")[0].trim();
        }).filter(Boolean);
        var _saved = localStorage.getItem("wb-theme");
        var _t;
        if (_saved && _keys.indexOf(_saved) > -1) {
          _t = _saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                   && _keys.indexOf("daylight") > -1) {
          _t = "daylight";
        } else {
          _t = _keys[0] || "midnight";
        }
        document.documentElement.dataset.theme = _t;
      } catch (e) {}
    })();
  </script>
  <script>
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "wb-theme-change") {
        var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
        var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
          return s.split("|")[0].trim();
        }).filter(Boolean);
        if (_keys.indexOf(e.data.theme) > -1) document.documentElement.dataset.theme = e.data.theme;
      }
    });
  </script>
  <style>
    /* 覆盖全局 body min-width 限制，允许窗口缩小时自适应 */
    body { min-width: unset; }
    /* 模块串口独立页面专属样式（与侦听台共用基础变量/按钮/面板） */
    .ms-shell { width: 100%; margin: 0; padding: 14px 18px 16px; box-sizing: border-box;
      height: 100vh; overflow: hidden; display: flex; flex-direction: column; }  /* flex column 铺满视口，绝不溢出 */
    .ms-channels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px;
      flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }  /* 弹性占满剩余高度，左右各半不越界 */
    .ms-channel-panel { display: flex; flex-direction: column; min-height: 0; background: var(--color-bg-surface);
      border: 1px solid var(--color-border-default); border-radius: 8px; padding: 12px; }
    .ms-channel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .ms-channel-badge { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 4px; color: var(--color-accent-fg); }
    .ms-channel-badge.cco { background: var(--color-status-info); }
    .ms-channel-badge.sta { background: var(--color-dir-tx); }
    .ms-channel-title { font-size: 13px; color: var(--color-fg-default); font-weight: bold; }
    .ms-channel-status { font-size: 11px; color: var(--color-fg-muted); margin-left: auto; }
    .ms-toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin: 6px 0 8px; }
    .ms-toolbar .field { display: flex; flex-direction: column; gap: 4px; }
    .ms-toolbar label { font-size: 11px; color: var(--color-fg-muted); }
    .ms-toolbar input, .ms-toolbar select {
      background: var(--color-bg-surface); color: var(--color-fg-default);
      border: 1px solid var(--color-border-default); border-radius: 6px;
      padding: 6px 8px; font-size: 12px; font-family: Consolas, monospace;
    }
    .ms-log-box {
      flex: 1 1 auto; min-height: 0;
      background: var(--color-bg-input); border: 1px solid var(--color-border-default); border-radius: 8px;
      overflow-y: auto; padding: 10px 12px;
      font: 11px/1.55 Consolas, Menlo, monospace; white-space: pre-wrap;
    }
    .ms-log-box .t { color: var(--color-fg-subtle); }
    .ms-log-box .rx { color: var(--color-dir-rx); }
    .ms-log-box .tx { color: var(--color-dir-tx); }
    .ms-log-box .ev { color: var(--color-status-info); }
    .ms-log-box .err { color: var(--color-status-fail); font-weight: bold; }
    .ms-progress { margin: 8px 0 6px; }
    .ms-hint { font-size: 11px; color: var(--color-fg-subtle); margin-top: 4px; }
    .ms-file { width: 100%; min-width: 180px; max-width: 320px; }
    .ms-log-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--color-fg-subtle); margin-bottom: 6px; }
    /* 底部发送框 */
    .ms-sender { border-top: 1px solid var(--color-dir-tx); padding-top: 10px; }
    .ms-refresh-bar { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
    .ms-sender-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--color-dir-tx); }
    .ms-sender-head h2 { font-size: 13px; margin: 0; color: var(--color-dir-tx); }
    .ms-sender-box { display: flex; gap: 8px; align-items: flex-start; color: var(--color-dir-tx); }
    .ms-sender-box textarea {
      flex: 1 1 auto; min-height: 56px; resize: vertical;
      background: var(--color-bg-input); color: var(--color-fg-default);
      border: 1px solid var(--color-dir-tx); border-radius: 6px;
      padding: 8px; font: 12px/1.5 Consolas, Menlo, monospace;
    }
    .ms-sender-side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; color: var(--color-dir-tx); }
    @media (max-width: 900px) {
      .ms-channels { grid-template-columns: 1fr; }
      .ms-shell { padding: 10px 12px 12px; }
      body { min-width: unset; }
    }
  
    /* ===== 页签栏 ===== */
    /* ===== 页签栏 ===== */
    .ms-tabs { display: flex; gap: 4px; padding: 4px 4px 0; border-bottom: 1px solid var(--color-border-default); margin-bottom: 14px; }
    .ms-tab {
      background: transparent; border: none; color: var(--color-fg-muted);
      font-size: 13px; font-weight: 600; padding: 9px 20px; cursor: pointer;
      border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
      margin-bottom: -1px; position: relative; transition: color .18s ease, background .18s ease;
    }
    .ms-tab:hover { color: var(--color-fg-default); background: color-mix(in srgb, var(--color-accent) 5%, transparent); }
    .ms-tab.active {
      color: var(--color-accent); background: var(--color-bg-surface);
      border-color: var(--color-border-default); border-bottom-color: transparent;
    }
    .ms-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-accent); }
    .ms-tabpane { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

    /* ===== 来源卡片 ===== */
    .cmp-srcbar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .cmp-srccard {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer;
      background: linear-gradient(to bottom, var(--color-bg-surface), var(--color-bg-input));
      border: 1px solid var(--color-border-default); border-radius: 10px;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
      position: relative; overflow: hidden;
    }
    .cmp-srccard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--color-status-info) 10%, transparent), transparent 60%); opacity: 0; transition: opacity .2s; }
    .cmp-srccard:hover { border-color: var(--color-border-strong); transform: translateY(-1px); }
    .cmp-srccard:hover::before { opacity: 1; }
    .cmp-srccard.active { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent), 0 8px 24px color-mix(in srgb, var(--color-accent) 8%, transparent); }
    .cmp-srccard.active::before { opacity: 1; }
    .cmp-srccard-ico {
      flex: 0 0 42px; height: 42px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; border-radius: 10px; background: var(--color-bg-raised);
      border: 1px solid var(--color-border-default);
    }
    .cmp-srccard.active .cmp-srccard-ico { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 30%, transparent); }
    .cmp-srccard-body { flex: 1 1 auto; min-width: 0; }
    .cmp-srccard-title { font-size: 14px; font-weight: 700; color: var(--color-fg-default); }
    .cmp-srccard-desc { font-size: 11px; color: var(--color-fg-muted); margin-top: 3px; }
    .cmp-srccard-status { font-size: 11px; color: var(--color-fg-subtle); font-weight: 600; white-space: nowrap; }
    .cmp-srccard.active .cmp-srccard-status { color: var(--color-accent); }
    .cmp-srccard-check {
      flex: 0 0 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--color-border-strong); border-radius: 50%;
      color: transparent; font-size: 13px; font-weight: 700;
    }
    .cmp-srccard.active .cmp-srccard-check { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-soft); }

    /* ===== 配置区 ===== */
    .cmp-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 4px 0 14px; }
    .cmp-modseg { display: inline-flex; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: 8px; padding: 3px; gap: 3px; }
    .cmp-modseg-btn {
      background: transparent; border: none; color: var(--color-fg-muted);
      font-size: 12px; font-weight: 700; padding: 6px 18px; border-radius: 6px; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .cmp-modseg-btn:hover { color: var(--color-fg-default); }
    .cmp-modseg-btn.active { background: var(--color-accent); color: var(--color-accent-fg); }
    .cmp-cfg { display: flex; gap: 8px; align-items: center; }
    .cmp-filepick { display: flex; gap: 6px; align-items: center; }
    #cmp-file { width: 320px; background: var(--color-bg-surface); color: var(--color-fg-default); border: 1px solid var(--color-border-strong); border-radius: 6px; padding: 7px 10px; font-size: 12px; font-family: Consolas, monospace; }
    .cmp-rt-status { font-size: 12px; color: var(--color-fg-muted); padding: 4px 8px; border-radius: 6px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default); }
    .cmp-rt-status.on { color: var(--color-accent); border-color: color-mix(in srgb, var(--color-accent) 30%, transparent); }
    .cmp-meta { font-size: 11px; color: var(--color-fg-subtle); margin-left: auto; }

    /* ===== 统计条 ===== */
    .cmp-stats { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .cmp-stat {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 18px; background: var(--color-bg-surface); border: 1px solid var(--color-border-default);
      border-radius: 8px; min-width: 72px;
    }
    .cmp-stat-num { font-size: 20px; font-weight: 800; color: var(--color-fg-default); font-family: Consolas, monospace; }
    .cmp-stat-label { font-size: 10px; color: var(--color-fg-subtle); letter-spacing: .5px; }
    .cmp-stat-drift .cmp-stat-num { color: var(--color-status-warn); }

    /* ===== 主体分栏 ===== */
    .cmp-body { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; }
    .cmp-pane {
      flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0;
      background: linear-gradient(to bottom, var(--color-bg-input), var(--color-bg-canvas));
      border: 1px solid var(--color-border-default); border-radius: 10px; overflow: hidden;
    }
    .cmp-events { flex: 0 0 42%; }
    .cmp-pane-head {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      border-bottom: 1px solid var(--color-border-default); flex: 0 0 auto;
      background: linear-gradient(to right, color-mix(in srgb, var(--color-accent) 5%, transparent), transparent 70%);
    }
    .cmp-pane-title { font-size: 12px; font-weight: 800; color: var(--color-fg-default); letter-spacing: .4px; }
    .cmp-pane-legend { margin-left: auto; font-size: 10px; color: var(--color-fg-subtle); display: flex; align-items: center; gap: 4px; }
    .cmp-pane-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 2px 0 6px; }
    .cmp-pane-legend .dot.info { background: var(--color-status-info); }
    .cmp-pane-legend .dot.warn { background: var(--color-status-warn); }
    .cmp-pane-legend .dot.error { background: var(--color-status-fail); }
    .cmp-pane-file { font-size: 10px; color: var(--color-fg-subtle); font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; max-width: 60%; }
    .cmp-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px; }
    .cmp-empty { color: var(--color-fg-subtle); font-size: 12px; text-align: center; padding: 40px 16px; }

    /* 事件卡片 */
    .cmp-ev {
      display: flex; gap: 10px; padding: 9px 10px 9px 4px; border-radius: 8px;
      cursor: pointer; position: relative; margin-bottom: 2px;
      transition: background .14s ease;
    }
    .cmp-ev:hover { background: color-mix(in srgb, var(--color-status-info) 6%, transparent); }
    .cmp-ev.selected { background: linear-gradient(to right, color-mix(in srgb, var(--color-accent) 12%, transparent), color-mix(in srgb, var(--color-accent) 3%, transparent)); }
    .cmp-ev-bar { width: 3px; align-self: stretch; border-radius: 2px; flex: 0 0 3px; }
    .cmp-ev-bar.info { background: var(--color-status-info); }
    .cmp-ev-bar.warn { background: var(--color-status-warn); }
    .cmp-ev-bar.error { background: var(--color-status-fail); }
    .cmp-ev-icon { flex: 0 0 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 13px; border-radius: 7px; background: var(--color-bg-raised); border: 1px solid var(--color-border-default); margin-top: 1px; }
    .cmp-ev.selected .cmp-ev-icon { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 25%, transparent); }
    .cmp-ev-body { flex: 1 1 auto; min-width: 0; }
    .cmp-ev-head { display: flex; align-items: baseline; gap: 8px; }
    .cmp-ev-label { font-size: 12px; font-weight: 700; color: var(--color-fg-default); }
    .cmp-ev-time { font-size: 10px; color: var(--color-fg-subtle); font-family: Consolas, monospace; margin-left: auto; white-space: nowrap; }
    .cmp-ev-msg { font-size: 11px; color: var(--color-fg-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cmp-ev-type { font-size: 9px; color: var(--color-fg-subtle); font-family: Consolas, monospace; background: color-mix(in srgb, var(--color-fg-subtle) 16%, transparent); padding: 1px 6px; border-radius: 4px; }
    .cmp-ev-rule { font-size: 9px; color: var(--color-fg-subtle); font-family: Consolas, monospace; }

    /* 日志列表 */
    .cmp-log-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; position: relative; font: 11px/1.6 Consolas, Menlo, monospace; }
    .cmp-log-spacer { position: absolute; top: 0; left: 0; width: 1px; }
    .cmp-log-window { position: absolute; top: 0; left: 0; right: 0; }
    .cmp-log-line {
      position: absolute; left: 0; right: 0; height: 18px; line-height: 18px;
      padding: 0 16px; color: var(--color-fg-muted); white-space: pre; overflow-x: hidden;
      border-left: 2px solid transparent; cursor: pointer; transition: background .12s ease;
      box-sizing: border-box;
    }
    .cmp-log-line:hover { background: color-mix(in srgb, var(--color-status-info) 5%, transparent); }
    .cmp-log-line.selected { background: linear-gradient(to right, color-mix(in srgb, var(--color-accent) 14%, transparent), transparent); border-left-color: var(--color-accent); color: var(--color-fg-default); }
    .cmp-log-line .t { color: var(--color-fg-subtle); }
    .cmp-log-line .rx { color: var(--color-dir-rx); }
    .cmp-log-line .tx { color: var(--color-dir-tx); }
    .cmp-log-line .ev { color: var(--color-status-info); }
    .cmp-log-line .err { color: var(--color-status-fail); font-weight: bold; }

    /* ===== 动态实时日志会话 ===== */
    .ms-session-bar { display:flex; align-items:center; gap:8px; min-height:42px; margin:0 0 10px; }
    .ms-session-tabs { display:flex; gap:6px; flex:1 1 auto; overflow-x:auto; padding-bottom:2px; }
    .ms-session-tab { border:1px solid var(--color-border-default); border-radius:7px; background:var(--color-bg-raised); color:var(--color-fg-muted); padding:7px 10px; white-space:nowrap; font-size:11px; }
    .ms-session-tab.active { color:var(--color-accent); border-color:var(--color-accent); background:var(--color-accent-soft); }
    .ms-session-tab .dot { display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:var(--color-fg-subtle); }
    .ms-session-tab.running .dot { background:var(--color-accent); box-shadow:0 0 7px var(--color-accent); }
    .ms-session-tab.error .dot { background:var(--color-status-fail); }
    .ms-session-message { color:var(--color-fg-subtle); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
    .ms-session-panel { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; background:var(--color-bg-surface); border:1px solid var(--color-border-default); border-radius:8px; padding:12px; }
    .ms-session-panel .ms-log-box { min-height:180px; }
    @media (max-width:900px) { .ms-session-bar { align-items:flex-start; flex-wrap:wrap; } .ms-session-tabs { flex-basis:100%; } }
</style>
</head><body data-api-base="/api">
  <div class="app-shell ms-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <p>模块日志 / 烧录串口</p>
          <span class="brand-sub">ModuleSerialService · 动态会话 · 后端串口句柄独占</span>
        </div>
      </div>
      <div class="dll-status"><span id="ms-server-state">未连接</span></div>
    </header>

    <!-- 页签栏：实时日志 / 对照解析 / 模拟集中器 -->
    <nav class="ms-tabs">
      <button class="ms-tab active" data-tab="live" type="button">实时日志</button>
      <button class="ms-tab" data-tab="compare" type="button">对照解析</button>
    </nav>

<div id="ms-tab-live" class="ms-tabpane">
      <div class="ms-session-bar">
        <div id="ms-session-tabs" class="ms-session-tabs" role="tablist" aria-label="实时日志页面"></div>
        <button id="ms-add-session" class="text-button" type="button">＋ 新增页面</button>
        <button id="ms-close-session" class="text-button" type="button">关闭当前页</button>
        <span id="ms-session-message" class="ms-session-message"></span>
      </div>

      <section id="ms-session-panel" class="ms-session-panel" aria-live="polite">
        <div class="ms-channel-head">
          <span id="ms-module-badge" class="ms-channel-badge cco">CCO</span>
          <span id="ms-session-title-display" class="ms-channel-title">实时日志</span>
          <span id="ms-session-status" class="ms-channel-status">idle</span>
        </div>

        <div class="ms-toolbar">
          <div class="field">
            <label for="ms-title">页面名称</label>
            <input id="ms-title" type="text" maxlength="128" style="width:168px">
          </div>
          <div class="field">
            <label for="ms-module">模块类型</label>
            <select id="ms-module" style="width:90px">
              <option value="cco">CCO</option>
              <option value="sta">STA</option>
            </select>
          </div>
          <div class="field">
            <label for="ms-port">串口</label>
            <select id="ms-port" style="width:220px"></select>
          </div>
          <button id="ms-refresh-ports" class="text-button" type="button">刷新端口</button>
          <div class="field">
            <label for="ms-baud">波特率</label>
            <select id="ms-baud" style="width:108px">
              <option value="9600" selected>9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200">115200</option>
              <option value="230400">230400</option>
              <option value="460800">460800</option>
              <option value="921600">921600</option>
            </select>
          </div>
          <div class="field">
            <label for="ms-parity">校验位</label>
            <select id="ms-parity" style="width:76px">
              <option value="N">无(N)</option>
              <option value="E" selected>偶(E)</option>
              <option value="O">奇(O)</option>
              <option value="M">标记(M)</option>
              <option value="S">空格(S)</option>
            </select>
          </div>
          <div class="field">
            <label for="ms-bytesize">数据位</label>
            <select id="ms-bytesize" style="width:62px">
              <option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8" selected>8</option>
            </select>
          </div>
          <div class="field">
            <label for="ms-stopbits">停止位</label>
            <select id="ms-stopbits" style="width:62px">
              <option value="1" selected>1</option><option value="2">2</option>
            </select>
          </div>
          <button id="ms-toggle" class="primary-button" type="button">启动</button>
        </div>

        <div class="ms-toolbar">
          <div class="field" style="flex:1">
            <label for="ms-bin">固件 .bin 路径</label>
            <input id="ms-bin" class="ms-file" type="text" placeholder="输入或选择文件…">
          </div>
          <button id="ms-pick" class="text-button" type="button">选择…</button>
          <div class="field">
            <label for="ms-slot">image</label>
            <select id="ms-slot" style="width:86px">
              <option value="0">image 0</option><option value="1">image 1</option>
            </select>
          </div>
          <label class="field" style="flex-direction:row; align-items:center; gap:6px; cursor:pointer;">
            <input id="ms-no-reboot" type="checkbox" style="width:auto">
            <span style="font-size:11px">烧录后不重启</span>
          </label>
          <button id="ms-flash" class="primary-button" type="button">开始烧录</button>
        </div>

        <div class="ms-progress">
          <div class="progress-track"><span id="ms-progress-bar" style="width:0%"></span></div>
          <div class="progress-copy"><strong id="ms-progress-text">未开始</strong></div>
        </div>
        <div class="ms-log-meta">
          <span id="ms-log-path">-</span>
          <span>自动滚动：<input id="ms-autoscroll" type="checkbox" checked style="width:auto; vertical-align:middle;"></span>
          <button id="ms-clear" class="text-button" type="button">清屏</button>
        </div>
        <div id="ms-log-box" class="ms-log-box"></div>
      </section>

      <section class="operation-panel ms-sender" id="ms-sender">
        <div class="ms-sender-head">
          <h2>串口发送 <span id="ms-send-target" class="ms-hint"></span></h2>
          <div class="section-kicker">当前页面 · Enter 发送；Shift+Enter 换行</div>
          <button id="ms-sender-hide" class="text-button" type="button" style="margin-left:auto">隐藏</button>
        </div>
        <div class="ms-sender-box">
          <textarea id="ms-send-text" placeholder="输入要发送的指令，回车即发送…"></textarea>
          <div class="ms-sender-side">
            <button id="ms-send-btn" class="primary-button" type="button">发送</button>
            <button id="ms-send-newline" class="text-button" type="button">换行</button>
            <label style="display:flex; align-items:center; gap:4px; cursor:pointer; font-size:11px; color:var(--color-fg-muted);">
              <input id="ms-send-append-nl" type="checkbox" checked style="width:auto; margin:0;">自动补换行
            </label>
            <button id="ms-send-clear" class="text-button" type="button">清空</button>
          </div>
        </div>
      </section>
      <div id="ms-sender-showbar" hidden style="margin-top:8px">
        <button id="ms-sender-show" class="text-button" type="button">显示发送框</button>
      </div>
    </div>
    <!-- 对照解析页：左事件 + 右日志，双向绑定 -->
<div id="ms-tab-compare" class="ms-tabpane" hidden>
      <!-- 来源卡片：串口 / 导入文件（互斥二选一） -->
      <div class="cmp-srcbar">
        <div class="cmp-srccard" data-src="realtime" id="cmp-card-realtime" tabindex="0">
          <div class="cmp-srccard-ico">🔌</div>
          <div class="cmp-srccard-body">
            <div class="cmp-srccard-title">实时串口</div>
            <div class="cmp-srccard-desc">解析当前串口采集中日志（CCO / STA）</div>
          </div>
          <div class="cmp-srccard-status" id="cmp-src-realtime-status">空闲</div>
          <div class="cmp-srccard-check">✓</div>
        </div>
        <div class="cmp-srccard" data-src="file" id="cmp-card-file" tabindex="0">
          <div class="cmp-srccard-ico">📂</div>
          <div class="cmp-srccard-body">
            <div class="cmp-srccard-title">导入日志文件</div>
            <div class="cmp-srccard-desc">打开历史日志文件或整个目录扫描</div>
          </div>
          <div class="cmp-srccard-status" id="cmp-src-file-status">未选择</div>
          <div class="cmp-srccard-check">✓</div>
        </div>
      </div>

      <!-- 配置区（随来源切换） -->
      <div class="cmp-toolbar">
        <div class="cmp-modseg" id="cmp-module" role="tablist">
          <button class="cmp-modseg-btn active" data-mod="cco" type="button">CCO</button>
          <button class="cmp-modseg-btn" data-mod="sta" type="button">STA</button>
        </div>

        <!-- 导入文件配置 -->
        <div class="cmp-cfg" id="cmp-cfg-file" hidden>
          <div class="cmp-filepick">
            <input id="cmp-file" type="text" placeholder="选择日志文件或目录…">
            <button id="cmp-pick-file" class="text-button" type="button">打开文件</button>
            <button id="cmp-pick-dir" class="text-button" type="button">打开目录</button>
          </div>
          <button id="cmp-run-file" class="primary-button" type="button">解析日志</button>
        </div>

        <!-- 串口配置 -->
        <div class="cmp-cfg" id="cmp-cfg-realtime" hidden>
          <label class="field"><span>实时页面</span><select id="cmp-session" style="width:180px"></select></label>
          <span class="cmp-rt-status" id="cmp-rt-status">串口未运行</span>
          <button id="cmp-run-realtime" class="primary-button" type="button">开始解析</button>
        </div>

        <span id="cmp-meta" class="cmp-meta"></span>
      </div>

      <!-- 统计条 -->
      <div class="cmp-stats" id="cmp-stats" hidden>
        <div class="cmp-stat"><span class="cmp-stat-num" id="cmp-stat-events">0</span><span class="cmp-stat-label">事件</span></div>
        <div class="cmp-stat"><span class="cmp-stat-num" id="cmp-stat-lines">0</span><span class="cmp-stat-label">日志行</span></div>
        <div class="cmp-stat"><span class="cmp-stat-num" id="cmp-stat-files">0</span><span class="cmp-stat-label">来源</span></div>
        <div class="cmp-stat cmp-stat-drift"><span class="cmp-stat-num" id="cmp-stat-drift">0</span><span class="cmp-stat-label">行号漂移</span></div>
      </div>

      <div class="cmp-body">
        <!-- 左：事件流 -->
        <div class="cmp-pane cmp-events">
          <div class="cmp-pane-head">
            <span class="cmp-pane-title">事件解析</span>
            <span class="cmp-pane-legend">
              <i class="dot info"></i>info <i class="dot warn"></i>warn <i class="dot error"></i>error
            </span>
          </div>
          <div id="cmp-event-list" class="cmp-list">
            <div class="cmp-empty">请选择来源并开始解析</div>
          </div>
        </div>
        <!-- 右：日志 -->
        <div class="cmp-pane cmp-log">
          <div class="cmp-pane-head">
            <span class="cmp-pane-title">原始日志</span>
            <span class="cmp-pane-file" id="cmp-log-file"></span>
          </div>
          <div id="cmp-log-list" class="cmp-log-list">
            <div id="cmp-log-spacer" class="cmp-log-spacer"></div>
            <div id="cmp-log-window" class="cmp-log-window"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 文件选择对话框（兜底）：通过后端 /api/fs/* 浏览服务器本地 Windows 目录 -->
  <div id="ms-file-picker" class="file-picker-overlay" hidden>
    <div class="file-picker" role="dialog" aria-modal="true" aria-label="选择固件文件">
      <div class="file-picker-header">
        <h3>选择固件文件</h3>
        <button id="ms-picker-close" class="icon-button" type="button" title="关闭">×</button>
      </div>
      <div class="file-picker-toolbar">
        <button id="ms-picker-up" class="secondary-button" type="button" disabled>上一级</button>
        <span id="ms-picker-path" class="file-picker-path" title=""></span>
      </div>
      <div class="file-picker-roots" id="ms-picker-roots"></div>
      <div class="file-picker-list" id="ms-picker-list" tabindex="0">
        <div class="file-picker-empty">加载中…</div>
      </div>
      <div class="file-picker-footer">
        <span id="ms-picker-selected" class="file-picker-selected"></span>
        <div>
          <button id="ms-picker-cancel" class="secondary-button" type="button">取消</button>
          <button id="ms-picker-confirm" class="primary-button" type="button" disabled>选择此文件</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/pages/module-serial/module-serial.js?v=module-serial-v7"></script>
</body>
</html>
