<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场景脚本 · 声明式验证场景</title>
<!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
     必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。 -->
<script>
  try {
    var _t = localStorage.getItem("wb-theme");
    var _valid = ["theme-deepblue", "theme-emerald", "theme-charcoal", "theme-indigo"];
    if (_t && _valid.indexOf(_t) > -1) document.documentElement.className = _t;
  } catch (e) {}
</script>
<style>
:root{
  color-scheme: dark;
  --bg-0:#090c10; --bg-1:#0e1319; --bg-2:#131a22; --bg-3:#18212b; --bg-4:#1e2833;
  --line-1:#1f2935; --line-2:#2a3644; --line-3:#3a4a5c;
  --tx-1:#e8f0f7; --tx-2:#9aabbb; --tx-3:#65798c; --tx-4:#465768;
  --ac:#22d3ee; --ac-soft:rgba(34,211,238,.12);
  --am:#f0b429; --am-soft:rgba(240,180,41,.12); --mg:#e879a8;
  --tx-c:#f0b429; --rx-c:#2dd4bf; --ok-c:#34d399; --err-c:#f87171;
  --r-s:5px; --r-m:8px; --r-l:12px;
  --ff:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
  --fm:"JetBrains Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);font-size:13px;line-height:1.6;color:var(--tx-1);background:var(--bg-0);overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a.btn{text-decoration:none}
.mono{font-family:var(--fm);font-variant-ligatures:none}
.banner{display:none;align-items:center;gap:9px;padding:8px 16px;background:rgba(248,113,113,.1);
  border-bottom:1px solid rgba(248,113,113,.3);color:var(--err-c);font-size:12.5px}
.banner.show{display:flex}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-1)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx-3);white-space:nowrap}
.crumb b{color:var(--tx-1);font-weight:500;font-size:14px}
.top .sp{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);
  font-size:11px;font-weight:500;background:var(--bg-3);color:var(--tx-2);border:1px solid var(--line-1)}
.chip--ac{background:var(--ac-soft);color:var(--ac);border-color:rgba(34,211,238,.25)}
.chip--tx{background:rgba(240,180,41,.12);color:var(--tx-c);border-color:rgba(240,180,41,.28)}
.chip--rx{background:rgba(45,212,191,.12);color:var(--rx-c);border-color:rgba(45,212,191,.28)}
.chip--mg{background:rgba(232,121,168,.12);color:var(--mg);border-color:rgba(232,121,168,.3)}
.chip--ghost{background:transparent;color:var(--tx-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-3);color:var(--tx-2);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease);white-space:nowrap}
.btn:hover{background:var(--bg-4);color:var(--tx-1);border-color:var(--line-3)}
.btn--primary{background:linear-gradient(180deg,#22d3ee,#0ea5c4);color:#04222b;border-color:#0e9ab5;font-weight:500}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.hint{font-size:11px;color:var(--tx-4)}
.work{flex:1;display:grid;grid-template-columns:250px minmax(320px,400px) 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-1)}
.col+.col{border-left:1px solid var(--line-1)}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-2)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--tx-2)}
.sec-h .sp{margin-left:auto}
.col-body{flex:1;overflow-y:auto;min-height:0}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--tx-4)}
.empty p{font-size:12.5px;line-height:1.8}
/* 列1 场景卡 */
.sc-sec{padding:10px;display:grid;gap:8px}
.sc-card{display:block;width:100%;text-align:left;background:var(--bg-2);border:1px solid var(--line-1);
  border-radius:var(--r-m);padding:10px 11px;display:grid;gap:5px;transition:all .14s var(--ease);position:relative}
.sc-card:hover{border-color:var(--line-3);background:var(--bg-3)}
.sc-card.on{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,var(--ac-soft),var(--bg-2))}
.sc-card.on::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2.5px;border-radius:2px;background:var(--ac)}
.sc-r{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx-1);font-weight:500}
.sc-r .mono{margin-left:auto;font-size:10px;color:var(--tx-4);font-weight:400}
.sc-meta{display:flex;gap:5px;flex-wrap:wrap}
/* 列2 编排 */
.ed-head{padding:11px 12px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none;display:grid;gap:6px}
.ed-r1{display:flex;align-items:center;gap:8px}
.ed-r1 b{font-size:13px;color:var(--tx-1)}
.ed-label{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;color:var(--tx-4);padding:10px 12px 4px}
.flow-it{display:flex;align-items:center;gap:9px;position:relative;padding:6px 12px 6px 24px}
.flow-it::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1.5px;background:var(--line-2)}
.flow-it:first-child::before{top:50%}
.flow-it:last-child::before{bottom:50%}
.flow-it::after{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:var(--bg-1);border:2.5px solid var(--ac-dim)}
.flow-no{font-family:var(--fm);font-size:11px;color:var(--ac);width:36px;flex:none}
.flow-nm{font-size:12.5px;color:var(--tx-1)}
.flow-ev{font-family:var(--fm);font-size:10.5px;color:var(--tx-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-ms{font-family:var(--fm);font-size:10.5px;color:var(--am);flex:none}
.step{display:block;width:100%;text-align:left;border-top:1px solid rgba(31,41,53,.5);position:relative}
.step-h{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;transition:background .14s var(--ease)}
.step:hover .step-h{background:var(--bg-2)}
.step.on .step-h{background:linear-gradient(90deg,var(--ac-soft),transparent)}
.step-no{font-family:var(--fm);font-size:11px;color:var(--tx-3);flex:none;width:24px}
.step.on .step-no{color:var(--ac)}
.step-nm{flex:1;min-width:0;font-size:12.5px;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.on .step-nm{color:var(--tx-1)}
.resp-row{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--tx-3);border-top:1px solid rgba(31,41,53,.5);flex-wrap:wrap}
.resp-row .mono{color:var(--tx-1);font-size:11px}
.moni{padding:4px 12px 12px;display:flex;gap:5px;flex-wrap:wrap}
/* 列3 详情 */
.par-head{padding:12px 16px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none}
.par-t1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.par-t1 b{font-size:15px;font-weight:500}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-l);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg-3);
  border-bottom:1px solid var(--line-1);font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--tx-4);font-weight:400}
.card-in{padding:13px}
.ft{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ft th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--tx-4);
  padding:0 8px 7px;border-bottom:1px solid var(--line-1)}
.ft td{padding:7px 8px;border-bottom:1px solid rgba(31,41,53,.55);vertical-align:top}
.ft tr:last-child td{border-bottom:none}
.ft .nm{color:var(--tx-1);font-size:12px}
.ft .mono{font-family:var(--fm);font-size:11px;color:var(--am);word-break:break-all}
.jsonwrap{background:var(--bg-0);border:1px solid var(--line-1);border-radius:var(--r-m);padding:11px 12px;
  font-family:var(--fm);font-size:11.5px;line-height:1.8;color:var(--tx-2);white-space:pre-wrap;word-break:break-all;max-height:340px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner"></div>
  <header class="top">
    <div class="crumb"><b>场景脚本</b><span style="color:var(--tx-4)">/</span><span>声明式验证场景 · 期望流程 + 激励任务 + 监控规则</span></div>
    <div class="sp"></div>
    <a class="btn btn--sm btn--primary" href="/#workbench" target="_top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      去验证工作台执行
    </a>
  </header>
  <section class="work">
    <div class="col">
      <div class="sec-h"><h3>场景</h3><span class="sp"></span><span class="hint">JSON 即场景</span></div>
      <div class="col-body"><div class="sc-sec" id="scList"><div class="empty"><p>加载中…</p></div></div></div>
    </div>
    <div class="col">
      <div class="sec-h"><h3>步骤编排</h3><span class="sp"></span><span class="hint">expected_flow + stimulus + monitor</span></div>
      <div class="col-body" id="edBody"><div class="empty"><p>从左侧选择场景</p></div></div>
    </div>
    <div class="col">
      <div class="sec-h"><h3>步骤详情</h3><span class="sp"></span><span class="hint">语义化参数（ADR-5）</span></div>
      <div class="par-head" id="parHead"><div class="par-t2" style="padding:0">从中间列选择一个激励步骤。</div></div>
      <div class="col-body" id="parBody"><div class="empty"><p>未选择步骤</p></div></div>
    </div>
  </section>
</div>
<script src="scenario.js?v=scenario-v1"></script>
</body>
</html>
