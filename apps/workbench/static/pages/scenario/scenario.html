<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场景脚本 · 声明式验证场景</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
     必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。 -->
<script>
(function () {
  try {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    var _saved = localStorage.getItem("wb-theme");
    var _t;
    if (_saved && _keys.indexOf(_saved) > -1) {
      _t = _saved;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
               && _keys.indexOf("daylight") > -1) {
      _t = "daylight";
    } else {
      _t = _keys[0] || "midnight";
    }
    document.documentElement.dataset.theme = _t;
  } catch (e) {}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;line-height:1.6;color:var(--color-fg-default);background:var(--color-bg-canvas);overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:9px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a.btn{text-decoration:none}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.banner{display:none;align-items:center;gap:9px;padding:8px 16px;background:var(--color-status-fail-bg);
  border-bottom:1px solid var(--color-status-fail-border);color:var(--color-status-fail);font-size:12.5px}
.banner.show{display:flex}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--color-border-default);background:var(--color-bg-surface)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-fg-subtle);white-space:nowrap}
.crumb b{color:var(--color-fg-default);font-weight:500;font-size:14px}
.top .sp{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--radius-sm);
  font-size:11px;font-weight:500;background:var(--color-bg-elevated);color:var(--color-fg-muted);border:1px solid var(--color-border-default)}
.chip--ac{background:var(--color-accent-soft);color:var(--color-accent);border-color:var(--color-border-focus)}
.chip--tx{background:var(--color-dir-tx-soft);color:var(--color-dir-tx);border-color:var(--color-dir-tx)}
.chip--rx{background:var(--color-dir-rx-soft);color:var(--color-dir-rx);border-color:var(--color-dir-rx)}
.chip--mg{background:color-mix(in srgb, var(--color-status-special) 12%, transparent);color:var(--color-status-special);border-color:color-mix(in srgb, var(--color-status-special) 30%, transparent)}
.chip--ghost{background:transparent;color:var(--color-fg-subtle)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-bg-elevated);color:var(--color-fg-muted);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease-in-out);white-space:nowrap}
.btn:hover{background:var(--color-bg-hover);color:var(--color-fg-default);border-color:var(--color-border-emphasis)}
.btn--primary{background:linear-gradient(180deg,var(--color-accent),var(--color-accent-active));color:var(--color-accent-fg);border-color:var(--color-border-focus);font-weight:500}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.hint{font-size:11px;color:var(--color-fg-dim)}
.work{flex:1;display:grid;grid-template-columns:250px minmax(320px,400px) 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--color-bg-surface)}
.col+.col{border-left:1px solid var(--color-border-default)}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--color-fg-muted)}
.sec-h .sp{margin-left:auto}
.col-body{flex:1;overflow-y:auto;min-height:0}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--color-fg-dim)}
.empty p{font-size:12.5px;line-height:1.8}
/* 列1 场景卡 */
.sc-sec{padding:10px;display:grid;gap:8px}
.sc-card{display:block;width:100%;text-align:left;background:var(--color-bg-raised);border:1px solid var(--color-border-default);
  border-radius:var(--radius-md);padding:10px 11px;display:grid;gap:5px;transition:all .14s var(--ease-in-out);position:relative}
.sc-card:hover{border-color:var(--color-border-emphasis);background:var(--color-bg-elevated)}
.sc-card.on{border-color:var(--color-border-focus);background:linear-gradient(180deg,var(--color-accent-soft),var(--color-bg-raised))}
.sc-card.on::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2.5px;border-radius:2px;background:var(--color-accent)}
.sc-r{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--color-fg-default);font-weight:500}
.sc-r .mono{margin-left:auto;font-size:10px;color:var(--color-fg-dim);font-weight:400}
.sc-meta{display:flex;gap:5px;flex-wrap:wrap}
/* 列2 编排 */
.ed-head{padding:11px 12px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised);flex:none;display:grid;gap:6px}
.ed-r1{display:flex;align-items:center;gap:8px}
.ed-r1 b{font-size:13px;color:var(--color-fg-default)}
.ed-label{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;color:var(--color-fg-dim);padding:10px 12px 4px}
.flow-it{display:flex;align-items:center;gap:9px;position:relative;padding:6px 12px 6px 24px}
.flow-it::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1.5px;background:var(--color-border-strong)}
.flow-it:first-child::before{top:50%}
.flow-it:last-child::before{bottom:50%}
.flow-it::after{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:var(--color-bg-surface);border:2.5px solid var(--color-accent-emphasis)}
.flow-no{font-family:var(--font-mono);font-size:11px;color:var(--color-accent);width:36px;flex:none}
.flow-nm{font-size:12.5px;color:var(--color-fg-default)}
.flow-ev{font-family:var(--font-mono);font-size:10.5px;color:var(--color-fg-subtle);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-ms{font-family:var(--font-mono);font-size:10.5px;color:var(--color-status-warn);flex:none}
.step{display:block;width:100%;text-align:left;border-top:1px solid var(--color-border-default);position:relative}
.step-h{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;transition:background .14s var(--ease-in-out)}
.step:hover .step-h{background:var(--color-bg-raised)}
.step.on .step-h{background:linear-gradient(90deg,var(--color-accent-soft),transparent)}
.step-no{font-family:var(--font-mono);font-size:11px;color:var(--color-fg-subtle);flex:none;width:24px}
.step.on .step-no{color:var(--color-accent)}
.step-nm{flex:1;min-width:0;font-size:12.5px;color:var(--color-fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.on .step-nm{color:var(--color-fg-default)}
.resp-row{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--color-fg-subtle);border-top:1px solid var(--color-border-default);flex-wrap:wrap}
.resp-row .mono{color:var(--color-fg-default);font-size:11px}
.moni{padding:4px 12px 12px;display:flex;gap:5px;flex-wrap:wrap}
/* 列3 详情 */
.par-head{padding:12px 16px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised);flex:none}
.par-t1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.par-t1 b{font-size:15px;font-weight:500}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.card{background:var(--color-bg-raised);border:1px solid var(--color-border-default);border-radius:var(--radius-lg);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--color-bg-elevated);
  border-bottom:1px solid var(--color-border-default);font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--color-fg-dim);font-weight:400}
.card-in{padding:13px}
.ft{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ft th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--color-fg-dim);
  padding:0 8px 7px;border-bottom:1px solid var(--color-border-default)}
.ft td{padding:7px 8px;border-bottom:1px solid var(--color-border-default);vertical-align:top}
.ft tr:last-child td{border-bottom:none}
.ft .nm{color:var(--color-fg-default);font-size:12px}
.ft .mono{font-family:var(--font-mono);font-size:11px;color:var(--color-status-warn);word-break:break-all}
.jsonwrap{background:var(--color-bg-canvas);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:11px 12px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.8;color:var(--color-fg-muted);white-space:pre-wrap;word-break:break-all;max-height:340px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner"></div>
  <header class="top">
    <div class="crumb"><b>场景脚本</b><span style="color:var(--color-fg-dim)">/</span><span>声明式验证场景 · 期望流程 + 激励任务 + 监控规则</span></div>
    <div class="sp"></div>
    <a class="btn btn--sm btn--primary" href="/#workbench" target="_top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      去验证工作台执行
    </a>
  </header>
  <section class="work">
    <div class="col">
      <div class="sec-h"><h3>场景</h3><span class="sp"></span><span class="hint">JSON 即场景</span></div>
      <div class="col-body"><div class="sc-sec" id="scList"><div class="empty"><p>加载中…</p></div></div></div>
    </div>
    <div class="col">
      <div class="sec-h"><h3>步骤编排</h3><span class="sp"></span><span class="hint">expected_flow + stimulus + monitor</span></div>
      <div class="col-body" id="edBody"><div class="empty"><p>从左侧选择场景</p></div></div>
    </div>
    <div class="col">
      <div class="sec-h"><h3>步骤详情</h3><span class="sp"></span><span class="hint">语义化参数（ADR-5）</span></div>
      <div class="par-head" id="parHead"><div class="par-t2" style="padding:0">从中间列选择一个激励步骤。</div></div>
      <div class="col-body" id="parBody"><div class="empty"><p>未选择步骤</p></div></div>
    </div>
  </section>
</div>
<script src="scenario.js?v=scenario-v2"></script>
</body>
</html>
