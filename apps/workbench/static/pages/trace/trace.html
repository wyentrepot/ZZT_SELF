<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报文追踪 · 侦听台通信流追踪</title>
<link rel="stylesheet" href="/static/tokens-v2.css">
<!-- P0-4 防主题闪跳：子页面在 iframe 中独立渲染，父页 CSS 变量不会渗透进来，
     必须自行在首屏前应用已保存主题，否则会先闪一下默认深蓝。 -->
<script>
(function () {
  try {
    var _reg = getComputedStyle(document.documentElement).getPropertyValue("--theme-registry") || "";
    var _keys = _reg.replace(/["']/g, "").split(",").map(function (s) {
      return s.split("|")[0].trim();
    }).filter(Boolean);
    var _saved = localStorage.getItem("wb-theme");
    var _t;
    if (_saved && _keys.indexOf(_saved) > -1) {
      _t = _saved;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
               && _keys.indexOf("daylight") > -1) {
      _t = "daylight";
    } else {
      _t = _keys[0] || "midnight";
    }
    document.documentElement.dataset.theme = _t;
  } catch (e) {}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;line-height:1.6;color:var(--color-fg-default);background:var(--color-bg-canvas);overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:9px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--radius-sm);
  font-size:11px;font-weight:500;background:var(--color-bg-elevated);color:var(--color-fg-muted);border:1px solid var(--color-border-default)}
.chip--ac{background:var(--color-accent-soft);color:var(--color-accent);border-color:var(--color-border-focus)}
.chip--am{background:var(--color-status-warn-bg);color:var(--color-status-warn);border-color:var(--color-status-warn-border)}
.chip--tx{background:var(--color-dir-tx-soft);color:var(--color-dir-tx);border-color:var(--color-dir-tx)}
.chip--rx{background:var(--color-dir-rx-soft);color:var(--color-dir-rx);border-color:var(--color-dir-rx)}
.chip--ok{background:var(--color-status-pass-bg);color:var(--color-status-pass);border-color:var(--color-status-pass-border)}
.chip--err{background:var(--color-status-fail-bg);color:var(--color-status-fail);border-color:var(--color-status-fail-border)}
.chip--mg{background:color-mix(in srgb, var(--color-status-special) 12%, transparent);color:var(--color-status-special);border-color:color-mix(in srgb, var(--color-status-special) 30%, transparent)}
.chip--ghost{background:transparent;color:var(--color-fg-subtle)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-bg-elevated);color:var(--color-fg-muted);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease-in-out);white-space:nowrap}
.btn:hover{background:var(--color-bg-hover);color:var(--color-fg-default);border-color:var(--color-border-emphasis)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(180deg,var(--color-accent),var(--color-accent-active));color:var(--color-accent-fg);border-color:var(--color-border-focus);font-weight:500}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.btn--ghost{background:transparent;border-color:transparent;color:var(--color-fg-subtle)}
.btn--ghost:hover{background:var(--color-bg-elevated);color:var(--color-fg-default)}
.btn--danger:hover{color:var(--color-status-fail);border-color:var(--color-status-fail-border)}
.fld{width:100%;height:30px;padding:0 9px;border-radius:var(--radius-md);background:var(--color-bg-surface);
  border:1px solid var(--color-border-strong);color:var(--color-fg-default);font-size:12.5px;transition:all .14s var(--ease-in-out)}
.fld:hover{border-color:var(--color-border-emphasis)}
.fld:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-soft)}
select.fld{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='currentColor' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
.seg{display:flex;background:var(--color-bg-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:2px;gap:2px}
.seg button{height:22px;padding:0 10px;border-radius:5px;font-size:11.5px;color:var(--color-fg-subtle);transition:all .14s var(--ease-in-out)}
.seg button:hover{color:var(--color-fg-default)}
.seg button.on{background:var(--color-bg-hover);color:var(--color-fg-default)}

.app{display:flex;flex-direction:column;height:100vh}
.banner{display:none;align-items:center;gap:9px;padding:8px 16px;background:var(--color-status-fail-bg);
  border-bottom:1px solid var(--color-status-fail-border);color:var(--color-status-fail);font-size:12.5px}
.banner.show{display:flex}
.top{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--color-border-default);background:var(--color-bg-surface)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-fg-subtle);white-space:nowrap}
.crumb b{color:var(--color-fg-default);font-weight:500;font-size:14px}
.top .sp{margin-left:auto}
.hint{font-size:11px;color:var(--color-fg-dim)}

.work{flex:1;display:grid;grid-template-columns:280px minmax(340px,420px) 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--color-bg-surface)}
.col+.col{border-left:1px solid var(--color-border-default)}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--color-fg-muted)}
.sec-h .sp{margin-left:auto}
.col-body{flex:1;overflow-y:auto;min-height:0}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--color-fg-dim)}
.empty p{font-size:12.5px;line-height:1.8}

/* 列1 追踪列表 */
.tr-item{border-bottom:1px solid var(--color-border-default);cursor:pointer;position:relative;transition:background .14s var(--ease-in-out)}
.tr-item:hover{background:var(--color-bg-raised)}
.tr-item.sel{background:linear-gradient(90deg,var(--color-accent-soft),transparent)}
.tr-item.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--color-accent)}
.tr-in{padding:9px 11px;display:grid;gap:5px}
.tr-r1{display:flex;align-items:center;gap:7px}
.tr-id{font-family:var(--font-mono);font-size:12px;color:var(--color-accent);font-weight:500}
.tr-sum{font-size:11px;color:var(--color-fg-subtle);display:flex;gap:8px;flex-wrap:wrap}
.tr-sum b{color:var(--color-fg-muted);font-family:var(--font-mono);font-weight:500}
.tr-sum .bad{color:var(--color-status-warn)}

/* 列2 特征/轮 */
.ft-head{padding:11px 12px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised);flex:none;display:grid;gap:8px}
.ft-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:11px}
.ft-grid .k{color:var(--color-fg-dim);white-space:nowrap}
.ft-grid .v{color:var(--color-fg-muted);font-family:var(--font-mono);word-break:break-all}
.sumbar{display:flex;gap:5px;flex-wrap:wrap}
.form{padding:12px;display:grid;gap:9px;align-content:start}
.form .row{display:grid;gap:4px}
.form .row label{font-size:10.5px;letter-spacing:.06em;color:var(--color-fg-dim)}
.form .row label b{color:var(--color-status-warn);font-weight:400}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ckline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--color-fg-subtle)}
.ckline label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.ckline input{accent-color:var(--color-accent)}
.form-err{display:none;padding:7px 10px;border-radius:var(--radius-sm);background:var(--color-status-fail-bg);
  border:1px solid var(--color-status-fail-border);color:var(--color-status-fail);font-size:11.5px;line-height:1.6}
.form-err.show{display:block}
.round{border-bottom:1px solid var(--color-border-default)}
.round-h{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;text-align:left;transition:background .14s var(--ease-in-out)}
.round-h:hover{background:var(--color-bg-raised)}
.round.open .round-h{background:var(--color-bg-raised)}
.round-h .car{width:12px;height:12px;color:var(--color-fg-dim);transition:transform .18s var(--ease-in-out);flex:none}
.round.open .round-h .car{transform:rotate(90deg)}
.rnd-seq{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--color-accent);flex:none}
.rnd-cluster{flex:1;min-width:0;font-size:11px;color:var(--color-fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rnd-cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--color-fg-dim);flex:none}
.round-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease-in-out)}
.round.open .round-b{grid-template-rows:1fr}
.round-b>div{overflow:hidden;min-height:0}
/* 对账表 */
.recon{padding:4px 12px 8px 24px}
.recon-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.recon-t th{text-align:left;font-weight:400;color:var(--color-fg-dim);padding:2px 6px 4px;border-bottom:1px solid var(--color-border-default)}
.recon-t td{padding:3px 6px;border-bottom:1px solid var(--color-border-default);font-family:var(--font-mono);font-size:11px;color:var(--color-fg-muted)}
.recon-t tr:last-child td{border-bottom:none}
.rs-ok{color:var(--color-status-pass)}.rs-missing{color:var(--color-status-warn)}.rs-denied{color:var(--color-status-special)}
.flow-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px 6px 24px;text-align:left;
  border-top:1px solid var(--color-border-default);transition:background .12s var(--ease-in-out);position:relative}
.flow-row:hover{background:var(--color-bg-raised)}
.flow-row.sel{background:var(--color-accent-soft)}
.flow-row.sel::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--color-accent);border-radius:2px}
.flow-seq{font-family:var(--font-mono);font-size:11.5px;color:var(--color-fg-default);flex:none;width:64px}
.flow-tei{font-family:var(--font-mono);font-size:10.5px;color:var(--color-fg-subtle);flex:none;width:56px}
.flow-lat{font-family:var(--font-mono);font-size:10.5px;color:var(--color-fg-dim);flex:none;width:56px;text-align:right}
.st{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;
  font-size:10px;font-family:var(--font-mono);flex:none}
.st-confirmed{color:var(--color-status-pass);background:var(--color-status-pass-bg)}
.st-responded{color:var(--color-dir-rx);background:var(--color-dir-rx-soft)}
.st-acked{color:var(--color-status-warn);background:var(--color-status-warn-bg)}
.st-sent{color:var(--color-dir-tx);background:var(--color-dir-tx-soft)}
.st-denied{color:var(--color-status-special);background:color-mix(in srgb, var(--color-status-special) 12%, transparent)}
.st-armed,.st-timeout{color:var(--color-fg-subtle);background:var(--color-bg-elevated)}

/* 列3 证据链 */
.par-head{padding:12px 16px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-raised);flex:none}
.par-t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.par-t1 b{font-size:14px;font-weight:500;font-family:var(--font-mono)}
.par-t2{margin-top:6px;font-size:11.5px;color:var(--color-fg-subtle);line-height:1.6}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.card{background:var(--color-bg-raised);border:1px solid var(--color-border-default);border-radius:var(--radius-lg);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--color-bg-elevated);
  border-bottom:1px solid var(--color-border-default);font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--color-fg-dim);font-weight:400}
.card-in{padding:13px}
.ev{position:relative;padding-left:26px}
.ev::before{content:"";position:absolute;left:9px;top:6px;bottom:14px;width:1.5px;background:var(--color-border-strong)}
.ev-it{position:relative;padding-bottom:14px}
.ev-it:last-child{padding-bottom:2px}
.ev-it::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--color-bg-raised);border:2.5px solid var(--color-fg-dim)}
.ev-it.done::before{border-color:var(--color-status-pass);background:var(--color-status-pass)}
.ev-it.part::before{border-color:var(--color-status-warn)}
.ev-it.bad::before{border-color:var(--color-status-fail)}
.ev-r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-r1 b{font-size:12.5px;font-weight:500}
.ev-ds{margin-top:3px;font-size:11.5px;color:var(--color-fg-subtle);line-height:1.65;word-break:break-all}
.ev-ds em{font-style:normal;color:var(--color-status-warn);font-family:var(--font-mono)}
.ev-frame{display:inline-flex;align-items:center;gap:5px;margin-top:6px;height:22px;padding:0 8px;
  border-radius:var(--radius-sm);background:var(--color-bg-surface);border:1px solid var(--color-border-strong);font-size:11px;color:var(--color-fg-muted);cursor:pointer}
.ev-frame:hover{border-color:var(--color-border-emphasis);color:var(--color-fg-default)}
.ev-frame .mono{color:var(--color-accent)}
.hexwrap{background:var(--color-bg-canvas);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:10px 12px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.9;letter-spacing:.03em;word-break:break-all;color:var(--color-fg-muted);max-height:180px;overflow:auto}
.px-strip{flex:none;display:flex;align-items:flex-start;gap:10px;padding:9px 14px;background:var(--color-bg-raised);
  border-top:1px solid var(--color-border-strong);overflow-x:auto;min-height:38px}
.px-strip .lbl{font-size:10.5px;color:var(--color-fg-dim);letter-spacing:.06em;flex:none;padding-top:3px}
.px-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--color-fg-muted);padding:2px 8px;
  background:var(--color-bg-surface);border:1px solid var(--color-border-default);border-radius:var(--radius-sm);white-space:nowrap}
.px-item .mono{color:var(--color-fg-default)}
.px-item .arr{color:var(--color-status-special)}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner"></div>

  <header class="top">
    <div class="crumb"><b>报文追踪</b><span style="color:var(--color-fg-dim)">/</span><span>三段证据链 S1→S2a→S2b→S3（ADR-9）</span></div>
    <div class="sp"></div>
    <div class="seg" id="segMode">
      <button class="on" data-m="replay">回放</button>
      <button data-m="live">Live</button>
    </div>
    <button class="btn btn--sm btn--primary" id="btnNew">＋ 新建追踪</button>
    <button class="btn btn--sm" id="btnRefresh">刷新列表</button>
  </header>

  <section class="work">
    <!-- 列1：追踪列表 -->
    <div class="col">
      <div class="sec-h"><h3>追踪任务</h3><span class="sp"></span><span class="hint" id="lstCnt"></span></div>
      <div class="col-body" id="traceList"><div class="empty"><p>暂无追踪。<br>点右上角「新建追踪」以一次发送的特征锁定一条通信流。</p></div></div>
    </div>

    <!-- 列2：特征表单 / 结果概览 -->
    <div class="col">
      <div class="sec-h"><h3 id="midTitle">特征 · 新建追踪</h3><span class="sp"></span><span class="hint" id="midHint"></span></div>
      <div class="col-body" id="midCol"></div>
    </div>

    <!-- 列3：证据链 -->
    <div class="col">
      <div class="sec-h"><h3>三段证据链</h3><span class="sp"></span><span class="hint">每阶段挂 frame_id 可钻取</span></div>
      <div class="par-head" id="parHead"><div class="par-t2" style="padding:0">从中间列选择一条流（msg_seq）查看 S1 发出 → S2a 链路 ACK → S2b 同序号上行 → S3 0x0020 确认。</div></div>
      <div class="col-body" id="parBody"><div class="empty"><p>未选择流</p></div></div>
      <div class="px-strip" id="pxStrip"><span class="lbl">代理关系观测</span><span class="hint" style="padding-top:3px">追踪结果的 (表地址→应答STA) 副产物将显示在这里</span></div>
    </div>
  </section>
</div>

<script src="trace.js?v=trace-v2"></script>
</body>
</html>
