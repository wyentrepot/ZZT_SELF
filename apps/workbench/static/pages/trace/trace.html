<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报文追踪 · 侦听台通信流追踪</title>
<style>
/* ===== 设计基线：docs/ui/index.html（工业深色，与设计稿同源 token）===== */
:root{
  --bg-0:#090c10; --bg-1:#0e1319; --bg-2:#131a22; --bg-3:#18212b; --bg-4:#1e2833;
  --line-1:#1f2935; --line-2:#2a3644; --line-3:#3a4a5c;
  --tx-1:#e8f0f7; --tx-2:#9aabbb; --tx-3:#65798c; --tx-4:#465768;
  --ac:#22d3ee; --ac-soft:rgba(34,211,238,.12);
  --am:#f0b429; --am-soft:rgba(240,180,41,.12); --mg:#e879a8;
  --tx-c:#f0b429; --rx-c:#2dd4bf; --ok-c:#34d399; --warn-c:#fbbf24; --err-c:#f87171;
  --r-s:5px; --r-m:8px; --r-l:12px;
  --ff:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
  --fm:"JetBrains Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);font-size:13px;line-height:1.6;color:var(--tx-1);background:var(--bg-0);overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:var(--fm);font-variant-ligatures:none}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);
  font-size:11px;font-weight:500;background:var(--bg-3);color:var(--tx-2);border:1px solid var(--line-1)}
.chip--ac{background:var(--ac-soft);color:var(--ac);border-color:rgba(34,211,238,.25)}
.chip--am{background:var(--am-soft);color:var(--am);border-color:rgba(240,180,41,.25)}
.chip--tx{background:rgba(240,180,41,.12);color:var(--tx-c);border-color:rgba(240,180,41,.28)}
.chip--rx{background:rgba(45,212,191,.12);color:var(--rx-c);border-color:rgba(45,212,191,.28)}
.chip--ok{background:rgba(52,211,153,.12);color:var(--ok-c);border-color:rgba(52,211,153,.28)}
.chip--err{background:rgba(248,113,113,.12);color:var(--err-c);border-color:rgba(248,113,113,.3)}
.chip--mg{background:rgba(232,121,168,.12);color:var(--mg);border-color:rgba(232,121,168,.3)}
.chip--ghost{background:transparent;color:var(--tx-3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-3);color:var(--tx-2);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease);white-space:nowrap}
.btn:hover{background:var(--bg-4);color:var(--tx-1);border-color:var(--line-3)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(180deg,#22d3ee,#0ea5c4);color:#04222b;border-color:#0e9ab5;font-weight:500}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.btn--ghost{background:transparent;border-color:transparent;color:var(--tx-3)}
.btn--ghost:hover{background:var(--bg-3);color:var(--tx-1)}
.btn--danger:hover{color:var(--err-c);border-color:rgba(248,113,113,.4)}
.fld{width:100%;height:30px;padding:0 9px;border-radius:var(--r-m);background:var(--bg-1);
  border:1px solid var(--line-2);color:var(--tx-1);font-size:12.5px;transition:all .14s var(--ease)}
.fld:hover{border-color:var(--line-3)}
.fld:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
select.fld{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2365798c' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
.seg{display:flex;background:var(--bg-1);border:1px solid var(--line-2);border-radius:var(--r-m);padding:2px;gap:2px}
.seg button{height:22px;padding:0 10px;border-radius:5px;font-size:11.5px;color:var(--tx-3);transition:all .14s var(--ease)}
.seg button:hover{color:var(--tx-1)}
.seg button.on{background:var(--bg-4);color:var(--tx-1)}

.app{display:flex;flex-direction:column;height:100vh}
.banner{display:none;align-items:center;gap:9px;padding:8px 16px;background:rgba(248,113,113,.1);
  border-bottom:1px solid rgba(248,113,113,.3);color:var(--err-c);font-size:12.5px}
.banner.show{display:flex}
.top{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-1)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx-3);white-space:nowrap}
.crumb b{color:var(--tx-1);font-weight:500;font-size:14px}
.top .sp{margin-left:auto}
.hint{font-size:11px;color:var(--tx-4)}

.work{flex:1;display:grid;grid-template-columns:280px minmax(340px,420px) 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-1)}
.col+.col{border-left:1px solid var(--line-1)}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-2)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--tx-2)}
.sec-h .sp{margin-left:auto}
.col-body{flex:1;overflow-y:auto;min-height:0}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--tx-4)}
.empty p{font-size:12.5px;line-height:1.8}

/* 列1 追踪列表 */
.tr-item{border-bottom:1px solid rgba(31,41,53,.6);cursor:pointer;position:relative;transition:background .14s var(--ease)}
.tr-item:hover{background:var(--bg-2)}
.tr-item.sel{background:linear-gradient(90deg,var(--ac-soft),transparent)}
.tr-item.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac)}
.tr-in{padding:9px 11px;display:grid;gap:5px}
.tr-r1{display:flex;align-items:center;gap:7px}
.tr-id{font-family:var(--fm);font-size:12px;color:var(--ac);font-weight:500}
.tr-sum{font-size:11px;color:var(--tx-3);display:flex;gap:8px;flex-wrap:wrap}
.tr-sum b{color:var(--tx-2);font-family:var(--fm);font-weight:500}
.tr-sum .bad{color:var(--warn-c)}

/* 列2 特征/轮 */
.ft-head{padding:11px 12px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none;display:grid;gap:8px}
.ft-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:11px}
.ft-grid .k{color:var(--tx-4);white-space:nowrap}
.ft-grid .v{color:var(--tx-2);font-family:var(--fm);word-break:break-all}
.sumbar{display:flex;gap:5px;flex-wrap:wrap}
.form{padding:12px;display:grid;gap:9px;align-content:start}
.form .row{display:grid;gap:4px}
.form .row label{font-size:10.5px;letter-spacing:.06em;color:var(--tx-4)}
.form .row label b{color:var(--am);font-weight:400}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ckline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx-3)}
.ckline label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.ckline input{accent-color:var(--ac)}
.form-err{display:none;padding:7px 10px;border-radius:var(--r-s);background:rgba(248,113,113,.1);
  border:1px solid rgba(248,113,113,.3);color:var(--err-c);font-size:11.5px;line-height:1.6}
.form-err.show{display:block}
.round{border-bottom:1px solid rgba(31,41,53,.6)}
.round-h{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;text-align:left;transition:background .14s var(--ease)}
.round-h:hover{background:var(--bg-2)}
.round.open .round-h{background:var(--bg-2)}
.round-h .car{width:12px;height:12px;color:var(--tx-4);transition:transform .18s var(--ease);flex:none}
.round.open .round-h .car{transform:rotate(90deg)}
.rnd-seq{font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--ac);flex:none}
.rnd-cluster{flex:1;min-width:0;font-size:11px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rnd-cnt{font-family:var(--fm);font-size:10.5px;color:var(--tx-4);flex:none}
.round-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.round.open .round-b{grid-template-rows:1fr}
.round-b>div{overflow:hidden;min-height:0}
/* 对账表 */
.recon{padding:4px 12px 8px 24px}
.recon-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.recon-t th{text-align:left;font-weight:400;color:var(--tx-4);padding:2px 6px 4px;border-bottom:1px solid var(--line-1)}
.recon-t td{padding:3px 6px;border-bottom:1px solid rgba(31,41,53,.5);font-family:var(--fm);font-size:11px;color:var(--tx-2)}
.recon-t tr:last-child td{border-bottom:none}
.rs-ok{color:var(--ok-c)}.rs-missing{color:var(--warn-c)}.rs-denied{color:var(--mg)}
.flow-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px 6px 24px;text-align:left;
  border-top:1px solid rgba(31,41,53,.45);transition:background .12s var(--ease);position:relative}
.flow-row:hover{background:var(--bg-2)}
.flow-row.sel{background:var(--ac-soft)}
.flow-row.sel::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--ac);border-radius:2px}
.flow-seq{font-family:var(--fm);font-size:11.5px;color:var(--tx-1);flex:none;width:64px}
.flow-tei{font-family:var(--fm);font-size:10.5px;color:var(--tx-3);flex:none;width:56px}
.flow-lat{font-family:var(--fm);font-size:10.5px;color:var(--tx-4);flex:none;width:56px;text-align:right}
.st{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;
  font-size:10px;font-family:var(--fm);flex:none}
.st-confirmed{color:var(--ok-c);background:rgba(52,211,153,.12)}
.st-responded{color:var(--ac);background:var(--ac-soft)}
.st-acked{color:var(--am);background:var(--am-soft)}
.st-sent{color:var(--tx-c);background:rgba(240,180,41,.1)}
.st-denied{color:var(--mg);background:rgba(232,121,168,.12)}
.st-armed,.st-timeout{color:var(--tx-3);background:var(--bg-3)}

/* 列3 证据链 */
.par-head{padding:12px 16px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none}
.par-t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.par-t1 b{font-size:14px;font-weight:500;font-family:var(--fm)}
.par-t2{margin-top:6px;font-size:11.5px;color:var(--tx-3);line-height:1.6}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-l);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg-3);
  border-bottom:1px solid var(--line-1);font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--tx-4);font-weight:400}
.card-in{padding:13px}
.ev{position:relative;padding-left:26px}
.ev::before{content:"";position:absolute;left:9px;top:6px;bottom:14px;width:1.5px;background:var(--line-2)}
.ev-it{position:relative;padding-bottom:14px}
.ev-it:last-child{padding-bottom:2px}
.ev-it::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--bg-2);border:2.5px solid var(--tx-4)}
.ev-it.done::before{border-color:var(--ok-c);background:var(--ok-c)}
.ev-it.part::before{border-color:var(--am)}
.ev-it.bad::before{border-color:var(--err-c)}
.ev-r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-r1 b{font-size:12.5px;font-weight:500}
.ev-ds{margin-top:3px;font-size:11.5px;color:var(--tx-3);line-height:1.65;word-break:break-all}
.ev-ds em{font-style:normal;color:var(--am);font-family:var(--fm)}
.ev-frame{display:inline-flex;align-items:center;gap:5px;margin-top:6px;height:22px;padding:0 8px;
  border-radius:var(--r-s);background:var(--bg-1);border:1px solid var(--line-2);font-size:11px;color:var(--tx-2);cursor:pointer}
.ev-frame:hover{border-color:var(--line-3);color:var(--tx-1)}
.ev-frame .mono{color:var(--ac)}
.hexwrap{background:var(--bg-0);border:1px solid var(--line-1);border-radius:var(--r-m);padding:10px 12px;
  font-family:var(--fm);font-size:11.5px;line-height:1.9;letter-spacing:.03em;word-break:break-all;color:var(--tx-2);max-height:180px;overflow:auto}
.px-strip{flex:none;display:flex;align-items:flex-start;gap:10px;padding:9px 14px;background:var(--bg-2);
  border-top:1px solid var(--line-2);overflow-x:auto;min-height:38px}
.px-strip .lbl{font-size:10.5px;color:var(--tx-4);letter-spacing:.06em;flex:none;padding-top:3px}
.px-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-2);padding:2px 8px;
  background:var(--bg-1);border:1px solid var(--line-1);border-radius:var(--r-s);white-space:nowrap}
.px-item .mono{color:var(--tx-1)}
.px-item .arr{color:var(--mg)}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner"></div>

  <header class="top">
    <div class="crumb"><b>报文追踪</b><span style="color:var(--tx-4)">/</span><span>三段证据链 S1→S2a→S2b→S3（ADR-9）</span></div>
    <div class="sp"></div>
    <div class="seg" id="segMode">
      <button class="on" data-m="replay">回放</button>
      <button data-m="live">Live</button>
    </div>
    <button class="btn btn--sm btn--primary" id="btnNew">＋ 新建追踪</button>
    <button class="btn btn--sm" id="btnRefresh">刷新列表</button>
  </header>

  <section class="work">
    <!-- 列1：追踪列表 -->
    <div class="col">
      <div class="sec-h"><h3>追踪任务</h3><span class="sp"></span><span class="hint" id="lstCnt"></span></div>
      <div class="col-body" id="traceList"><div class="empty"><p>暂无追踪。<br>点右上角「新建追踪」以一次发送的特征锁定一条通信流。</p></div></div>
    </div>

    <!-- 列2：特征表单 / 结果概览 -->
    <div class="col">
      <div class="sec-h"><h3 id="midTitle">特征 · 新建追踪</h3><span class="sp"></span><span class="hint" id="midHint"></span></div>
      <div class="col-body" id="midCol"></div>
    </div>

    <!-- 列3：证据链 -->
    <div class="col">
      <div class="sec-h"><h3>三段证据链</h3><span class="sp"></span><span class="hint">每阶段挂 frame_id 可钻取</span></div>
      <div class="par-head" id="parHead"><div class="par-t2" style="padding:0">从中间列选择一条流（msg_seq）查看 S1 发出 → S2a 链路 ACK → S2b 同序号上行 → S3 0x0020 确认。</div></div>
      <div class="col-body" id="parBody"><div class="empty"><p>未选择流</p></div></div>
      <div class="px-strip" id="pxStrip"><span class="lbl">代理关系观测</span><span class="hint" style="padding-top:3px">追踪结果的 (表地址→应答STA) 副产物将显示在这里</span></div>
    </div>
  </section>
</div>

<script src="trace.js?v=trace-v1"></script>
</body>
</html>
