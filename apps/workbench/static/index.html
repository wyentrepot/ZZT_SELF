<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 闭环研发验证工作台</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/styles.css">
<!-- P0-4 防主题闪跳：必须在首屏渲染前执行，故内联于 head 且不 defer。
     原先 app.js 在 </body> 前才应用主题，非默认主题下刷新会先渲染默认深蓝，
     再经 body 的 transition 0.3s 渐变跳到目标主题 —— 一次可见的闪跳。
     白名单校验防止 localStorage 脏值写坏 html 的 className。 -->
<script>
  try {
    var _t = localStorage.getItem("wb-theme");
    var _valid = ["theme-deepblue", "theme-emerald", "theme-charcoal", "theme-indigo"];
    if (_t && _valid.indexOf(_t) > -1) document.documentElement.className = _t;
  } catch (e) {}
</script>
</head>
<body>
<div class="wb-app">
  <header class="wb-header">
    <div class="wb-brand">
      <span class="wb-logo">AI</span>
      <div>
        <div class="wb-title">AI 闭环研发验证工作台</div>
        <div class="wb-sub" id="wb-status">统一集成程序 · 侦听台 / 模块日志 / 模拟集中器 / 验证工作台</div>
      </div>
    </div>
    <div class="wb-header-actions">
      <div class="wb-themes" id="wbThemes">
        <button class="theme-dot active" data-theme="theme-deepblue" title="深蓝科技">🌊</button>
        <button class="theme-dot" data-theme="theme-emerald" title="暗色翡翠">🌿</button>
        <button class="theme-dot" data-theme="theme-charcoal" title="炭黑灰金">✦</button>
        <button class="theme-dot" data-theme="theme-indigo" title="靛蓝玻璃">🔮</button>
      </div>
      <button class="wb-collapse-btn" id="wbCollapseBtn" type="button" aria-label="折叠侧栏" aria-expanded="true" title="折叠/展开侧栏">☰</button>
    </div>
  </header>
  <div class="wb-body">
    <aside class="wb-sidebar" id="wb-sidebar" aria-label="主导航">
      <nav class="wb-nav-groups" id="wbNavGroups"></nav>
    </aside>
    <div class="wb-overlay" id="wbOverlay" hidden></div>
    <main class="wb-main" id="wbMain">
      <div id="wb-panels" class="wb-panels" aria-live="polite"></div>
    </main>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
