<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场景脚本 · 声明式验证场景 — UI 设计稿</title>
<style>
/* ============ Design Tokens（与 sim-concentrator-ui.html 同源） ============ */
:root{
  --bg-0:#090c10; --bg-1:#0e1319; --bg-2:#131a22; --bg-3:#18212b; --bg-4:#1e2833;
  --line-1:#1f2935; --line-2:#2a3644; --line-3:#3a4a5c;
  --tx-1:#e8f0f7; --tx-2:#9aabbb; --tx-3:#65798c; --tx-4:#465768;
  --ac:#22d3ee; --ac-dim:#0e7490; --ac-soft:rgba(34,211,238,.12);
  --am:#f0b429; --am-soft:rgba(240,180,41,.12); --mg:#e879a8;
  --tx-c:#f0b429; --rx-c:#2dd4bf; --ok-c:#34d399; --warn-c:#fbbf24; --err-c:#f87171;
  --r-s:5px; --r-m:8px; --r-l:12px; --sp:4px;
  --ff:"HarmonyOS Sans SC","PingFang SC","Source Han Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --fm:"JetBrains Mono","Cascadia Mono","Sarasa Mono SC","Consolas",ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);font-size:13px;line-height:1.6;color:var(--tx-1);
  background:
    radial-gradient(1200px 700px at 12% -10%, #12212c 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, #17202b 0%, transparent 55%),
    var(--bg-0);
  overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--fm);font-variant-ligatures:none}

/* ============ 通用组件 ============ */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);
  font-size:11px;font-weight:500;letter-spacing:.02em;background:var(--bg-3);color:var(--tx-2);border:1px solid var(--line-1)}
.chip--ac{background:var(--ac-soft);color:var(--ac);border-color:rgba(34,211,238,.25)}
.chip--am{background:var(--am-soft);color:var(--am);border-color:rgba(240,180,41,.25)}
.chip--tx{background:rgba(240,180,41,.12);color:var(--tx-c);border-color:rgba(240,180,41,.28)}
.chip--rx{background:rgba(45,212,191,.12);color:var(--rx-c);border-color:rgba(45,212,191,.28)}
.chip--ok{background:rgba(52,211,153,.12);color:var(--ok-c);border-color:rgba(52,211,153,.28)}
.chip--err{background:rgba(248,113,113,.12);color:var(--err-c);border-color:rgba(248,113,113,.3)}
.chip--mg{background:rgba(232,121,168,.12);color:var(--mg);border-color:rgba(232,121,168,.3)}
.chip--ghost{background:transparent;color:var(--tx-3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-3);color:var(--tx-2);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease);white-space:nowrap}
.btn:hover{background:var(--bg-4);color:var(--tx-1);border-color:var(--line-3)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(180deg,#22d3ee,#0ea5c4);color:#04222b;border-color:#0e9ab5;font-weight:500}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.btn--ghost{background:transparent;border-color:transparent;color:var(--tx-3)}
.btn--ghost:hover{background:var(--bg-3);color:var(--tx-1)}
a.btn{text-decoration:none}
.fld{width:100%;height:30px;padding:0 9px;border-radius:var(--r-m);background:var(--bg-1);
  border:1px solid var(--line-2);color:var(--tx-1);font-size:12.5px;transition:all .14s var(--ease)}
.fld:hover{border-color:var(--line-3)}
.fld:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
select.fld{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2365798c' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-2)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--tx-2)}
.sec-h .sp{margin-left:auto}

/* ============ 骨架 ============ */
.app{display:grid;grid-template-columns:var(--sb-w,232px) 1fr;height:100vh;
  transition:grid-template-columns .22s var(--ease)}
.app.collapsed{--sb-w:56px}
.sb{display:flex;flex-direction:column;min-width:0;background:var(--bg-1);
  border-right:1px solid var(--line-1);position:relative;z-index:5}
.sb-top{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 13px;flex:none;
  border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}
.brand-mark{width:26px;height:26px;flex:none;border-radius:7px;
  background:linear-gradient(140deg,#22d3ee,#0e7490);display:grid;place-items:center}
.brand-mark svg{width:15px;height:15px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.brand-txt span{display:block;font-size:10.5px;color:var(--tx-3);white-space:nowrap}
.collapsed .brand-txt{opacity:0;pointer-events:none}
.collapsed .sb-top{justify-content:center;padding:0}
.sb-toggle{flex:none;width:28px;height:28px;border-radius:var(--r-m);display:grid;place-items:center;
  color:var(--tx-3);transition:all .14s var(--ease)}
.sb-toggle:hover{background:var(--bg-3);color:var(--tx-1)}
.collapsed .sb-toggle{transform:rotate(180deg)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 8px 16px}
.nav-label{font-size:10px;letter-spacing:.12em;color:var(--tx-4);padding:12px 8px 5px;white-space:nowrap}
.collapsed .nav-label{opacity:0;height:14px;padding:8px 0 0;text-align:center;overflow:hidden}
.collapsed .nav-label::after{content:"";display:block;height:1px;background:var(--line-1);margin:6px 8px 0}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:var(--r-m);
  color:var(--tx-2);font-size:13px;cursor:pointer;position:relative;width:100%;text-align:left;text-decoration:none;
  transition:background .14s var(--ease),color .14s var(--ease)}
.nav-item:hover{background:var(--bg-2);color:var(--tx-1)}
.nav-item.on{background:linear-gradient(90deg,var(--ac-soft),transparent 92%);color:var(--ac)}
.nav-item.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2.5px;
  border-radius:0 3px 3px 0;background:var(--ac)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:10.5px;color:var(--tx-4);font-family:var(--fm)}
.collapsed .nav-item{justify-content:center;padding:0}
.collapsed .nav-item .t,.collapsed .nav-item .cnt{display:none}
.collapsed .nav-item.on::before{left:0}
.collapsed .nav-item::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--bg-4);border:1px solid var(--line-2);color:var(--tx-1);
  padding:5px 9px;border-radius:var(--r-s);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s var(--ease);z-index:40}
.collapsed .nav-item:hover::after{opacity:1}
.grp{margin-top:2px}
.grp-h{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-m);
  color:var(--tx-3);font-size:12.5px;cursor:pointer;transition:all .14s var(--ease);width:100%;text-align:left}
.grp-h:hover{background:var(--bg-2);color:var(--tx-2)}
.grp-h .car{width:13px;height:13px;flex:none;transition:transform .18s var(--ease);opacity:.7}
.grp.open .grp-h .car{transform:rotate(90deg)}
.grp-h .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.grp.open .grp-b{grid-template-rows:1fr}
.grp-b>div{overflow:hidden;min-height:0}
.grp-b .inner{padding:2px 0 4px 0}
.collapsed .grp-h{justify-content:center;padding:0}
.collapsed .grp-h .t,.collapsed .grp-h .car{display:none}
.collapsed .grp-b{display:none}
.sub-item{display:flex;align-items:center;gap:8px;height:29px;padding:0 9px 0 20px;border-radius:var(--r-m);
  color:var(--tx-3);font-size:12.5px;cursor:pointer;transition:all .14s var(--ease);width:100%;text-align:left}
.sub-item:hover{background:var(--bg-2);color:var(--tx-1)}
.sub-item.on{color:var(--ac);background:var(--ac-soft)}
.sub-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{width:5px;height:5px;border-radius:50%;flex:none}
.sb-foot{flex:none;padding:9px;border-top:1px solid var(--line-1);display:grid;gap:7px}
.com-card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-m);padding:8px 9px}
.com-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-3)}
.com-row+.com-row{margin-top:5px}
.com-row b{font-family:var(--fm);color:var(--tx-2);font-size:11.5px;font-weight:400}
.collapsed .sb-foot{padding:9px 7px}
.collapsed .com-card{display:none}
.collapsed .sb-foot .btn span{display:none}
.collapsed .sb-foot .btn{width:100%}

/* ---------- 主区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-1)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx-3);min-width:0;white-space:nowrap}
.crumb b{color:var(--tx-1);font-weight:500;font-size:14px}
.crumb .sep{color:var(--tx-4)}
.top .sp{margin-left:auto}
.work{flex:1;display:grid;grid-template-columns:var(--c1,258px) var(--c2,396px) 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-1)}
.col+.col{border-left:1px solid var(--line-1)}
.col-body{flex:1;overflow-y:auto;min-height:0}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--tx-4)}
.empty p{font-size:12.5px;line-height:1.7}

/* 列1：场景列表 */
.sc-sec{padding:10px;display:grid;gap:8px}
.sc-card{display:block;width:100%;text-align:left;background:var(--bg-2);border:1px solid var(--line-1);
  border-radius:var(--r-m);padding:10px 11px;display:grid;gap:5px;transition:all .14s var(--ease);position:relative}
.sc-card:hover{border-color:var(--line-3);background:var(--bg-3)}
.sc-card.on{border-color:rgba(34,211,238,.35);background:linear-gradient(180deg,var(--ac-soft),var(--bg-2))}
.sc-card.on::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2.5px;border-radius:2px;background:var(--ac)}
.sc-r{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx-1);font-weight:500}
.sc-r .mono{margin-left:auto;font-size:10px;color:var(--tx-4);font-weight:400}
.sc-s{font-size:10.5px;color:var(--tx-4);line-height:1.6}
.sc-meta{display:flex;gap:5px;flex-wrap:wrap}

/* 列2：编排 */
.ed-head{padding:11px 12px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none;display:grid;gap:7px}
.ed-r1{display:flex;align-items:center;gap:8px}
.ed-r1 b{font-size:13px;color:var(--tx-1)}
.ed-desc{font-size:11px;color:var(--tx-3);line-height:1.6}
.ed-label{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;color:var(--tx-4);padding:10px 12px 4px}
.flow{padding:2px 12px 6px;display:grid;gap:0}
.flow-it{display:flex;align-items:center;gap:9px;position:relative;padding:6px 0 6px 22px}
.flow-it::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1.5px;background:var(--line-2)}
.flow-it:first-child::before{top:50%}
.flow-it:last-child::before{bottom:50%}
.flow-it::after{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:var(--bg-1);border:2.5px solid var(--ac-dim)}
.flow-it.hit::after{background:var(--ok-c);border-color:var(--ok-c)}
.flow-no{font-family:var(--fm);font-size:11px;color:var(--ac);width:46px;flex:none}
.flow-nm{font-size:12.5px;color:var(--tx-1)}
.flow-ev{font-family:var(--fm);font-size:10.5px;color:var(--tx-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-ms{font-family:var(--fm);font-size:10.5px;color:var(--am);flex:none}
.step{border-top:1px solid rgba(31,41,53,.5)}
.step-h{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;text-align:left;transition:background .14s var(--ease)}
.step-h:hover{background:var(--bg-2)}
.step.on .step-h{background:linear-gradient(90deg,var(--ac-soft),transparent)}
.step.on .step-h::before{content:"";margin-left:-12px;width:2.5px;height:100%;position:absolute;left:0}
.step-no{font-family:var(--fm);font-size:11px;color:var(--tx-3);flex:none;width:26px}
.step.on .step-no{color:var(--ac)}
.step-nm{flex:1;min-width:0;font-size:12.5px;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.on .step-nm{color:var(--tx-1)}
.step-tags{display:flex;gap:4px;flex:none}
.resp-row{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--tx-3);border-top:1px solid rgba(31,41,53,.5)}
.resp-row .mono{color:var(--tx-1);font-size:11px}
.resp-row .arr{color:var(--mg)}
.moni{padding:4px 12px 10px;display:flex;gap:5px;flex-wrap:wrap}

/* 列3：步骤详情 */
.par{display:flex;flex-direction:column;min-height:0;background:var(--bg-1)}
.par-head{padding:12px 16px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none}
.par-t1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.par-t1 b{font-size:15px;font-weight:500}
.par-t2{margin-top:7px;font-size:12px;color:var(--tx-3);line-height:1.6}
.par-t2 em{font-style:normal;color:var(--am);font-family:var(--fm)}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.par-foot{flex:none;padding:11px 16px;border-top:1px solid var(--line-1);background:var(--bg-2);display:flex;align-items:center;gap:10px}
.par-foot .sp{margin-left:auto}
.par-foot .meta{font-size:11px;color:var(--tx-4);font-family:var(--fm)}
.card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-l);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;background:var(--bg-3);
  border-bottom:1px solid transparent;transition:background .14s var(--ease)}
.card-h:hover{background:var(--bg-4)}
.card.open .card-h{border-bottom-color:var(--line-1)}
.card-h .ic{width:15px;height:15px;color:var(--ac);flex:none}
.card-h b{font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--tx-4)}
.card-h .car{width:13px;height:13px;color:var(--tx-4);transition:transform .18s var(--ease)}
.card.open .card-h .car{transform:rotate(90deg)}
.card-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.card.open .card-b{grid-template-rows:1fr}
.card-b>div{overflow:hidden;min-height:0}
.card-in{padding:13px}
.ft{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ft th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--tx-4);
  padding:0 8px 7px;border-bottom:1px solid var(--line-1)}
.ft td{padding:7px 8px;border-bottom:1px solid rgba(31,41,53,.55);vertical-align:top}
.ft tr:last-child td{border-bottom:none}
.ft .nm{color:var(--tx-1);font-size:12px}
.ft .ds{margin-top:3px;font-size:11px;color:var(--tx-4);line-height:1.55}
.ft .mono{font-family:var(--fm);font-size:11px;color:var(--am)}
.hexwrap{background:var(--bg-0);border:1px solid var(--line-1);border-radius:var(--r-m);padding:11px 12px}
.hex{font-family:var(--fm);font-size:12.5px;line-height:2;letter-spacing:.04em;word-break:break-all}
.hx{padding:1px 3px;border-radius:3px;cursor:default;transition:background .12s var(--ease)}
.hx:hover{outline:1px solid var(--line-3)}
.s-68,.s-16{color:var(--mg)}
.s-L{color:var(--mg)}
.s-C{color:var(--am)}
.s-R{color:var(--tx-2)}
.s-AFN{color:var(--ac);font-weight:500}
.s-DT{color:#a78bfa}
.s-DU{color:var(--tx-1)}
.s-CS{color:var(--am)}
.jsonwrap{background:var(--bg-0);border:1px solid var(--line-1);border-radius:var(--r-m);padding:11px 12px;
  font-family:var(--fm);font-size:11.5px;line-height:1.8;color:var(--tx-2);white-space:pre-wrap;word-break:break-all}
.jsonwrap .k2{color:var(--ac)}
.jsonwrap .v2{color:var(--am)}
.jsonwrap .s2{color:var(--rx-c)}

/* ---------- 底部：执行历史 ---------- */
.traffic{flex:none;display:flex;flex-direction:column;background:var(--bg-1);
  border-top:1px solid var(--line-2);height:var(--th,216px);transition:height .22s var(--ease)}
.traffic.fold{--th:37px}
.tr-h{display:flex;align-items:center;gap:10px;height:37px;padding:0 12px;flex:none;cursor:pointer;
  user-select:none;background:var(--bg-2)}
.tr-h:hover{background:var(--bg-3)}
.tr-h .car{width:13px;height:13px;color:var(--tx-3);transition:transform .18s var(--ease)}
.traffic:not(.fold) .tr-h .car{transform:rotate(90deg)}
.tr-h .ttl{font-size:12.5px;font-weight:500;letter-spacing:.02em}
.tr-h .sp{margin-left:auto}
.run-row{border-bottom:1px solid rgba(31,41,53,.55);display:flex;align-items:center;gap:10px;
  padding:7px 12px;font-size:12px;transition:background .12s var(--ease)}
.run-row:hover{background:var(--bg-2)}
.run-id{font-family:var(--fm);font-size:11px;color:var(--ac);flex:none;width:150px}
.run-sc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-2)}
.run-t{font-family:var(--fm);font-size:10.5px;color:var(--tx-4);flex:none;width:70px}
.res{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:4px;font-size:10.5px;
  font-family:var(--fm);flex:none}
.res-pass{color:var(--ok-c);background:rgba(52,211,153,.12)}
.res-fail{color:var(--err-c);background:rgba(248,113,113,.12)}
.res-inc{color:var(--warn-c);background:rgba(251,191,36,.12)}
.run-note{font-size:11px;color:var(--tx-4);flex:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 标注层 ---------- */
.anno{position:fixed;right:16px;bottom:16px;width:300px;z-index:60;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);
  box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}

.anno-pages a{font-size:10.5px;color:var(--tx-3);text-decoration:none;border:1px solid var(--line-1);

.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;

.tag::after{content:attr(data-d);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--bg-4);border:1px solid var(--line-3);color:var(--tx-1);padding:6px 9px;border-radius:var(--r-s);
  font-family:var(--ff);font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s var(--ease);z-index:70}
.tag:hover::after{opacity:1}
body.anno-on [data-an]{outline:1px dashed var(--am);outline-offset:2px;border-radius:var(--r-s)}
body.anno-on [data-an]::after{content:attr(data-an-t);position:absolute;top:-8px;right:-4px;

<script>
/* ═══════════ mock：场景（对齐 apps/workbench/scenarios/*.json） ═══════════ */
const SCENARIOS=[
 {id:"join_anhui",name:"STA 入网（安徽）",module:"cco",desc:"上电后 CCO 扫信道→STA 关联→全体在网；monitor 挂模块日志事件源。",
  flow:[{no:"01",step:"scan",ev:"nwk.scan.start",ms:10000,hit:1},{no:"02",step:"assoc",ev:"join.sta.ok",ms:30000,hit:1},{no:"03",step:"onnet",ev:"network.onnet",ms:15000}],
  task:"tasks/join_anhui.json",steps:3,resp:0,rules:["common","provinces/anhui"]},
 {id:"minute_collect",name:"分钟采集",module:"cco",desc:"添加 698 从节点档案 → 配置 1 分钟采集任务（A相电压 20000201）→ 捕捉 06H-F230 主动上报。",
  flow:[{no:"01",step:"task_cfg",ev:"simcon.expect 00H-F1",ms:5000},{no:"02",step:"report",ev:"simcon.recv 06H-F230",ms:60000}],
  task:"tasks/anhui_698_meter_collect.json",steps:3,resp:1,rules:["common","provinces/anhui"]},
 {id:"open_close",name:"开关阀",module:"cco",desc:"下发阀控命令并确认执行回执。",flow:[{no:"01",step:"ctrl",ev:"simcon.expect 00H-F1",ms:5000}],task:"tasks/open_close.json",steps:2,resp:0,rules:["common"]},
 {id:"search_meter",name:"搜表",module:"cco",desc:"广播搜表并等待从节点注册。",flow:[{no:"01",step:"bcast",ev:"simcon.expect 06H-F1",ms:30000}],task:"tasks/search_meter.json",steps:2,resp:0,rules:["common"]}
];

/* 激励任务步骤（对齐 tasks/anhui_698_meter_collect.json） */
const STEPS=[
 {no:"1",name:"添加 698 从节点档案",tag:"send",afn:"11H",fn:"F1",
  tm:"expect 00H-F1 · 5.0 s",
  params:[["action","add","动作：add"],["addr","080000000000","6 字节 BCD 从节点地址"],["protocol","3","3 = DL/T 698.45"]],
  hex:"68 11 00 00 00 00 00 00 00 00 11 01 00 01 08 00 00 00 00 00 03 1E 16",
  note:"语义化构帧：n=1 自动补、地址小端 BCD、seq 自动递增；帧内 L/CS 由 frame_codec 计算。"},
 {no:"2",name:"配置采集任务（11H-F231）",tag:"send",afn:"11H",fn:"F231",
  tm:"expect 11H-F231 · 5.0 s",
  params:[["task_no","1","任务号"],["action","enable","使能"],["protocol","3","698.45"],["cycle_min","1","周期 1 分钟"],["items","[20000201]","A相电压 OAD，reply_len=1"]],
  hex:"68 13 00 00 00 00 00 00 00 00 11 40 1D 01 01 03 01 01 40 00 02 01 01 B8 16",
  note:"安徽扩展 F231：采集项数组 {meter_type, item, reply_len}；OAD 20000201 来自协议字典。"},
 {no:"3",name:"等待 06H-F230 主动上报",tag:"recv_only",afn:"06H",fn:"F230",
  tm:"recv_only · 60 s",
  params:[["expect","06H-F230","采集数据上报"],["respond","00H-F1","内置应答自动回确认"]],
  hex:"",note:"不主动发送，纯监听；内置应答规则 anhui.ack.meter 命中后自动回 00H-F1。"}
];

const RUNS=[
 {id:"run-20260830-0114",sc:"join_anhui · STA 入网（安徽）",res:"pass",resC:"res-pass",t:"01:14:32",dur:"38.2 s",note:"证据 12 项 · 3/3 步命中"},
 {id:"run-20260830-0109",sc:"minute_collect · 分钟采集",res:"inconclusive",resC:"res-inc",t:"01:09:55",dur:"61.0 s",note:"串口无下行 · 硬件降级，不可判定"},
 {id:"run-20260830-0102",sc:"minute_collect · 分钟采集",res:"fail",resC:"res-fail",t:"01:02:11",dur:"65.3 s",note:"join.sta.ok 超 30 s 未出现"},
 {id:"run-20260829-1837",sc:"search_meter · 搜表",res:"pass",resC:"res-pass",t:"18:37:40",dur:"29.8 s",note:"证据 6 项"}
];

/* 标注清单 */
const ANNOS=[
 ["1","场景列表：场景 = 期望流程 + 激励任务 + 监控规则三者绑定（FR-5.3），JSON 文件即场景"],
 ["2","expected_flow：事件步用 loghooks 事件名 + within_ms 宽容窗，绿点=上次执行命中"],
 ["3","激励步骤语义化（ADR-5）：send 只写 afn/fn + 业务参数，构帧由 scenario_codec 完成"],
 ["4","构帧预览：语义参数 → 单 68 标准帧，L/CS/seq/地址域全部自动装配，所见即所发"],
 ["5","expect 支持 local 应答与主动上报捕捉，expect_timeout 独立可配"],
 ["6","内置应答 responders：match 06H-F230 → reply 00H-F1，任务级可覆盖全局规则表"],
 ["7","monitor.rules/sources：挂 loghooks 规则与事件源（module_log），支撑 expected_flow 判定"],
 ["8","执行历史：inconclusive 独立琥珀色——不可判定绝不伪装 pass/fail（FR-5）"],
 ["9","执行入口在验证工作台：/api/run 编排执行，证据（帧/事件/断言）就地钻取"]
];

/* ═══════════ 渲染 ═══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let curSc=0,curStep=0;

function renderScenarios(){
  $("#scList").innerHTML=SCENARIOS.map((s,i)=>`
   <button class="sc-card${i===curSc?' on':''}" data-s="${i}">
     <span class="sc-r"><span class="dot" style="color:${i===curSc?'var(--ac)':'var(--tx-4)'}"></span>${esc(s.name)}
       <span class="mono">${s.id}</span></span>
     <span class="sc-s">${esc(s.desc)}</span>
     <span class="sc-meta"><span class="chip" style="height:17px;font-size:10px">${s.flow.length} 事件步</span>
       <span class="chip" style="height:17px;font-size:10px">${s.steps} 激励步</span>
       ${s.resp?`<span class="chip chip--mg" style="height:17px;font-size:10px">${s.resp} 应答规则</span>`:''}</span>
   </button>`).join("");
  $$("#scList .sc-card").forEach(b=>b.addEventListener("click",()=>{
    curSc=+b.dataset.s;curStep=0;renderScenarios();renderEdit();renderStep();
  }));
}

function colorHex(raw){
  const p=raw.trim().split(/\s+/);
  if(p.length<8)return p.map(x=>`<span class="hx s-DU">${x}</span>`).join(" ");
  const c=new Array(p.length).fill("s-DU");
  c[0]="s-68";c[p.length-1]="s-16";c[p.length-2]="s-CS";c[1]="s-L";c[2]="s-L";c[3]="s-C";
  for(let i=4;i<Math.min(10,p.length-2);i++)c[i]="s-R";
  if(p.length>10){c[10]="s-AFN";c[11]="s-DT";if(p.length>12)c[12]="s-DT";}
  return p.map((x,i)=>`<span class="hx ${c[i]}" title="偏移 ${i}">${x}</span>`).join(" ");
}

function renderEdit(){
  const s=SCENARIOS[curSc];
  $("#edHead").innerHTML=`
   <div class="ed-r1"><b>${esc(s.name)}</b><span class="chip chip--ac" style="margin-left:auto">${s.module}</span>
     <span class="chip chip--ghost">${esc(s.task)}</span></div>
   <div class="ed-desc">${esc(s.desc)}</div>`;
  $("#edBody").innerHTML=`
   <div class="ed-label">期望流程 · expected_flow（事件步）</div>
   <div class="flow">${s.flow.map(f=>`
     <div class="flow-it${f.hit?' hit':''}">
       <span class="flow-no">${f.no}</span>
       <span class="flow-nm">${esc(f.step)}</span>
       <span class="flow-ev">${esc(f.ev)}</span>
       <span class="flow-ms">within ${f.ms>=1000?(f.ms/1000)+"s":f.ms+"ms"}</span>
     </div>`).join("")}</div>
   <div class="ed-label">激励任务 · stimulus（语义化步骤）</div>
   <div>${STEPS.map((st,i)=>`
     <button class="step${i===curStep?' on':''}" data-st="${i}" style="display:block;width:100%;text-align:left;position:relative">
       <span class="step-h"><span class="step-no">${st.no}</span>
         <span class="step-nm">${esc(st.name)}</span>
         <span class="step-tags">
           <span class="chip chip--${st.tag==="send"?"tx":st.tag==="recv_only"?"rx":"ac"}" style="height:18px;font-size:10px">${st.tag}</span>
           <span class="chip chip--ghost" style="height:18px;font-size:10px">${st.afn} ${st.fn}</span></span></span>
     </button>`).join("")}
   </div>
   <div class="ed-label">内置应答 · responders</div>
   ${s.resp?`<div class="resp-row"><span class="mono">anhui.ack.meter</span><span class="arr">match</span>
     <span class="chip chip--rx" style="height:18px;font-size:10px">06H-F230</span><span class="arr">→ reply</span>
     <span class="chip chip--tx" style="height:18px;font-size:10px">00H-F1</span>
     <span style="margin-left:auto;font-size:10.5px;color:var(--tx-4)">local 格式</span></div>`
    :`<div class="resp-row" style="color:var(--tx-4)">无任务级应答规则，使用全局内置应答表</div>`}
   <div class="ed-label">监控 · monitor</div>
   <div class="moni">${s.rules.map(r=>`<span class="chip chip--ac">${esc(r)}</span>`).join("")}
     <span class="chip">sources: module_log</span></div>`;
  $$("#edBody .step").forEach(b=>b.addEventListener("click",()=>{
    curStep=+b.dataset.st;
    $$("#edBody .step").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    renderStep();
  }));
}

function renderStep(){
  const st=STEPS[curStep],s=SCENARIOS[curSc];
  $("#parHead").innerHTML=`
   <div class="par-t1"><b>${esc(st.name)}</b>
     <span class="chip chip--ac">${st.afn} ${st.fn}</span>
     <span class="chip chip--${st.tag==="send"?"tx":st.tag==="recv_only"?"rx":"ac"}">${st.tag}</span>
     <span class="chip chip--ghost">${esc(st.tm)}</span></div>
   <div class="par-t2">${esc(st.note)}</div>`;
  $("#parBody").innerHTML=`
   <div class="card open"><div class="card-h">
     <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
     <b>语义参数 · send.params</b><span class="hint">${st.params.length} 项</span>
     <svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="card-b"><div><div class="card-in">
      <table class="ft"><thead><tr><th style="width:32%">参数</th><th style="width:30%">取值</th><th>说明</th></tr></thead><tbody>
      ${st.params.map(p=>`<tr><td><div class="nm mono" style="font-size:11.5px">${esc(p[0])}</div></td>
        <td><span class="mono">${esc(p[1])}</span></td><td><div class="ds" style="margin:0">${esc(p[2])}</div></td></tr>`).join("")}
      </tbody></table>
    </div></div></div></div>
   ${st.hex?`
   <div class="card open"><div class="card-h">
     <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>
     <b>构帧预览 · 所见即所发</b><span class="hint">单 68 标准帧</span>
     <svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="card-b"><div><div class="card-in">
      <div class="hexwrap"><div class="hex">${colorHex(st.hex)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-1)">
          <span style="font-size:10.5px;color:var(--tx-4)">68H|L|C|R|A|AFN|DT|数据单元|CS|16H · 与模拟集中器页帧预览同规则着色</span></div></div>
    </div></div></div></div>`:""}
   <div class="card open"><div class="card-h">
     <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h9a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H4z"/><path d="M20 4h-1a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H20z"/></svg>
     <b>场景 JSON</b><span class="hint">${esc(s.id)}</span>
     <svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="card-b"><div><div class="card-in"><div class="jsonwrap">{
  <span class="k2">"id"</span>: <span class="s2">"${esc(s.id)}"</span>,
  <span class="k2">"expected_flow"</span>: [
    { <span class="k2">"step"</span>: <span class="s2">"${esc(s.flow[0].step)}"</span>, <span class="k2">"event_type"</span>: <span class="s2">"${esc(s.flow[0].ev)}"</span>, <span class="k2">"within_ms"</span>: <span class="v2">${s.flow[0].ms}</span> }, … ],
  <span class="k2">"stimulus"</span>: { <span class="k2">"task_file"</span>: <span class="s2">"${esc(s.task)}"</span> },
  <span class="k2">"monitor"</span>: { <span class="k2">"rules"</span>: [<span class="s2">"${esc((s.rules[0]||"").replace("/","\\/"))}"</span>…], <span class="k2">"sources"</span>: [<span class="s2">"module_log"</span>] }
}</div></div></div></div></div>`;
  $$("#parBody .card-h").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
}

/* 底部执行历史 */
$("#runList").innerHTML=RUNS.map(r=>`
 <div class="run-row"><span class="run-id">${r.id}</span><span class="run-sc">${esc(r.sc)}</span>
   <span class="res ${r.resC}">${r.res}</span><span class="run-t">${r.t} · ${r.dur}</span>
   <span class="run-note">${esc(r.note)}</span>
   <button class="btn btn--sm btn--ghost" style="margin-left:auto">证据 →</button></div>`).join("");

/* 交互 */
$("#sbToggle").addEventListener("click",()=>$("#app").classList.toggle("collapsed"));
$("#grpRespH").addEventListener("click",()=>{
  const g=$("#grpResp");g.classList.toggle("open");
  $("#grpRespH").setAttribute("aria-expanded",g.classList.contains("open"));
});
$("#trH").addEventListener("click",e=>{
  if(e.target.closest(".tag")||e.target.closest(".chip")||e.target.closest(".btn"))return;
  $("#traffic").classList.toggle("fold");
});
$("#annoH").addEventListener("click",e=>{
  if(e.target.closest("#annoHl"))return;
  $("#anno").classList.toggle("open");
});
$("#annoHl").addEventListener("click",e=>{
  e.stopPropagation();document.body.classList.toggle("anno-on");
  $("#annoHl").textContent=document.body.classList.contains("anno-on")?"取消高亮":"高亮区域";
});
$("#annoBtn").addEventListener("click",()=>$("#anno").classList.toggle("open"));
$("#annoList").innerHTML=ANNOS.map(a=>`<li><b>${a[0]}</b><span>${esc(a[1])}</span></li>`).join("");

/* 初始态 */
renderScenarios();
renderEdit();
renderStep();
</script>
</body>
</html>
