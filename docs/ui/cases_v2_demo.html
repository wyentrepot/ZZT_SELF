<!--
  ════════════════════════════════════════════════════════════════════
  cases_v2_demo.html —— REQS-0044「块—用例—场景模型」配套 UI 静态高保真 Demo
  · 单文件、内嵌 CSS/JS/mock 数据，零外部依赖，离线双击可开
  · 双主题：墨夜深色 midnight + 晴昼浅色 daylight（prefers-color-scheme 自动 + 手动切换钮）
  · 只做演示：mock 数据，不连后端，不改生产页面（apps/workbench/static/pages/cases/ 未动）
  区块：
    A 顶栏 + 台架就绪横幅（5 口 + 关键事实三态；不满足 → 运行按钮置灰并给原因）
    B 左侧分组/筛选（常用度 / 设备域 / 业务场景 / 省份 / 协议 / 实体类型）
    C 用例清单（列表 + 可展开步骤 do/expect + 勾选 → 存方案 → 立即运行/按方案运行；清单式，无拖拽）
    D 结果视图（核心）：Excel 式结果表，列固定：测试大类|测试子类|用例名称|测试步骤|结果|失败原因/说明
      汇总条：产品通过率 x/y（台架准备行不计入分母，单独显示「台架准备 n 项」）
      失败原因列：点击「证据」展开证据路径（悬停有 title）
    E 折叠区「开发者详情」：块级明细（块 id / kind / side_effect / version / 观测摘要）只出现在这里
      —— 用户层不得出现 archive.add / nwk.topology 等块名（REQS-0042 D11-2）
  四态约定（沿用现有 cases 页语义）：✔ pass=绿 / ✘ fail=红 / ⊘ blocked=灰 / ？ inconclusive=黄
  mock 数据结构与冻结契约一致：run.report.rows[] 九字段 + run.report.summary（见 JS 顶部注释）
  自检：window.__selfcheck() —— 控制台调用或在报告脚本中执行；截图见 docs/ui/shots/
  ════════════════════════════════════════════════════════════════════
-->
<script>
/* 防主题闪跳：手动选择过的主题优先，否则跟随系统 prefers-color-scheme */
(function () {
  var t = "midnight";
  try {
    var saved = localStorage.getItem("cases-v2-demo-theme");
    if (saved === "midnight" || saved === "daylight") t = saved;
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) t = "daylight";
  } catch (e) {}
  document.documentElement.dataset.theme = t;
})();
</script>

<style id="tok-css">

/* L2 Semantic —— 墨夜深色（默认，挂 :root 作 JS 失效兜底） */
:root, html[data-theme="midnight"]{

  --color-accent-fg:var(--p-cyan-ink);
  --color-accent-soft:color-mix(in srgb,var(--p-cyan-500) 14%,transparent);
  --color-status-pass:var(--p-green-500);
  --color-status-pass-bg:color-mix(in srgb,var(--p-green-500) 15%,transparent);
  --color-status-pass-border:color-mix(in srgb,var(--p-green-500) 35%,transparent);
  --color-status-warn:var(--p-orange-500);
  --color-status-warn-bg:color-mix(in srgb,var(--p-orange-500) 15%,transparent);
  --color-status-warn-border:color-mix(in srgb,var(--p-orange-500) 35%,transparent);
  --color-status-fail:var(--p-red-500);
  --color-status-fail-bg:color-mix(in srgb,var(--p-red-500) 15%,transparent);
  --color-status-fail-border:color-mix(in srgb,var(--p-red-500) 35%,transparent);
  --color-status-info:var(--p-blue-500);
  --color-status-info-bg:color-mix(in srgb,var(--p-blue-500) 15%,transparent);
  --color-status-info-border:color-mix(in srgb,var(--p-blue-500) 35%,transparent);
  /* REQS-0012 为 inconclusive 定义了独立紫色相；本 Demo 按任务口径沿用现有 cases 页四态语义
     （inconclusive=黄/warn），故不引入紫色组件引用，此处仅登记语义位备查。 */
}
/* L2 Semantic —— 晴昼浅色 */
html[data-theme="daylight"]{
  color-scheme:light;
  --color-bg-canvas:var(--p-slate-50); --color-bg-surface:var(--p-slate-0);
  --color-bg-raised:#eef2f7; --color-bg-input:var(--p-slate-0);
  --color-bg-hover:rgb(15 23 42/.05); --color-bg-active:rgb(15 23 42/.09);

  --color-fg-subtle:#475569; --color-fg-dim:#5a6b80; --color-fg-inverse:var(--p-slate-0);

  --color-accent-fg:var(--p-cyan-ink);
  --color-accent-soft:color-mix(in srgb,var(--p-cyan-500) 12%,transparent);

  --color-status-warn:var(--p-orange-700);
  --color-status-warn-bg:color-mix(in srgb,var(--p-orange-700) 12%,transparent);

  --color-status-fail:var(--p-red-700);
  --color-status-fail-bg:color-mix(in srgb,var(--p-red-700) 12%,transparent);
  --color-status-fail-border:color-mix(in srgb,var(--p-red-700) 30%,transparent);
  --color-status-info:var(--p-blue-700);
  --color-status-info-bg:color-mix(in srgb,var(--p-blue-700) 12%,transparent);

<style id="ui-css">
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.6;color:var(--color-fg-default);background:var(--color-bg-canvas)}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.spacer{flex:1}
.hint{color:var(--color-fg-muted);font-size:var(--fs-sm)}
.dim{color:var(--color-fg-dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:var(--radius-full);border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px;border-radius:var(--radius-sm)}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:var(--fs-lg);font-weight:var(--fw-semibold);white-space:nowrap}
.brandtag{font-size:var(--fs-xs);color:var(--color-fg-dim);border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:0 6px;font-family:var(--font-mono);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:var(--radius-full);font-size:var(--fs-sm);border:1px solid var(--color-border-strong);color:var(--color-fg-muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--color-fg-muted)}
.pill.info{color:var(--color-status-info);border-color:var(--color-status-info-border);background:var(--color-status-info-bg)}
.pill.info .dot{background:var(--color-status-info)}
button{font:inherit;cursor:pointer;border:1px solid var(--color-border-strong);background:var(--color-bg-raised);color:var(--color-fg-default);border-radius:var(--radius-md);padding:4px 11px}
button:hover{border-color:var(--color-border-emphasis)}
button.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-fg);font-weight:var(--fw-bold)}
button.primary:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
button:disabled{opacity:.42;cursor:not-allowed}
button.mini{padding:2px 9px;font-size:var(--fs-sm);border-radius:var(--radius-sm)}
select,input[type=text],input[type=search]{font:inherit;padding:3px 8px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);background:var(--color-bg-input);color:var(--color-fg-default)}
select{cursor:pointer}
input[type=search]{width:190px}

/* ---------- A · 台架就绪横幅 ---------- */
.bench{margin:10px 16px 0;border:1px solid var(--color-border-default);border-radius:var(--radius-md);background:var(--color-bg-raised);padding:8px 12px 6px}
.bench.is-ready{border-color:var(--color-status-pass-border);background:var(--color-status-pass-bg)}
.bench.is-blocked{border-color:var(--color-status-fail-border);background:var(--color-status-fail-bg)}
.bench-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bench-head b{font-size:var(--fs-md)}
.bench-state{font-size:var(--fs-sm);font-weight:var(--fw-bold)}
.bench.is-ready .bench-state{color:var(--color-status-pass)}
.bench.is-blocked .bench-state{color:var(--color-status-fail)}
.bench-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.bench-group .glabel{font-size:var(--fs-xs);color:var(--color-fg-muted);min-width:34px}
.port,.fact{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:1px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border-strong);color:var(--color-fg-muted);background:var(--color-bg-surface)}
.port .dot,.fact .dot{width:6px;height:6px;border-radius:50%;background:var(--color-fg-muted)}
.port.on,.fact.yes{color:var(--color-status-pass);border-color:var(--color-status-pass-border);background:var(--color-status-pass-bg)}
.port.on .dot,.fact.yes .dot{background:var(--color-status-pass)}
.port.off,.fact.no{color:var(--color-status-fail);border-color:var(--color-status-fail-border);background:var(--color-status-fail-bg)}
.port.off .dot,.fact.no .dot{background:var(--color-status-fail)}
.fact.unknown{color:var(--color-status-warn);border-color:var(--color-status-warn-border);background:var(--color-status-warn-bg)}
.fact.unknown .dot{background:var(--color-status-warn)}
.bench-reasons{list-style:none;margin:6px 0 2px;padding:0}
.bench-reasons li{font-size:var(--fs-sm);color:var(--color-status-fail);padding:1px 0}
.bench-reasons li:before{content:"✕ ";font-weight:var(--fw-bold)}

/* ---------- B+C 主体：左栏 + 主区 ---------- */
.layout{display:flex;align-items:flex-start}
.rail{flex:0 0 216px;width:216px;border-right:1px solid var(--color-border-default);padding:10px 10px 24px;position:sticky;top:79px;max-height:calc(100vh - 79px);overflow:auto}
.rail-head{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:6px}
.rail-head b{font-size:var(--fs-sm);color:var(--color-fg-muted);font-weight:var(--fw-semibold)}
.rail .fsearch{width:100%;margin-bottom:8px}
.rail-group{margin-bottom:10px}
.rail-group>b{display:block;font-size:var(--fs-xs);color:var(--color-fg-dim);letter-spacing:.04em;margin:2px 0 3px;border-bottom:1px dashed var(--color-border-default);padding-bottom:2px}
.rail-item{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-sm);color:var(--color-fg-default);user-select:none}
.rail-item:hover{background:var(--color-bg-hover)}
.rail-item.on{background:var(--color-accent-soft);color:var(--color-accent-emphasis);font-weight:var(--fw-semibold)}
.rail-item .rcount{margin-left:auto;font-size:var(--fs-xs);color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.rail-item .swatch{width:6px;height:6px;border-radius:50%;background:var(--color-border-emphasis);flex:none}
.rail-item.on .swatch{background:var(--color-accent-emphasis)}
.rail-clear{margin-top:2px}
.main{flex:1;min-width:0;padding:12px 16px 40px}

/* ---------- C · 用例清单 ---------- */
.listbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.case{border:1px solid var(--color-border-default);border-radius:var(--radius-md);background:var(--color-bg-surface);margin-bottom:6px;padding:6px 10px;cursor:pointer}
.case:hover{border-color:var(--color-border-strong)}
.case-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case-head .pick{width:14px;height:14px;accent-color:var(--color-accent);cursor:pointer;flex:none}
.case-head .tw{border:none;background:none;padding:0 2px;color:var(--color-fg-muted);font-size:var(--fs-xs)}
.case-title{font-weight:var(--fw-semibold)}
.case-id{font-size:var(--fs-xs);color:var(--color-fg-muted)}
.case-steps{font-size:var(--fs-xs);color:var(--color-fg-muted);border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:0 6px;white-space:nowrap}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:var(--fw-bold);padding:0 8px;border-radius:var(--radius-full);border:1px solid var(--color-border-strong)}
.kind-regression{color:var(--color-accent-emphasis);border-color:var(--color-accent);background:var(--color-accent-soft)}
.kind-scenario{color:var(--color-status-info);border-color:var(--color-status-info-border);background:var(--color-status-info-bg)}
.kind-setup{color:var(--color-fg-muted);background:var(--color-bg-raised)}
.case-cat{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:var(--fs-xs);color:var(--color-fg-muted);border:1px dashed var(--color-border-strong);border-radius:var(--radius-sm);padding:0 6px}
.tag.solid{border-style:solid;border-color:var(--color-border-default)}
.lastvd{margin-left:auto}
.vd{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:.04em;padding:0 9px;border-radius:var(--radius-full);border:1px solid var(--color-border-strong);color:var(--color-fg-muted);background:var(--color-bg-raised)}
.vd-pass{color:var(--color-status-pass);border-color:var(--color-status-pass-border);background:var(--color-status-pass-bg)}

.vd-blocked{color:var(--color-fg-muted);border-color:var(--color-border-strong);background:var(--color-bg-raised)}

.step-do{font-size:var(--fs-sm)}
.step-expect{font-size:var(--fs-sm);color:var(--color-fg-muted)}

.empty{padding:36px 16px;text-align:center;color:var(--color-fg-muted)}

/* ---------- D · 结果视图 ---------- */
#view-result[hidden]{display:none}

table.res{width:100%;min-width:1060px;border-collapse:collapse;font-size:var(--fs-sm)}
table.res th,table.res td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--color-border-default);vertical-align:top}
table.res th{position:sticky;top:0;z-index:2;background:var(--color-bg-input);color:var(--color-fg-dim);font-size:var(--fs-xs);font-weight:var(--fw-semibold);letter-spacing:.05em;border-bottom:1px solid var(--color-border-strong);white-space:nowrap}
table.res tbody tr:nth-child(even){background:var(--color-bg-hover)}
table.res td.c-name{font-weight:var(--fw-semibold);white-space:nowrap}
table.res td.c-steps{max-width:360px}
table.res td.c-reason{min-width:230px}
table.res tr.r-setup td{color:var(--color-fg-muted)}
table.res tr.r-fail{border-left:3px solid var(--color-status-fail);background:var(--color-status-fail-bg)}
table.res tr.r-blocked{border-left:3px solid var(--color-border-emphasis);background:var(--color-bg-raised)}
table.res tr.r-inconclusive{border-left:3px solid var(--color-status-warn);background:var(--color-status-warn-bg)}
table.res tr.r-pass{border-left:3px solid var(--color-status-pass)}
.muted-dash{color:var(--color-fg-dim)}
.reason{font-size:var(--fs-sm)}
table.res tr.r-fail .reason{color:var(--color-status-fail);font-weight:var(--fw-medium)}
table.res tr.r-blocked .reason{color:var(--color-fg-muted)}
table.res tr.r-inconclusive .reason{color:var(--color-status-warn)}
.ev-toggle{margin-top:2px;padding:0 7px;font-size:var(--fs-xs);border-radius:var(--radius-sm);color:var(--color-fg-muted)}
.ev-paths{margin-top:3px;display:flex;flex-direction:column;gap:3px}
.ev-paths code{font-family:var(--font-mono);font-size:var(--fs-xs);padding:1px 7px;border-radius:var(--radius-sm);border:1px solid var(--color-border-default);background:var(--color-bg-raised);color:var(--color-fg-muted);cursor:pointer}
.ev-paths code:hover{color:var(--color-accent-emphasis);border-color:var(--color-border-emphasis)}

/* ---------- E · 开发者详情（块级明细只在这里；用户层禁止块名，REQS-0042 D11-2） ---------- */
details.dev{margin-top:14px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg-surface)}
details.dev summary{cursor:pointer;padding:7px 12px;font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-fg-muted);user-select:none;list-style:none}
details.dev summary:before{content:"▸ ";color:var(--color-fg-dim)}
details.dev[open] summary:before{content:"▾ "}
details.dev summary:hover{color:var(--color-fg-default)}
.dev-body{padding:0 12px 12px;border-top:1px dashed var(--color-border-default)}
.dev-note{margin:8px 0;font-size:var(--fs-sm);color:var(--color-fg-muted)}
.dev-row{margin-bottom:10px}
.dev-row>b{font-size:var(--fs-sm)}
table.bk{width:100%;border-collapse:collapse;margin-top:4px;font-size:var(--fs-xs)}
table.bk th,table.bk td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--color-border-default);vertical-align:top}
table.bk th{color:var(--color-fg-dim);font-weight:var(--fw-semibold)}
table.bk td.bkid{font-family:var(--font-mono);color:var(--color-fg-subtle);white-space:nowrap}
table.bk td{color:var(--color-fg-muted)}

/* ---------- 运行进度条（mock：setTimeout 模拟） ---------- */
#jobbar{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--color-border-strong);background:var(--color-bg-raised);padding:8px 16px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:var(--sh-md)}
#jobbar[hidden]{display:none}
#jobbar b{font-size:var(--fs-sm);white-space:nowrap}
.prog{flex:1;height:6px;border-radius:var(--radius-full);background:var(--color-bg-canvas);border:1px solid var(--color-border-default);overflow:hidden;min-width:140px}
.prog>b{display:block;height:100%;width:0;background:var(--color-accent);transition:width var(--dur-150) var(--ease-out)}

/* ---------- 存方案对话框 / Toast ---------- */
.modal{position:fixed;inset:0;background:var(--color-bg-active);display:none;align-items:center;justify-content:center;z-index:40}
.modal.show{display:flex}
.modal .box{width:400px;max-width:92vw;border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);background:var(--color-bg-surface);padding:14px 16px;box-shadow:var(--sh-md)}
.modal h2{font-size:var(--fs-md);margin-bottom:10px}
.modal .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.modal .row label{font-size:var(--fs-sm);color:var(--color-fg-muted);min-width:56px}
.modal .row input{flex:1}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--color-accent);color:var(--color-accent-fg);padding:5px 16px;border-radius:var(--radius-md);opacity:0;transition:all .25s var(--ease-out);z-index:50;pointer-events:none;font-size:var(--fs-sm);font-weight:var(--fw-medium)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 窄屏 <1000px：侧栏改横向铺开，表格横向滚动 ---------- */
@media (max-width:999px){
  .layout{flex-direction:column;align-items:stretch}
  .main{width:100%;max-width:100%}
  .rail{position:static;width:auto;flex:none;max-height:none;border-right:none;border-bottom:1px solid var(--color-border-default)}
  .rail-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 14px}
  .main{padding:10px 12px 40px}
  .tablewrap{max-height:none}
  .topbar{gap:6px}
}

<!-- ═══ 顶栏 ═══ -->
<header class="topbar">
  <h1>用例库 v2</h1>

  <span class="pill info"><span class="dot"></span>Demo · mock 数据未连后端</span>

<!-- ═══ A · 台架就绪横幅：5 口 + 关键事实三态；不满足时运行按钮置灰并逐项给原因 ═══ -->

    <b>台架就绪</b>
    <span class="bench-state" id="bench-state">检测中…</span>

    <span class="hint">运行闸门：5 口全部可用 且 门控事实全为“是”</span>
    <button class="mini" id="btn-bench-fault" title="演示：模拟台架故障，观察运行按钮置灰与原因列表">模拟故障</button>
  </div>
  <div class="bench-group"><span class="glabel">串口</span><span id="bench-ports"></span></div>
  <div class="bench-group"><span class="glabel">事实</span><span id="bench-facts"></span></div>
  <ul class="bench-reasons" id="bench-reasons"></ul>
</section>

<div class="layout">
  <!-- ═══ B · 左侧：分组/筛选 ═══ -->
  <aside class="rail">
    <div class="rail-head"><b>分组 / 筛选</b><span class="hint" id="rail-total"></span></div>
    <input type="search" id="q" class="fsearch" placeholder="搜用例名 / ID / 步骤…">
    <div class="rail-groups" id="rail-body"></div>
    <button class="mini rail-clear" id="btn-clear-filter">清除筛选</button>
  </aside>

  <main class="main">
    <!-- ═══ C · 用例清单（列表 = 用例名 + 步骤数 + 分类徽标，可展开步骤 do/expect） ═══ -->
    <section id="view-list">
      <div class="listbar">
        <span class="hint" id="list-count"></span>
        <span class="hint dim">点击卡片展开步骤；勾选 → 存方案 → 运行。清单式编排，无流程图拖拽（REQS-0044 §6.6）</span>
      </div>
      <div id="case-list"></div>
    </section>

    <!-- ═══ D · 结果视图（本轮核心）：Excel 式结果表 + 汇总条 ═══ -->
    <section id="view-result" hidden>
      <div class="res-head">
        <b id="res-title">运行结果</b>
        <span class="evchip" id="res-dir" title="证据目录（REQS-0044 §4.4：regression → data/case_runs/&lt;run_id&gt;/）"></span>
        <span class="hint" id="res-meta"></span>
        <span class="spacer"></span>
        <button class="mini" id="btn-back-list">↩ 返回清单</button>
        <button class="mini" id="btn-rerun">▶ 再跑一次</button>
      </div>
      <div class="sumbar" id="sumbar"></div>
      <div class="tablewrap">
        <table class="res" id="res-table">
          <thead><tr>
            <th>测试大类</th><th>测试子类</th><th>用例名称</th><th>测试步骤</th><th>结果</th><th>失败原因 / 说明</th>
          </tr></thead>
          <tbody id="res-tbody"></tbody>
        </table>
      </div>
      <!-- ═══ E · 折叠区「开发者详情」：块级明细只出现在这里 ═══ -->
      <details class="dev" id="dev-details">
        <summary>开发者详情 · 块级观测明细（内部块 id 仅此处可见）</summary>
        <div class="dev-body" id="dev-body"></div>
      </details>
    </section>
  </main>
</div>

<!-- 运行进度条（setTimeout 模拟） -->
<div id="jobbar" hidden>
  <b id="job-line">运行中</b>
  <span class="hint" id="job-stage"></span>
  <div class="prog"><b id="job-fill"></b></div>
  <span class="hint" id="job-cur"></span>
</div>

/* ---------- 结果行 mock（冻结契约 verbatim 行） ---------- */
function evPaths(runId, kind, reqId) {
  if (kind === "scenario") {
    return ["evidence/" + (reqId || "req") + "/" + runId + "/result.json",
            "evidence/" + (reqId || "req") + "/" + runId + "/logs/run.log"];
  }
  return ["data/case_runs/" + runId + "/result.json",
          "data/case_runs/" + runId + "/logs/run.log"];
}

  return [
    { group:null, subgroup:null, name:"scenario_load",       kind:"setup", steps_text:null, verdict:"pass", reason:null,

      evidence_paths:["data/case_runs/" + runId + "/result.json"], counts_as_product:false }
  ];
}

      verdict:"pass", reason:null,

    counts_as_product:true,

}

/* ---------- 工具 ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function benchReady() {
  if (S.benchFault) return false;
  return BENCH_PORTS.every(function (p) { return p.usable; }) &&
         BENCH_FACTS.every(function (f) { return !f.gate || f.state === "yes"; });
}
function benchReasons() {
  var list = [];
  BENCH_PORTS.forEach(function (p) {
    if (!p.usable) {
      var msg = "串口 " + p.name + " " + p.com + " 不可用";
      if (S.benchFault && p.name === "simcon") msg += "：串口桥未运行（先跑「台架准备·标准自检」）";
      list.push(msg);
    }
  });
  BENCH_FACTS.forEach(function (f) {
    if (f.gate && f.state === "no") list.push("关键事实「" + f.label + "」= 否");
  });
  return list;
}

function filteredCases() {
  var f = S.filters;
  return CASES.filter(function (c) {
    if (f.usage && c.usage !== f.usage) return false;
    if (f.domain && c.domain !== f.domain) return false;
    if (f.scene && c.scene !== f.scene) return false;
    if (f.region && c.region !== f.region) return false;
    if (f.entity && c.kind !== f.entity) return false;
    if (f.protocol && c.protocols.indexOf(f.protocol) < 0) return false;
    if (f.q) {
      var hay = (c.id + " " + c.name + " " + c.steps.map(function (s) { return s.do + " " + s.expect; }).join(" ")).toLowerCase();
      if (hay.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function (a, b) {
    var ur = { common:0, normal:1, rare:2 };
    var dr = { CCO:0, STA:1, ECU:2, bench:3 };
    return (ur[a.usage] - ur[b.usage]) || (dr[a.domain] - dr[b.domain]) || a.name.localeCompare(b.name, "zh");
  });
}

/* ---------- 运行（mock）：组装 run.report（冻结契约形状） ---------- */
function buildReport(ids, runId) {
  var rows = setupRows(runId).slice();
  ids.forEach(function (id) {
    var c = CASES.filter(function (x) { return x.id === id; })[0];
    if (!c || c.kind === "setup") return;              // 台架准备用例的产出就是前置三行
    if (id === "C101") { rows.push(afnRows(runId)[0]); return; }
    if (id === "C102") { rows.push(afnRows(runId)[1]); return; }
    if (id === "C001") { rows = rows.concat(meterRows(runId)); return; }
    var ev = evPaths(runId, c.kind, c.req_id);
    rows.push({
      group: c.scene === "协议一致性" ? "AFN功能/协议一致性" : c.scene,
      subgroup: c.domain,
      name: c.name,
      kind: c.kind,
      steps_text: c.steps.map(function (s, i) { return (i + 1) + "." + s.do; }).join("；"),
      verdict: "pass",
      reason: null,
      evidence_paths: [ev[0]],
      counts_as_product: c.kind !== "setup"
    });
  });
  var tally = { pass:0, fail:0, blocked:0, inconclusive:0 };
  var product = rows.filter(function (r) { return r.counts_as_product; });
  rows.forEach(function (r) { tally[r.verdict] += 1; });
  var p = product.filter(function (r) { return r.verdict === "pass"; }).length;
  return {
    id: runId,
    report: {
      rows: rows,
      summary: {
        total: rows.length,
        pass: tally.pass, fail: tally.fail, blocked: tally.blocked, inconclusive: tally.inconclusive,
        product_pass_rate: p + "/" + product.length
      }
    }
  };
}
function makeRunId() {
  var d = new Date();
  function two(n) { return (n < 10 ? "0" : "") + n; }
  return "run-" + d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + "-" +
         two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}

/* ---------- 运行模拟：进度 → 完成 → 切结果视图 ---------- */
function startRun(ids) {
  if (S.running || !ids.length) return;
  S.running = true;
  updateRunButtons();
  var runId = makeRunId();
  var bar = $("jobbar");
  bar.hidden = false;
  $("job-line").textContent = "运行 " + runId;
  var fill = $("job-fill");
  var stages = [
    { p:22, stage:"台架准备…", cur:"3 项准备动作（scenario_load / basicfeature_import / toolthread_import 的业务动作）", t:700 },
    { p:48, stage:"执行用例 1/" + ids.length + "…", cur:ids.map(function (id) { var c = CASES.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; })[0], t:600 },
    { p:72, stage:"执行用例 2/" + ids.length + "…", cur:ids.map(function (id) { var c = CASES.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; })[1] || "…", t:600 },
    { p:90, stage:"执行用例 " + ids.length + "/" + ids.length + "…", cur:"按方案顺序执行，首败即停", t:500 },
    { p:100, stage:"汇总四态…", cur:"块观测 → 步骤期望 → 结论聚合", t:400 }
  ];
  var i = 0;
  (function step() {
    if (i >= stages.length) {
      bar.hidden = true;
      S.running = false;
      var run = buildReport(ids, runId);
      S.lastReport = run.report;
      S.lastRunId = runId;
      S.lastIds = ids;
      CASES.forEach(function (c) { delete S.lastRun[c.id]; });
      ids.forEach(function (id) {
        var rows = run.report.rows.filter(function (r) { return r.name === caseName(id); });
        if (rows.length) S.lastRun[id] = rows[0].verdict;
      });
      renderList();
      renderResult(run);
      toast("运行完成 · 产品通过率 " + run.report.summary.product_pass_rate);
      return;
    }
    var st = stages[i++];
    fill.style.width = st.p + "%";
    $("job-stage").textContent = st.stage;
    $("job-cur").textContent = st.cur || "";
    setTimeout(step, st.t);
  })();
}
function caseName(id) {
  var c = CASES.filter(function (x) { return x.id === id; })[0];
  return c ? c.name : "";
}

function renderResult(run) {
  var rows = run.report.rows, sum = run.report.summary;
  $("view-list").hidden = true;
  $("view-result").hidden = false;
  $("res-title").textContent = "运行结果 " + run.id;
  $("res-dir").textContent = "data/case_runs/" + run.id + "/";
  var setupN = rows.filter(function (r) { return r.kind === "setup"; }).length;
  $("res-meta").textContent = "用时 12.4s（mock）· " + rows.length + " 行，其中台架准备 " + setupN + " 行不计入通过率";
  $("res-dir").title = "证据目录：regression → data/case_runs/<run_id>/；scenario → evidence/<req_id>/<run_id>/（REQS-0044 §4.4）";

  /* 汇总条：产品通过率 x/y（台架准备行不计入分母，单独显示） */
  $("sumbar").innerHTML =
    '<div class="sum-rate"><b>' + esc(sum.product_pass_rate) + '</b><span>产品通过率</span></div>' +
    '<span class="sum-chip pass">✔ 通过 ' + sum.pass + "</span>" +
    '<span class="sum-chip fail">✘ 失败 ' + sum.fail + "</span>" +
    '<span class="sum-chip blocked">⊘ 阻断 ' + sum.blocked + "</span>" +
    '<span class="sum-chip inconclusive">？ 说不清 ' + sum.inconclusive + "</span>" +
    '<span class="sum-setup">台架准备 ' + setupN + " 项（不计入分母）</span>" +
    '<span class="hint">setup 行不出现在产品通过率分母（REQS-0044 §4.3，防「永真用例」）</span>';

  /* Excel 式结果表 */
  $("res-tbody").innerHTML = rows.map(function (r) {
    var m = VERDICT_META[r.verdict] || VERDICT_META.pass;
    var dash = '<span class="muted-dash">—</span>';
    var reasonHtml = r.reason ? '<span class="reason">' + esc(r.reason) + "</span>" : dash;
    if (r.evidence_paths && r.evidence_paths.length) {
      var paths = r.evidence_paths.map(function (p) { return "<code>" + esc(p) + "</code>"; }).join("");
      reasonHtml += '<div><button class="ev-toggle" data-ev="1" title="证据路径（点击展开/收起）：' +
        esc(r.evidence_paths.join("  ")) + '">证据 ▸</button></div>' +
        '<div class="ev-paths" hidden>' + paths + "</div>";
    }
    return '<tr class="r-' + r.verdict + (r.kind === "setup" ? " r-setup" : "") + '">' +
      '<td>' + (r.group == null ? dash : esc(r.group)) + "</td>" +
      '<td>' + (r.subgroup == null ? dash : esc(r.subgroup)) + "</td>" +
      '<td class="c-name">' + esc(r.name) + "</td>" +
      '<td class="c-steps">' + (r.steps_text == null ? dash : esc(r.steps_text)) + "</td>" +
      '<td><span class="vd vd-' + r.verdict + '" data-verdict="' + r.verdict + '" title="' + m.name + '">' +
        m.glyph + " " + m.name + "</span></td>" +
      '<td class="c-reason">' + reasonHtml + "</td>" +
    "</tr>";
  }).join("");

  Array.prototype.forEach.call(document.querySelectorAll("#res-tbody .ev-toggle"), function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var box = btn.parentElement.nextElementSibling;
      var open = box.hidden;
      box.hidden = !open;
      btn.textContent = open ? "证据 ▾" : "证据 ▸";
    });
  });

  /* E 区：开发者详情（块级明细；块名只允许出现在这里） */
  var devRows = rows.map(function (r) {
    var key = r.name + "#" + r.verdict;
    var d = DEV_DETAILS[key];
    if (!d) return "";
    var blocks = d.blocks.map(function (b) {
      return "<tr><td class='bkid'>" + esc(b.id) + "</td><td>" + esc(b.kind) + "</td><td>" +
        esc(b.side_effect) + "</td><td>v" + b.version + "</td><td>" + esc(b.obs) + "</td></tr>";
    }).join("");
    return '<div class="dev-row"><b>' + esc(r.name) + "</b> " + verdictChip(r.verdict) +
      (d.note ? '<div class="dev-note">' + esc(d.note) + "</div>" : "") +
      '<table class="bk"><thead><tr><th>块 id</th><th>kind</th><th>side_effect</th><th>ver</th><th>观测摘要</th></tr></thead><tbody>' +
      blocks + "</tbody></table></div>";
  }).join("");
  $("dev-body").innerHTML =
    '<p class="dev-note">按 REQS-0042 D11-2：内部块 id 禁止出现在用户层文本，仅本折叠区与 --json 可见。' +
    "块只观测不判定（REQS-0044 §4.2）：判据归步骤期望与用例聚合。</p>" + devRows;
  $("dev-details").open = false;
}

/* ---------- 主题 ---------- */
function updThemeBtn() {
  var t = document.documentElement.dataset.theme;
  $("btn-theme").textContent = t === "daylight" ? "☀️ 晴昼" : "🌙 墨夜";
}
window.__setTheme = function (t) {
  if (t !== "midnight" && t !== "daylight") return;
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("cases-v2-demo-theme", t); } catch (e) {}
  updThemeBtn();
};

/* ---------- 事件绑定 ---------- */
$("btn-theme").addEventListener("click", function () {
  window.__setTheme(document.documentElement.dataset.theme === "daylight" ? "midnight" : "daylight");
});
$("btn-bench-fault").addEventListener("click", function () {
  S.benchFault = !S.benchFault;
  BENCH_PORTS[0].usable = !S.benchFault;
  BENCH_FACTS[0].state = S.benchFault ? "no" : "yes";
  renderBench();
  toast(S.benchFault ? "已模拟台架故障：运行按钮置灰" : "台架恢复就绪");
});
$("q").addEventListener("input", function () { S.filters.q = this.value.trim(); renderList(); });
$("btn-clear-filter").addEventListener("click", function () {
  S.filters = { usage:"", domain:"", scene:"", region:"", protocol:"", entity:"", q:"" };
  $("q").value = "";
  renderRail(); renderList();
});
$("suite-select").addEventListener("change", function () { S.suiteId = this.value; renderSuites(); });
$("btn-del-suite").addEventListener("click", function () {
  if (!S.suiteId) return;
  S.suites = S.suites.filter(function (s) { return s.id !== S.suiteId; });
  S.suiteId = "";
  renderSuites();
  toast("方案已删除");
});
$("btn-save-suite").addEventListener("click", function () {
  $("suite-cover").textContent = "方案用例：" + selectedIds().length + " 条（" + selectedIds().join("、") + "）";
  $("suite-modal").classList.add("show");
  $("suite-id").focus();
});
$("suite-cancel").addEventListener("click", function () { $("suite-modal").classList.remove("show"); });
$("suite-ok").addEventListener("click", function () {
  var id = $("suite-id").value.trim() || ("suite_" + Date.now());
  var name = $("suite-name").value.trim() || id;
  S.suites.push({ id:id, name:name, case_ids:selectedIds(), stop_on_fail:true });
  S.suiteId = id;
  $("suite-modal").classList.remove("show");
  $("suite-id").value = ""; $("suite-name").value = "";
  renderSuites();
  toast("方案已保存：" + name);
});
$("btn-run-now").addEventListener("click", function () {
  var ids = selectedIds();
  if (!ids.length) { toast("先勾选用例"); return; }
  startRun(ids);
});
$("btn-run-suite").addEventListener("click", function () {
  var s = S.suites.filter(function (x) { return x.id === S.suiteId; })[0];
  if (!s) { toast("先选择方案"); return; }
  CASES.forEach(function (c) { S.sel[c.id] = s.case_ids.indexOf(c.id) > -1; });
  renderList(); updateRunButtons();
  startRun(s.case_ids.slice());
});
$("btn-back-list").addEventListener("click", function () {
  $("view-result").hidden = true;
  $("view-list").hidden = false;
});
$("btn-rerun").addEventListener("click", function () { startRun(S.lastIds.slice()); });

/* ---------- 自检（供控制台 / 截图脚本调用） ---------- */
/* 静态断言：契约形状、行数、四态类、块名泄漏（非折叠区）、令牌合规（ui-css 无色值字面量）、离线 */
window.__demoRenderResult = function () {
  var ids = ["C001", "C101", "C102"];
  var run = buildReport(ids, "run-20261124-153000");
  S.lastReport = run.report; S.lastRunId = run.id; S.lastIds = ids;
  renderResult(run);
  return run;
};
window.__demoShowList = function () {
  $("view-result").hidden = true;
  $("view-list").hidden = false;
};
window.__selfcheck = function () {
  var checks = [];
  function add(name, ok, detail) { checks.push({ name:name, ok:!!ok, detail:String(detail) }); }

  /* 1. 冻结契约形状：默认报告每行恰九字段、枚举合法、setup 行 null 约定 */
  var run = buildReport(["C001", "C101", "C102"], "run-20261124-153000");
  var KEYS = ["group", "subgroup", "name", "kind", "steps_text", "verdict", "reason", "evidence_paths", "counts_as_product"];
  var shapeOK = true, shapeMsg = "";
  run.report.rows.forEach(function (r, i) {
    var keys = Object.keys(r).sort();
    if (keys.length !== KEYS.length || keys.join(",") !== KEYS.slice().sort().join(",")) {
      shapeOK = false; shapeMsg = "row#" + i + " 字段集不符：" + keys.join(",");
    }
    if (["setup", "regression", "scenario"].indexOf(r.kind) < 0) { shapeOK = false; shapeMsg = "row#" + i + " kind 非法"; }
    if (["pass", "fail", "blocked", "inconclusive"].indexOf(r.verdict) < 0) { shapeOK = false; shapeMsg = "row#" + i + " verdict 非法"; }
    if (typeof r.counts_as_product !== "boolean") { shapeOK = false; shapeMsg = "row#" + i + " counts_as_product 非布尔"; }
    if (r.kind === "setup" && (r.group !== null || r.subgroup !== null || r.steps_text !== null || r.reason !== null)) {
      shapeOK = false; shapeMsg = "row#" + i + " setup 行未按 null 约定";
    }
  });
  add("contract-shape（冻结契约九字段 + setup null 约定）", shapeOK, shapeMsg || run.report.rows.length + " 行全部合规");

  /* 2. 结果表行数：默认 9 行（台架准备 3 + AFN 2 + 抄表四态 4） */
  var tbody = document.getElementById("res-tbody");
  var trs = tbody.querySelectorAll("tr");
  add("result-rows（默认报告 9 行）", trs.length === 9, "渲染 " + trs.length + " 行");

  /* 3. 四态着色类齐备 */
  var states = ["pass", "fail", "blocked", "inconclusive"].map(function (v) {
    return { v:v, n:tbody.querySelectorAll(".vd-" + v).length };
  });
  add("four-state-classes（✔✘⊘？ 四态徽标类齐备）",
    states.every(function (s) { return s.n > 0; }),
    states.map(function (s) { return s.v + "=" + s.n; }).join(" "));

  /* 4. 汇总条：产品通过率 3/6 + 台架准备 3 项单独显示 */
  var bar = document.getElementById("sumbar").textContent;
  add("summary（产品通过率 3/6，台架准备 3 项不计分母）",
    bar.indexOf("3/6") > -1 && bar.indexOf("台架准备 3 项") > -1,
    bar.replace(/\s+/g, " ").slice(0, 120));

  /* 5. 块名泄漏：非折叠区（剔除 script/style/#dev-details）不得出现 xxx.yyy 形态内部块 id。
     按文本节点逐个扫描，避免相邻元素文本在 textContent 里拼接出跨界假命中。 */
  var hits = [];
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      var p = n.parentElement;
      while (p) {
        if (p.id === "dev-details") return NodeFilter.FILTER_REJECT;
        var tag = p.tagName;
        if (tag === "SCRIPT" || tag === "STYLE") return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  while (walker.nextNode()) {
    var m = (walker.currentNode.nodeValue || "").match(/[a-z_]+\.[a-z_0-9]+/g) || [];
    m.forEach(function (x) {
      if (x !== "result.json" && x !== "run.log") hits.push(x);   // 证据文件名白名单（非块 id）
    });
  }
  add("no-block-leak（用户层零块名，REQS-0042 D11-2）", hits.length === 0,
    hits.length ? "泄漏：" + hits.join(", ") : "非折叠区无 xxx.yyy 块 id（证据文件名 result.json/run.log 在白名单）");

  /* 6. 令牌合规：组件层 ui-css 无色值字面量（#hex / rgb( / hsl( / color-mix 裸色） */
  var ui = document.getElementById("ui-css").textContent;
  var hexHits = ui.match(/#[0-9a-fA-F]{3,8}\b/g) || [];
  var fnHits = ui.match(/\b(?:rgb|rgba|hsl|hsla)\(/g) || [];
  add("token-compliance（组件层只引用 var(--color-*)，无色值字面量）",
    hexHits.length === 0 && fnHits.length === 0,
    hexHits.length || fnHits.length ? "命中：" + hexHits.concat(fnHits).join(", ") : "ui-css 零色值字面量");

  /* 7. 离线：全文无外部 URL / CDN 引用 */
  var html = document.documentElement.outerHTML;
  var ext = (html.match(/(?:src|href)\s*=\s*["'](?:https?:)?\/\//g) || []);
  add("offline（零外部依赖）", ext.length === 0, ext.length ? "外部引用：" + ext.join(", ") : "无 http(s) 外链，双击可开");

  return { ok: checks.every(function (c) { return c.ok; }), checks: checks };
};

/* ---------- 启动 ---------- */
updThemeBtn();
renderBench();
renderRail();
renderSuites();
renderList();
</script>
