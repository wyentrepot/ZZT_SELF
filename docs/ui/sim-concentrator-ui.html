<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟集中器 · 1376.2 下发 — UI 设计稿</title>
<style>
/* ============ Design Tokens ============ */
:root{
  /* 背景层：三级递进，营造纵深（禁用纯黑/纯灰平铺） */
  --bg-0:#090c10;
  --bg-1:#0e1319;
  --bg-2:#131a22;
  --bg-3:#18212b;
  --bg-4:#1e2833;

  --line-1:#1f2935;
  --line-2:#2a3644;
  --line-3:#3a4a5c;

  --tx-1:#e8f0f7;
  --tx-2:#9aabbb;
  --tx-3:#65798c;
  --tx-4:#465768;

  /* 主色 = 工业青；次色 = 琥珀；点缀 = 品红 */
  --ac:#22d3ee;
  --ac-dim:#0e7490;
  --ac-soft:rgba(34,211,238,.12);
  --am:#f0b429;
  --am-soft:rgba(240,180,41,.12);
  --mg:#e879a8;

  --tx-c:#f0b429;      /* 发送 TX */
  --rx-c:#2dd4bf;      /* 接收 RX */
  --ok-c:#34d399;
  --warn-c:#fbbf24;
  --err-c:#f87171;

  --r-s:5px; --r-m:8px; --r-l:12px;
  --sp:4px;
  --ff:"HarmonyOS Sans SC","PingFang SC","Source Han Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --fm:"JetBrains Mono","Cascadia Mono","Sarasa Mono SC","Consolas",ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ff); font-size:13px; line-height:1.6; color:var(--tx-1);
  background:
    radial-gradient(1200px 700px at 12% -10%, #12212c 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, #17202b 0%, transparent 55%),
    var(--bg-0);
  overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--fm);font-variant-ligatures:none}

/* ============ 通用组件 ============ */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);
  font-size:11px;font-weight:500;letter-spacing:.02em;background:var(--bg-3);color:var(--tx-2);border:1px solid var(--line-1)}
.chip--ac{background:var(--ac-soft);color:var(--ac);border-color:rgba(34,211,238,.25)}
.chip--am{background:var(--am-soft);color:var(--am);border-color:rgba(240,180,41,.25)}
.chip--tx{background:rgba(240,180,41,.12);color:var(--tx-c);border-color:rgba(240,180,41,.28)}
.chip--rx{background:rgba(45,212,191,.12);color:var(--rx-c);border-color:rgba(45,212,191,.28)}
.chip--ghost{background:transparent;color:var(--tx-3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--bg-3);color:var(--tx-2);
  font-size:12.5px;font-weight:500;transition:all .14s var(--ease);white-space:nowrap}
.btn:hover{background:var(--bg-4);color:var(--tx-1);border-color:var(--line-3)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:linear-gradient(180deg,#22d3ee,#0ea5c4);color:#04222b;border-color:#0e9ab5;font-weight:500}
.btn--primary:hover{background:linear-gradient(180deg,#3fdcf5,#12b4d4);color:#04222b}
.btn--sm{height:26px;padding:0 10px;font-size:12px}
.btn--icon{width:30px;padding:0}
.btn--ghost{background:transparent;border-color:transparent;color:var(--tx-3)}
.btn--ghost:hover{background:var(--bg-3);color:var(--tx-1)}
.fld{width:100%;height:30px;padding:0 9px;border-radius:var(--r-m);background:var(--bg-1);
  border:1px solid var(--line-2);color:var(--tx-1);font-size:12.5px;transition:all .14s var(--ease)}
.fld:hover{border-color:var(--line-3)}
.fld:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
select.fld{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2365798c' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
.sec-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-2)}
.sec-h h3{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--tx-2);text-transform:none}
.sec-h .sp{margin-left:auto}

/* ============ 骨架 ============ */
.app{display:grid;grid-template-columns:var(--sb-w,232px) 1fr;height:100vh;
  transition:grid-template-columns .22s var(--ease)}
.app.collapsed{--sb-w:56px}

/* ---------- 侧栏（可收敛） ---------- */
.sb{display:flex;flex-direction:column;min-width:0;background:var(--bg-1);
  border-right:1px solid var(--line-1);position:relative;z-index:5}
.sb-top{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 13px;flex:none;
  border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}
.brand-mark{width:26px;height:26px;flex:none;border-radius:7px;
  background:linear-gradient(140deg,#22d3ee,#0e7490);display:grid;place-items:center}
.brand-mark svg{width:15px;height:15px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.brand-txt span{display:block;font-size:10.5px;color:var(--tx-3);white-space:nowrap}
.collapsed .brand-txt{opacity:0;pointer-events:none}
.collapsed .sb-top{justify-content:center;padding:0}
.sb-toggle{flex:none;width:28px;height:28px;border-radius:var(--r-m);display:grid;place-items:center;
  color:var(--tx-3);transition:all .14s var(--ease)}
.sb-toggle:hover{background:var(--bg-3);color:var(--tx-1)}
.collapsed .sb-toggle{transform:rotate(180deg)}

.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 8px 16px}
.nav-label{font-size:10px;letter-spacing:.12em;color:var(--tx-4);padding:12px 8px 5px;white-space:nowrap}
.collapsed .nav-label{opacity:0;height:14px;padding:8px 0 0;text-align:center;overflow:hidden}
.collapsed .nav-label::after{content:"";display:block;height:1px;background:var(--line-1);margin:6px 8px 0}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:var(--r-m);
  color:var(--tx-2);font-size:13px;cursor:pointer;position:relative;
  transition:background .14s var(--ease),color .14s var(--ease);width:100%;text-align:left}
.nav-item:hover{background:var(--bg-2);color:var(--tx-1)}
.nav-item.on{background:linear-gradient(90deg,var(--ac-soft),transparent 92%);color:var(--ac)}
.nav-item.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2.5px;
  border-radius:0 3px 3px 0;background:var(--ac)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:10.5px;color:var(--tx-4);font-family:var(--fm)}
.collapsed .nav-item{justify-content:center;padding:0}
.collapsed .nav-item .t,.collapsed .nav-item .cnt,.collapsed .nav-item .car{display:none}
.collapsed .nav-item.on::before{left:0}
.collapsed .nav-item::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--bg-4);border:1px solid var(--line-2);color:var(--tx-1);
  padding:5px 9px;border-radius:var(--r-s);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s var(--ease);z-index:40}
.collapsed .nav-item:hover::after{opacity:1}

/* 内置应答：可收缩分组 */
.grp{margin-top:2px}
.grp-h{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:var(--r-m);
  color:var(--tx-3);font-size:12.5px;cursor:pointer;transition:all .14s var(--ease);width:100%;text-align:left}
.grp-h:hover{background:var(--bg-2);color:var(--tx-2)}
.grp-h .car{width:13px;height:13px;flex:none;transition:transform .18s var(--ease);opacity:.7}
.grp.open .grp-h .car{transform:rotate(90deg)}
.grp-h .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.grp.open .grp-b{grid-template-rows:1fr}
.grp-b>div{overflow:hidden;min-height:0}
.grp-b .inner{padding:2px 0 4px 0}
.collapsed .grp-h{justify-content:center;padding:0}
.collapsed .grp-h .t,.collapsed .grp-h .car{display:none}
.collapsed .grp-b{display:none}
.sub-item{display:flex;align-items:center;gap:8px;height:29px;padding:0 9px 0 20px;border-radius:var(--r-m);
  color:var(--tx-3);font-size:12.5px;cursor:pointer;transition:all .14s var(--ease);width:100%;text-align:left}
.sub-item:hover{background:var(--bg-2);color:var(--tx-1)}
.sub-item.on{color:var(--ac);background:var(--ac-soft)}
.sub-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{width:5px;height:5px;border-radius:50%;flex:none}

.sb-foot{flex:none;padding:9px;border-top:1px solid var(--line-1);display:grid;gap:7px}
.com-card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-m);padding:8px 9px}
.com-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-3)}
.com-row+.com-row{margin-top:5px}
.com-row b{font-family:var(--fm);color:var(--tx-2);font-size:11.5px;font-weight:400}
.collapsed .sb-foot{padding:9px 7px}
.collapsed .com-card{display:none}
.collapsed .sb-foot .btn span{display:none}
.collapsed .sb-foot .btn{width:100%}

/* ---------- 主区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;flex:none;
  border-bottom:1px solid var(--line-1);background:var(--bg-1)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx-3);min-width:0}
.crumb b{color:var(--tx-1);font-weight:500;font-size:14px}
.crumb .sep{color:var(--tx-4)}
.top .sp{margin-left:auto}
.port{padding:0 8px}

/* 工作区：AFN 列 | Fn 列 | 参数列 */
.work{flex:1;display:grid;grid-template-columns:var(--c1,244px) var(--c2,252px) 1fr;min-height:0;
  transition:grid-template-columns .22s var(--ease)}
.work.c1-off{--c1:0px}
.work.c1-off .col-afn{border-right:none;overflow:hidden}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-1)}
.col+.col{border-left:1px solid var(--line-1)}
.col-body{flex:1;overflow-y:auto;min-height:0}

/* AFN 列 */
.afn-item{border-bottom:1px solid rgba(31,41,53,.6)}
.afn-h{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;text-align:left;
  transition:background .14s var(--ease);position:relative}
.afn-h:hover{background:var(--bg-2)}
.afn-item.open .afn-h{background:var(--bg-2)}
.afn-item.sel .afn-h{background:linear-gradient(90deg,var(--ac-soft),transparent)}
.afn-item.sel .afn-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac)}
.afn-code{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--ac);flex:none;
  min-width:30px;padding:1px 5px;border-radius:4px;background:var(--bg-3);text-align:center}
.afn-name{flex:1;min-width:0;font-size:12.5px;color:var(--tx-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afn-meta{display:flex;align-items:center;gap:6px;flex:none}
.afn-car{width:12px;height:12px;color:var(--tx-4);transition:transform .18s var(--ease);flex:none}
.afn-item.open .afn-car{transform:rotate(90deg)}
.afn-dir{font-size:10px;color:var(--tx-4);font-family:var(--fm);flex:none}

/* Fn 列 */
.fn-head{padding:10px 12px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none}
.fn-head .r1{display:flex;align-items:center;gap:8px}
.fn-head .r1 b{font-family:var(--fm);font-size:13px;color:var(--ac)}
.fn-head .r1 span{font-size:12.5px;color:var(--tx-1)}
.fn-head .sem{margin-top:7px;font-size:11.5px;color:var(--tx-3);line-height:1.55}
.fn-item{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 12px;text-align:left;
  border-bottom:1px solid rgba(31,41,53,.5);transition:background .14s var(--ease);position:relative}
.fn-item:hover{background:var(--bg-2)}
.fn-item.on{background:linear-gradient(90deg,var(--ac-soft),transparent)}
.fn-item.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--ac)}
.fn-no{font-family:var(--fm);font-size:11.5px;color:var(--tx-3);flex:none;min-width:34px;padding-top:1px}
.fn-item.on .fn-no{color:var(--ac)}
.fn-nm{flex:1;min-width:0;font-size:12.5px;color:var(--tx-2);line-height:1.5}
.fn-item.on .fn-nm{color:var(--tx-1)}
.fn-todo{font-size:10px;color:var(--tx-4);display:block;font-family:var(--fm)}
.empty{display:grid;place-items:center;height:100%;padding:32px 20px;text-align:center;color:var(--tx-4)}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:12px}
.empty p{font-size:12.5px;line-height:1.7}

/* 参数列 */
.par{display:flex;flex-direction:column;min-height:0;background:var(--bg-1)}
.par-head{padding:12px 16px;border-bottom:1px solid var(--line-1);background:var(--bg-2);flex:none}
.par-t1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.par-t1 b{font-size:15px;font-weight:500;letter-spacing:.01em}
.par-t2{margin-top:7px;font-size:12px;color:var(--tx-3);line-height:1.6}
.par-t2 em{font-style:normal;color:var(--am);font-family:var(--fm)}
.par-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}

.card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-l);overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;
  background:var(--bg-3);border-bottom:1px solid transparent;transition:background .14s var(--ease)}
.card-h:hover{background:var(--bg-4)}
.card.closed .card-h{border-bottom-color:transparent}
.card.open .card-h{border-bottom-color:var(--line-1)}
.card-h .ic{width:15px;height:15px;color:var(--ac);flex:none}
.card-h b{font-size:12.5px;font-weight:500}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--tx-4);display:flex;align-items:center;gap:6px}
.card-h .car{width:13px;height:13px;color:var(--tx-4);transition:transform .18s var(--ease)}
.card.open .card-h .car{transform:rotate(90deg)}
.card-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.card.open .card-b{grid-template-rows:1fr}
.card-b>div{overflow:hidden;min-height:0}
.card-in{padding:13px}

/* 字段表 */
.ft{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ft th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--tx-4);
  padding:0 8px 7px;border-bottom:1px solid var(--line-1)}
.ft td{padding:7px 8px;border-bottom:1px solid rgba(31,41,53,.55);vertical-align:top}
.ft tr:last-child td{border-bottom:none}
.ft .c-n{width:23%}
.ft .c-f{width:52px}
.ft .c-b{width:40px}
.ft .c-v{width:auto}
.ft .nm{color:var(--tx-1);font-size:12px}
.ft .ds{margin-top:3px;font-size:11px;color:var(--tx-4);line-height:1.55}
.ft .fmt{font-family:var(--fm);font-size:10.5px;color:var(--tx-3)}
.ft .byt{font-family:var(--fm);font-size:11px;color:var(--tx-3);text-align:right}
.ft .in{width:100%;height:28px;padding:0 8px;border-radius:var(--r-s);background:var(--bg-1);
  border:1px solid var(--line-2);font-family:var(--fm);font-size:12px;transition:all .14s var(--ease)}
.ft .in:hover{border-color:var(--line-3)}
.ft .in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.ft select.in{font-family:var(--ff);font-size:12px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2365798c' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center;padding-right:22px;appearance:none}
.ft tr.ro .nm::after{content:"上行";margin-left:6px;font-size:10px;color:var(--rx-c);
  border:1px solid rgba(45,212,191,.3);border-radius:3px;padding:0 4px;background:rgba(45,212,191,.1)}

.bits{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bit{font-family:var(--fm);font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--bg-1);border:1px solid var(--line-2);color:var(--tx-3)}
.bit i{font-style:normal;color:var(--am)}

/* 帧预览 */
.hexwrap{background:var(--bg-0);border:1px solid var(--line-1);border-radius:var(--r-m);padding:11px 12px}
.hex{font-family:var(--fm);font-size:12.5px;line-height:2;letter-spacing:.04em;word-break:break-all}
.hx{padding:1px 3px;border-radius:3px;cursor:default;transition:background .12s var(--ease)}
.hx:hover{outline:1px solid var(--line-3)}
.s-68,.s-16{color:var(--mg)}
.s-L{color:var(--mg)}
.s-C{color:var(--am)}
.s-R{color:var(--tx-2)}
.s-A{color:var(--rx-c)}
.s-AFN{color:var(--ac);font-weight:500}
.s-DT{color:#a78bfa}
.s-DU{color:var(--tx-1)}
.s-CS{color:var(--am)}
.hexlg{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-1)}
.hexlg span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx-4)}
.hexlg i{width:8px;height:8px;border-radius:2px;font-style:normal}
.par-foot{flex:none;padding:11px 16px;border-top:1px solid var(--line-1);background:var(--bg-2);
  display:flex;align-items:center;gap:10px}
.par-foot .sp{margin-left:auto}
.par-foot .meta{font-size:11px;color:var(--tx-4);font-family:var(--fm)}

/* ---------- 底部收发记录 ---------- */
.traffic{flex:none;display:flex;flex-direction:column;background:var(--bg-1);
  border-top:1px solid var(--line-2);height:var(--th,268px);transition:height .22s var(--ease)}
.traffic.fold{--th:37px}
.tr-h{display:flex;align-items:center;gap:10px;height:37px;padding:0 12px;flex:none;
  cursor:pointer;user-select:none;background:var(--bg-2)}
.tr-h:hover{background:var(--bg-3)}
.tr-h .car{width:13px;height:13px;color:var(--tx-3);transition:transform .18s var(--ease)}
.traffic:not(.fold) .tr-h .car{transform:rotate(90deg)}
.tr-h .ttl{font-size:12.5px;font-weight:500;letter-spacing:.02em}
.tr-h .sp{margin-left:auto}
.seg{display:flex;background:var(--bg-1);border:1px solid var(--line-2);border-radius:var(--r-m);padding:2px;gap:2px}
.seg button{height:22px;padding:0 10px;border-radius:5px;font-size:11.5px;color:var(--tx-3);transition:all .14s var(--ease)}
.seg button:hover{color:var(--tx-1)}
.seg button.on{background:var(--bg-4);color:var(--tx-1)}
.traffic.fold .tr-h .seg,.traffic.fold .tr-h .tr-act{display:none}
.tr-body{flex:1;overflow-y:auto;min-height:0}

.tx-row{border-bottom:1px solid rgba(31,41,53,.55);transition:background .12s var(--ease)}
.tx-row:hover{background:var(--bg-2)}
.tx-row.open{background:var(--bg-2)}
.tx-main{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;width:100%;text-align:left}
.tx-main .car{width:11px;height:11px;color:var(--tx-4);transition:transform .18s var(--ease);flex:none}
.tx-row.open .tx-main .car{transform:rotate(90deg)}
.tm{font-family:var(--fm);font-size:11px;color:var(--tx-4);flex:none;width:76px}
.dir{display:inline-flex;align-items:center;gap:4px;font-family:var(--fm);font-size:10.5px;font-weight:500;
  width:44px;flex:none;padding:1px 0;border-radius:3px;justify-content:center}
.dir.tx{color:var(--tx-c);background:rgba(240,180,41,.12)}
.dir.rx{color:var(--rx-c);background:rgba(45,212,191,.12)}
.afn-tag{font-family:var(--fm);font-size:11px;color:var(--ac);flex:none;
  background:var(--bg-3);border-radius:3px;padding:1px 5px}
.fn-tag{font-family:var(--fm);font-size:11px;color:var(--tx-3);flex:none;min-width:32px}
.sum{flex:1;min-width:0;font-size:12px;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raw{font-family:var(--fm);font-size:10.5px;color:var(--tx-4);flex:none;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.len{font-family:var(--fm);font-size:10.5px;color:var(--tx-4);flex:none;width:34px;text-align:right}

.tx-det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.tx-row.open .tx-det{grid-template-rows:1fr}
.tx-det>div{overflow:hidden;min-height:0}
.det-in{padding:2px 12px 14px 43px;display:grid;gap:11px}
.sem-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;border-radius:var(--r-m);
  background:var(--bg-3);border:1px solid var(--line-1)}
.sem-banner .k{font-size:10.5px;color:var(--tx-4);letter-spacing:.06em}
.sem-banner .v{font-size:12.5px;color:var(--tx-1)}
.sem-banner .v em{font-style:normal;color:var(--ac);font-family:var(--fm)}
.det-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
@media (max-width:1180px){.det-grid{grid-template-columns:minmax(0,1fr)}
  .work{grid-template-columns:var(--c1,200px) var(--c2,210px) 1fr}}
.det-box{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-m);overflow:hidden;min-width:0}
.det-box h5{font-size:10.5px;font-weight:400;letter-spacing:.08em;color:var(--tx-4);
  padding:7px 11px;background:var(--bg-3);border-bottom:1px solid var(--line-1)}
.det-box .bd{padding:10px 11px}
.hexwrap.sm{padding:9px 10px}
.hex.sm{font-size:11.5px;line-height:1.85}

/* ---------- 标注层 ---------- */
.anno{position:fixed;right:16px;bottom:16px;width:290px;z-index:60;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);
  box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.anno-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg-3);
  border-bottom:1px solid var(--line-1);cursor:pointer}
.anno-h b{font-size:12px;font-weight:500}
.anno-h .sp{margin-left:auto}
.anno-h .car{width:13px;height:13px;color:var(--tx-3);transition:transform .18s var(--ease)}
.anno.open .anno-h .car{transform:rotate(90deg)}
.anno-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease)}
.anno.open .anno-b{grid-template-rows:1fr}
.anno-b>div{overflow:hidden;min-height:0}
.anno-l{max-height:46vh;overflow-y:auto;padding:8px}
.anno-l li{display:flex;gap:9px;padding:6px 6px;border-radius:var(--r-s);font-size:11.5px;
  color:var(--tx-2);line-height:1.55;cursor:default}
.anno-l li:hover{background:var(--bg-3)}
.anno-l li b{font-family:var(--fm);font-size:10.5px;color:var(--am);flex:none;width:15px;height:15px;
  border-radius:3px;background:var(--am-soft);display:grid;place-items:center;margin-top:2px}
.anno-l li s{text-decoration:none;color:var(--tx-4)}

.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;flex:none;border-radius:3px;background:var(--am-soft);color:var(--am);
  font-family:var(--fm);font-size:10px;cursor:help;vertical-align:middle}
.tag::after{content:attr(data-d);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--bg-4);border:1px solid var(--line-3);color:var(--tx-1);padding:6px 9px;border-radius:var(--r-s);
  font-family:var(--ff);font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s var(--ease);z-index:70}
.tag:hover::after{opacity:1}
body.anno-on [data-an]{outline:1px dashed var(--am);outline-offset:2px;border-radius:var(--r-s)}
body.anno-on [data-an]::after{content:attr(data-an-t);position:absolute;top:-8px;right:-4px;
  background:var(--am);color:#23180a;font-size:9.5px;font-family:var(--fm);padding:0 4px;border-radius:3px;z-index:30}
body.anno-on .app>*{position:relative}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

<script>
/* ═══════════ 协议字典（源自 03_QGDW10376.2_全帧类型.md） ═══════════ */
const F=(n,f,b,d,c,o)=>({n,f,b,d,c,o});
const AFN=[
{code:"00H",name:"确认/否认",dir:"上行",route:"通用",sem:"从动站对下行命令的应答，分确认与否认两类，否认时携带错误状态字定位失败原因。",
 fns:[
  {no:"F1",name:"确认",dir:"上行",fields:[
    F("命令状态 + 信道状态","BS",4,"D7~D0 命令状态(0未处理/1已处理) + 1~7 信道状态；后续 3 字节覆盖 8~31 信道（0 忙 / 1 闲）","bits"),
    F("等待时间","BIN",2,"单位 s，告知启动站需等待的最短时间","num","s")]},
  {no:"F2",name:"否认",dir:"上行",fields:[
    F("错误状态字","BIN",1,"0通信超时 / 1无效数据单元 / 2长度错 / 3校验错误 / 4信息类不存在 / 5格式错误 / 6表号重复 / 7表号不存在 / 8电表应用层无应答 / 9主节点忙 / 10主节点不支持此命令 / 11从节点不应答 / 12从节点不在网内 / 109超过最大并发数 / 111正在抄读该表","select",
      [[0,"0 通信超时"],[1,"1 无效数据单元"],[2,"2 长度错"],[3,"3 校验错误"],[4,"4 信息类不存在"],[5,"5 格式错误"],[9,"9 主节点忙"],[10,"10 主节点不支持"],[11,"11 从节点不应答"],[12,"12 从节点不在网内"],[109,"109 超过最大并发数"],[111,"111 正在抄读该表"]])]}]},

{code:"01H",name:"初始化",dir:"下行",route:"通用",sem:"对本地通信模块做硬件复位，或清除其参数区/数据区档案，是开局与恢复现场的第一步。",
 fns:[
  {no:"F1",name:"硬件初始化（复位）",dir:"下行",fields:[]},
  {no:"F2",name:"参数区初始化",dir:"下行",fields:[]},
  {no:"F3",name:"数据区初始化",dir:"下行",fields:[]}]},

{code:"02H",name:"数据转发",dir:"下行",route:"无路由",sem:"集中器把一整帧电能表协议报文（645/698）塞进 1376.2 净荷，透传给指定从节点。",
 fns:[
  {no:"F1",name:"转发通信协议数据帧",dir:"下行",fields:[
    F("通信协议类型","BIN",1,"00H 透明传输 / 01H DL/T645-1997 / 02H DL/T645-2007 / 03H DL/T698.45","select",
      [[0,"00H 透明传输"],[1,"01H DL/T 645-1997"],[2,"02H DL/T 645-2007"],[3,"03H DL/T 698.45"]]),
    F("报文长度 L","BIN",1,"后续报文内容的字节数，跟随内容自动计算","num"),
    F("报文内容","—","L","被透传的完整电能表协议报文（如 645 读表帧）","hex")]}]},

{code:"03H",name:"查询数据",dir:"下行",route:"通用",sem:"集中器向本地通信模块/路由查询运行状态、参数与档案信息，是最高频的诊断类命令。",
 fns:[
  {no:"F1",name:"厂商代码和版本信息",dir:"查询",ro:1,fields:[]},
  {no:"F2",name:"噪声值",dir:"查询",ro:1,fields:[]},
  {no:"F3",name:"从节点侦听信息",dir:"下行",fields:[
    F("开始节点指针","BIN",1,"本次读取的起始从节点序号，用于分批拉取","num"),
    F("读取节点的数量 N","BIN",1,"N ≤ 16，单帧最多带回 16 个从节点","num")]},
  {no:"F4",name:"主节点地址",dir:"查询",ro:1,fields:[]},
  {no:"F5",name:"主节点状态字和通信速率",dir:"查询",ro:1,fields:[]},
  {no:"F6",name:"主节点干扰状态",dir:"下行",fields:[
    F("持续时间","BIN",1,"干扰检测持续时间，单位 min","num","min")]},
  {no:"F7",name:"读取从节点监控最大超时时间",dir:"查询",ro:1,fields:[]},
  {no:"F8",name:"查询无线通信参数",dir:"查询",ro:1,fields:[]},
  {no:"F9",name:"通信延时相关广播时长",dir:"下行",fields:[
    F("通信协议类型","BIN",1,"被测广播报文所遵循的下行电表协议","select",[[0,"00H 透明传输"],[2,"02H DL/T 645-2007"],[3,"03H DL/T 698.45"]]),
    F("报文长度 L","BIN",1,"广播报文字节数","num"),
    F("报文内容","—","L","用于测量广播通信时长的完整报文","hex")]},

$("#afnCol").addEventListener("click",e=>{

  $$(".afn-item").forEach(x=>{if(x!==el)x.classList.remove("open","sel")});

  curAFN=i;curFN=null;
  const a=AFN[i];
  const fh=$("#fnHead"); fh.hidden=false;
  fh.innerHTML=`
    <div class="r1"><b>AFN ${a.code}</b><span>${esc(a.name)}</span>
      <span class="chip chip--ghost" style="margin-left:auto">${a.dir}</span></div>

$("#fnCol").addEventListener("click",e=>{

function card(ic,title,hint,body,open,id){
  return `<div class="card ${open?'open':'closed'}" data-card="${id||''}">
    <div class="card-h">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>

}

function fldInput(f,idx){
  const ph=f.c==='num'?(f.o?'0':'0'):(f.c==='bcd'?'00 00 00 00 00 00':(f.c==='hex'?'00':'…'));
  if(f.c==='select')return `<select class="in">${f.o.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join("")}</select>`;
  return `<input class="in" value="" placeholder="${ph}">`;
}

function renderParam(f){
  const a=curAFN!==null?AFN[curAFN]:null;
  if(!a){
    $("#parHead").innerHTML=`<div class="par-t1"><b style="color:var(--tx-3)">未选择命令</b></div>

    $("#parBody").innerHTML=`<div class="empty" style="height:100%">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      <p>级联选择路径<br><span class="mono" style="color:var(--tx-3)">AFN 列 → Fn 列 → 字段参数</span></p></div>`;
    $("#frameMeta").textContent="— 字节 · CS —"; return;
  }
  const meta=[`<span class="chip chip--ac">AFN ${a.code} ${esc(a.name)}</span>`];

  meta.push(`<span class="chip chip--ghost">${f?f.dir:a.dir}</span>`);
  $("#parHead").innerHTML=`<div class="par-t1">${meta.join("")}</div>

  /* 数据单元字段 */
  let fldCard;
  if(!f){
    fldCard=card(ICON_FLD,"数据单元字段","—",
      `<div class="empty" style="height:120px"><p>请先在 Fn 列中选择一条具体命令</p></div>`,true,"fld");
  }else if(!f.fields.length){
    fldCard=card(ICON_FLD,"数据单元字段","无数据单元",
      `<div class="empty" style="height:110px"><p>该命令<strong style="color:var(--tx-2)">无数据单元</strong><br>帧内仅含 AFN + DT 标识，无需填写参数</p></div>`,true,"fld");
  }else{
    const rows=f.fields.map((x,i)=>`<tr>
      <td class="c-n"><div class="nm">${esc(x.n)}</div><div class="ds">${esc(x.d)}</div>

      <td class="c-f"><span class="fmt">${esc(x.f)}</span></td>
      <td class="c-b"><span class="byt">${esc(String(x.b))}</span></td>
      <td class="c-v">${fldInput(x,i)}</td></tr>`).join("");
    fldCard=card(ICON_FLD,"数据单元字段",`${f.fields.length} 项`,

  }

  /* 信息域 R */
  const rCard=card(ICON_R,"信息域 R · 下行 6 字节","默认全 0",`

    <table class="ft"><thead><tr><th class="c-n">字段</th><th class="c-f">格式</th><th class="c-b">字节</th><th class="c-v">取值</th></tr></thead><tbody>

      <tr><td><div class="nm">中继地址 A2</div><div class="ds">6 × 中继级别，无中继时省略</div></td><td class="c-f"><span class="fmt">BCD</span></td><td class="c-b"><span class="byt">6n</span></td><td class="c-v"><input class="in" placeholder="无中继" disabled style="opacity:.45"></td></tr>
      <tr><td><div class="nm">目的地址 A3</div><div class="ds">广播时固定 999999999999H</div></td><td class="c-f"><span class="fmt">BCD</span></td><td class="c-b"><span class="byt">6</span></td><td class="c-v"><input class="in" placeholder="99 99 99 99 99 99"></td></tr>
    </tbody></table>`,false,"a");

  /* 帧预览 */
  const seg=(cls,txt,tip)=>`<span class="hx ${cls}" title="${tip}">${txt}</span>`;
  const fprev=(f&&f.fields.length)

  const hCard=card(ICON_HEX,"帧预览 · 68H|L|C|R|A|AFN|DT|数据单元|CS|16H",`L = ${userLen} 字节`,`

function bindCards(){

    <div class="tx-row" data-r="${i}">

      <div class="tx-det"><div><div class="det-in">
        <div class="sem-banner">
          <span class="k">AFN</span><span class="v"><em>${r.afn}</em> ${esc(afnName(r.afn))}</span>
          <span class="k" style="margin-left:6px">FN</span><span class="v"><em>${r.fn}</em> ${esc(fnName(r.afn,r.fn))}</span>
          <span class="sp"></span>
          <span class="chip ${r.st==="err"?"chip--am":"chip--"+r.d}">${r.d==="tx"?"发送":"接收"}${r.st==="err"?" · 否认":""}</span>
        </div>
        <div class="det-grid">
          <div class="det-box">
            <h5>原始报文 · 逐段着色</h5>
            <div class="bd"><div class="hexwrap sm"><div class="hex sm">${colorHex(r.raw)}</div></div></div>
          </div>
          <div class="det-box">
            <h5>语义解释</h5>
            <div class="bd"><p style="font-size:12.5px;line-height:1.75;color:var(--tx-2)">${esc(r.sem)}</p></div>
          </div>
        </div>
        ${r.fields&&r.fields.length?`<div class="det-box">
          <h5>字段级解析 · ${r.fields.length} 项</h5>
          <div class="bd"><table class="ft"><thead><tr><th class="c-n">字段</th><th class="c-f">格式</th><th class="c-v">原始值</th><th class="c-v">解释</th></tr></thead><tbody>
          ${r.fields.map(f=>`<tr><td class="c-n"><div class="nm">${esc(f[0])}</div></td><td class="c-f"><span class="fmt">${esc(f[1])}</span></td>
            <td class="c-v"><span class="mono" style="color:var(--am);font-size:11.5px">${esc(f[2])}</span></td>
            <td class="c-v"><span style="font-size:11.5px;color:var(--tx-2)">${esc(f[3])}</span></td></tr>`).join("")}
          </tbody></table></div></div>`:''}
        ${r.ack?`<div class="det-box" style="border-color:rgba(52,211,153,.25)">
          <h5 style="background:rgba(52,211,153,.08);color:var(--ok-c)">应答回执 · ${r.ack.t}</h5>
          <div class="bd">
            <div class="hexwrap sm"><div class="hex sm">${colorHex(r.ack.raw)}</div></div>
            <p style="margin-top:8px;font-size:12px;color:${r.ack.st==="err"?"var(--err-c)":"var(--ok-c)"}">${esc(r.ack.txt)}</p>

function afnName(c){const a=AFN.find(x=>x.code===c);return a?a.name:"—"}
function fnName(c,fn){const a=AFN.find(x=>x.code===c);if(!a)return"—";const f=a.fns.find(x=>x.no===fn);return f?f.name:"—"}
function colorHex(raw){
  const p=raw.trim().split(/\s+/);
  if(p.length<8)return p.map(x=>`<span class="hx s-DU">${x}</span>`).join(" ");
  const c=new Array(p.length).fill("s-DU");
  c[0]="s-68";c[p.length-1]="s-16";c[p.length-2]="s-CS";c[1]="s-L";c[2]="s-L";c[3]="s-C";
  for(let i=4;i<Math.min(10,p.length-2);i++)c[i]="s-R";
  if(p.length>10){c[10]="s-AFN";if(p.length>11)c[11]="s-DT";if(p.length>12)c[12]="s-DT";}
  return p.map((x,i)=>`<span class="hx ${c[i]}" title="偏移 ${i}">${x}</span>`).join(" ");
}

});
$("#colToggle").addEventListener("click",()=>$("#work").classList.toggle("c1-off"));
$("#trH").addEventListener("click",e=>{
  if(e.target.closest(".seg")||e.target.closest(".tr-act")||e.target.closest(".tag"))return;
  $("#traffic").classList.toggle("fold");
});
$("#segF").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  $$("#segF button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  renderLog(b.dataset.f);
});
$("#annoH").addEventListener("click",e=>{
  if(e.target.closest("#annoHl"))return;
  $("#anno").classList.toggle("open");
});
$("#annoHl").addEventListener("click",e=>{
  e.stopPropagation();document.body.classList.toggle("anno-on");
  $("#annoHl").textContent=document.body.classList.contains("anno-on")?"取消高亮":"高亮区域";
});
$("#annoBtn").addEventListener("click",()=>$("#anno").classList.toggle("open"));
$("#annoList").innerHTML=ANNOS.map(a=>`<li><b>${a[0]}</b><span><s></s>${esc(a[1])}</span></li>`).join("");

/* 初始态 */
renderLog();
selectAFN(5);                                  /* 默认落在 AFN 05H 控制命令 */
$$(".afn-item")[5].classList.add("open","sel");
$$(".fn-item")[0].click();
</script>
</body>
</html>
