name: observe-workbench-logs
description: >-
  ZZT_SELF workbench AI observation skill (hardware-non-invasive). Query status,
  create bounded observations on existing module sessions or listener indexes,
  wait to terminal state, read artifacts, and fetch listener frame detail.
  Never ensures/starts/stops/sends/flashes serial or scans files; observe creates an auditable bounded operation.
